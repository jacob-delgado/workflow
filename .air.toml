# Air (github.com/air-verse/air) — backend live-reload for `task dev`: rebuilds
# and restarts `workflow --web` on any .go change. The frontend hot-reloads
# separately through Vite's HMR. A dev convenience; never part of a gate.
root = "."
# tmp/ is the shared scratch tree, so air keeps to tmp/air, all it deletes.
tmp_dir = "tmp/air"

[build]
cmd = "go build -o ./tmp/air/workflow ./cmd/workflow"
bin = "./tmp/air/workflow"
args_bin = ["--web"]
include_ext = ["go"]
exclude_dir = ["web", "tmp", "dist", "bin", "docs", "scripts", ".devcontainer"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true

[misc]
clean_on_exit = true
