name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **If this is a security vulnerability, stop here** and report it
        privately instead: [open a security advisory][advisory]. A public issue
        discloses the problem before there is a fix.

        [advisory]: https://github.com/jacob-delgado/workflow/security/advisories/new

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `workflow --version`, or the commit you built from.
      placeholder: v0.0.5
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the exact error output if there was any.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        The commands you ran, in order. A reproduction someone else can follow is
        the single most useful thing in a bug report.
      placeholder: |
        1. workflow config init
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `workflow doctor`
      description: |
        Optional, but it says which configuration file is in effect and what is
        missing, which answers most "why is it doing that?" questions.

        Safe to paste: doctor never prints a token.
      render: text
    validations:
      required: false
