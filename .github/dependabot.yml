# Dependabot configuration.
#
# MAJORS ARRIVE ALONE, MINORS ARRIVE TOGETHER. Every ecosystem below groups its
# minor and patch updates into a single pull request, so a weekly sweep costs one
# CI run instead of one per dependency. Majors are deliberately left out of the
# groups: a breaking bump should arrive as its own pull request, with its own CI
# evidence, and be reviewable on its own merits.
#
# COOLDOWN APPLIES ONLY TO SCHEDULED VERSION UPDATES. Dependabot *security*
# updates — the ones raised from a published advisory against something already
# in go.sum — bypass both the cooldown and the schedule, and GitHub raises them
# immediately. There is no configuration knob for that because none is needed:
# it is the unconditional default, and it is exactly the behavior this project
# wants. The seven-day cooldown guards against unknown compromised releases, not
# against published fixes for known ones; shipping a known CVE is the worse risk.
# That rule is written down in CLAUDE.md as well.
version: 2
updates:
  # Go modules.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # The actions used by CI, all of which are SHA-pinned with a version comment;
  # Dependabot updates both together. Official GitHub actions are a trusted
  # first-party publisher and skip the cooldown; third-party actions wait the
  # full seven days.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # The build container's base image (build/Dockerfile).
  - package-ecosystem: docker
    directory: "/build"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
