# Dependabot configuration.
#
# MAJORS ARRIVE ALONE, MINORS ARRIVE TOGETHER. Every ecosystem below groups its
# minor and patch updates into a single pull request, so a weekly sweep costs one
# CI run instead of one per dependency. Majors are deliberately left out of the
# groups: a breaking bump should arrive as its own pull request, with its own CI
# evidence, and be reviewable on its own merits. One web package also arrives
# alone, and two web majors are held back, for the reasons its npm entry gives.
#
# COOLDOWN APPLIES ONLY TO SCHEDULED VERSION UPDATES. Dependabot *security*
# updates — the ones raised from a published advisory against something already
# in go.sum or a lock — bypass both the cooldown and the schedule, and GitHub
# raises them immediately. There is no configuration knob for that because none
# is needed: it is the unconditional default, and it is exactly the behavior
# this project wants. The seven-day cooldown guards against unknown compromised
# releases, not against published fixes for known ones; shipping a known CVE is
# the worse risk. That rule is written down in CLAUDE.md as well.
version: 2
updates:
  # Go modules.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: ["minor", "patch"]

  # The web frontend's packages (web/package.json and web/yarn.lock).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      web:
        update-types: ["minor", "patch"]
        # openapi-ts copies its client runtime into src/api/generated, so its
        # bump must land with `corepack yarn gen` output or gen:check fails.
        # It arrives as its own pull request so it cannot hold up the group.
        exclude-patterns: ["@hey-api/openapi-ts"]
    # ESLint stays on 9: eslint-plugin-jsx-a11y and eslint-plugin-react declare
    # ESLint 9 at most, and run under 10 only outside their peer range. This
    # lifts once both declare ESLint 10. @eslint/js moves with it, since each
    # of its majors asks for the ESLint of the same major.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # TypeScript stays on 6 until a planned migration to 7, the compiler
      # rewritten in Go: typescript-eslint, which parses every TypeScript file
      # the web lint reads, declares TypeScript below 6.1, and a change of
      # compiler is taken on purpose, with its own changes beside it, rather
      # than as a pull request of Dependabot's (#138 was one). This lifts with
      # that migration.
      - dependency-name: "typescript"
        versions: ["7.x"]

  # markdownlint-cli2 and its whole tree (build/markdownlint/package.json and
  # its package-lock.json), which `task tools` installs with npm ci. A bump
  # re-resolves the lock, so the age gate dates every package it moves; the
  # cooldown holds markdownlint-cli2 itself. No pip entry beside it:
  # build/yamllint/requirements.txt pins every wheel's hash, which Dependabot
  # is not known to rewrite, so `task deps:yamllint` moves it.
  - package-ecosystem: npm
    directory: "/build/markdownlint"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      markdownlint:
        update-types: ["minor", "patch"]

  # The actions used by CI, all of which are SHA-pinned with a version comment;
  # Dependabot updates both together. Every action waits the full seven days,
  # GitHub's own (actions/*, github/*) as much as a third party's: a first-party
  # release can be compromised or broken too, and the week is what lets either
  # be found first. A fix for a published advisory against one still arrives at
  # once, as the security update the header describes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]

  # No docker entry for the build container: its FROM names the image through
  # the GO_VERSION build ARG, which Dependabot does not substitute, so it cannot
  # read the line. The digest moves by hand with each Go bump, as
  # build/Dockerfile says.

  # Nor does any entry read the Playwright image the end-to-end jobs in ci.yml
  # run in: no ecosystem bumps a workflow's container image. It moves by hand
  # with each @playwright/test bump the npm entry above opens, which
  # scripts/check-playwright-image.sh fails until it does (TRADE-58).

  # The documentation site's Hugo module (docs/go.mod), a separate module the
  # root gomod entry above does not reach.
  - package-ecosystem: gomod
    directory: "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      docs:
        update-types: ["minor", "patch"]

  # The devcontainer's base image and features (.devcontainer/devcontainer.json).
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
    groups:
      devcontainer:
        update-types: ["minor", "patch"]
