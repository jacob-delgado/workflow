name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token reads the repository and nothing more. One job asks for
# more: coverage-comment holds pull-requests: write, to post the coverage report
# on its pull request. Every other job only reads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch, to see which files a pull request changes.
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      # A pull request lints its Markdown only when it changes Markdown, docs/
      # or the markdownlint config; a push to main lints all of it, and a
      # change that cannot be compared with its base is linted too.
      - name: Decide whether the Markdown needs linting
        id: markdown
        run: |
          lint=true
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            status=0
            scripts/markdown-changed.sh "origin/${GITHUB_BASE_REF}" || status=$?
            if [ "${status}" -eq 1 ]; then
              lint=false
            fi
          fi
          echo "lint=${lint}" >>"${GITHUB_OUTPUT}"
      - run: task lint LINT_MARKDOWN="${LINT_MARKDOWN}"
        env:
          LINT_MARKDOWN: ${{ steps.markdown.outputs.lint }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      # Both floors come from the same Taskfile variables the local gate reads,
      # so CI and a developer's machine cannot disagree about them. The run's
      # events are kept for the pull request comment's test counts.
      - run: task test:cover GO_TEST_JSON=tmp/go-events.json
      # Condition coverage. gobco reads every package but the build-tagged twins
      # scripts/gobco-report.sh lists as unreadable (it fails on any other that
      # drops out of the report unannounced).
      - run: task cover:branch
      # Consumed by the coverage-comment and coverage-baseline jobs below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.out
            tmp/gobco/
          retention-days: 7
      # Counted whether the tests passed or not, so the comment shows a failure
      # as a count rather than leaving the row blank.
      - name: Count the Go tests
        if: always()
        run: |
          mkdir -p tmp/test-counts
          scripts/test-counts.sh go tmp/go-events.json "Go unit" > tmp/test-counts/go-unit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-counts-go-unit
          path: tmp/test-counts/go-unit.json
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - run: task build

  # The web frontend: its own lockfile-pinned toolchain, gated the same way the
  # Go code is. mise provisions the pinned Node; Corepack provides the yarn the
  # web/package.json packageManager field names. --immutable uses the committed
  # lockfile as-is (so the 7-day age gate, applied only when resolving, does not
  # re-run here) and fails if it and package.json disagree.
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      # The typed client is generated from api/openapi.yaml; regenerate and fail
      # on any diff, so a contract change that was not regenerated is caught here
      # rather than shipping a client that disagrees with the server.
      - name: Check the generated client is up to date
        run: yarn gen:check
      - run: yarn lint
      - run: yarn test --reporter=default --reporter=json --outputFile.json=reports/web-unit.json
      - name: Count the web unit tests
        if: always()
        working-directory: .
        run: |
          mkdir -p tmp/test-counts
          scripts/test-counts.sh vitest web/reports/web-unit.json "Web unit" > tmp/test-counts/web-unit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-counts-web-unit
          path: tmp/test-counts/web-unit.json
          retention-days: 7
      - run: yarn build
      # The build writes internal/web/dist, which is committed so `go install`
      # embeds the app; fail when the committed bundle is not this build's.
      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --quiet -- ../internal/web/dist \
            || [ -n "$(git ls-files --others --exclude-standard -- ../internal/web/dist)" ]; then
            echo "::error::The embedded web bundle is out of date. Run 'task web:build' and commit internal/web/dist."
            git status --short -- ../internal/web/dist
            exit 1
          fi

  # The frontend end-to-end run: build the SPA, serve it with Vite preview, and
  # drive it in a real browser, including an axe accessibility sweep. No backend:
  # the production build shows the shell and empty states, and the specs answer
  # the API themselves where they need data; a mockup build (VITE_MOCK) fills
  # every section for a second sweep and for the screenshots uploaded below. The
  # specs that drive a write against a running server are E2E (server)'s.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install the Playwright browser
        run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e
      - name: Count the end-to-end tests
        if: always()
        working-directory: .
        run: |
          mkdir -p tmp/test-counts
          scripts/test-counts.sh playwright web/reports/e2e.json "E2E" > tmp/test-counts/e2e.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-counts-e2e
          path: tmp/test-counts/e2e.json
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      # Every populated section, in both themes, at three widths — uploaded
      # pass or fail, so a visual change can be read by eye on the pull request.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: screens
          path: web/test-results/**/*.png
          retention-days: 7

  # The server-backed end-to-end run: `task build` makes the binary with the web
  # app embedded, scripts/e2e-server.sh serves `workflow --web` from it over a
  # throwaway repository with a bare origin, and the specs under web/e2e/server
  # stage, commit and push through the page, so a write reaches git. A job of
  # its own, not a step of E2E: the page must come from the binary rather than
  # from Vite preview.
  e2e-server:
    name: E2E (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install the Playwright browser
        run: yarn playwright install --with-deps chromium
      - name: Build the binary with the web app embedded
        run: task build
        working-directory: .
      - run: yarn test:e2e:server
      - name: Count the server-backed end-to-end tests
        if: always()
        working-directory: .
        run: |
          mkdir -p tmp/test-counts
          scripts/test-counts.sh playwright web/reports/e2e-server.json "E2E (server)" > tmp/test-counts/e2e-server.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-counts-e2e-server
          path: tmp/test-counts/e2e-server.json
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report-server
          path: web/playwright-report/
          retention-days: 7

  # Advisory, not a gate: run the unit and e2e suites once more to post one
  # consolidated table of counts and coverage to the run summary. The Test, Web
  # and E2E jobs above are what actually gate; this only reports.
  summary:
    name: Test summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: web
      - name: Install the Playwright browser
        run: yarn playwright install --with-deps chromium
        working-directory: web
      - name: Report the test counts and coverage
        run: task test:summary

  # The release build, run on every change so a broken cross-compilation — or a
  # loop that names every target the same and ships one — is caught on the pull
  # request rather than at the tag.
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - run: task release:binaries
      - run: task release:verify

  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # secrets:history scans the commits, not just the working tree; a
          # shallow clone would hide a secret committed earlier on the branch and
          # removed before the tip, which a rebase merge would still carry onto
          # main.
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - run: task vuln
      - run: task secrets
      - run: task secrets:history

  # Cache main's coverage numbers so a PR has something to compare against. Push
  # to main only; the PR job restores whatever this last wrote.
  coverage-baseline:
    name: Coverage baseline
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Compute the summary
        run: scripts/coverage-summary.sh coverage.out tmp/gobco > coverage-baseline.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: coverage-baseline-${{ github.sha }}
          path: coverage-baseline.json

  # Report coverage on the PR itself. Informational: the floors in the test job
  # are what fail a build, and this job is deliberately not something to gate on.
  coverage-comment:
    name: Coverage comment
    # Every suite that counts its tests, whether they passed or not — a failing
    # suite is the one whose counts matter most — with the coverage from Test
    # when it got that far. Not for a run a newer push cancelled: that run's
    # partial counts would overwrite the comment until the newer one lands.
    needs: [test, web, e2e, e2e-server]
    # Same-repository pull requests only. A fork's PR runs with a read-only token,
    # so the pull-requests: write this job asks for is not granted and it would
    # fail rather than comment — and it is reporting, never a gate, so skipping it
    # on forks costs nothing.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
      # Absent when the Test job failed before uploading it; the comment then
      # reads n/a for coverage.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-counts-*
          merge-multiple: true
          path: tmp/test-counts
      # The exact-SHA key never hits on a PR, so the prefix restore-key resolves
      # to the most recent baseline cached from main.
      - name: Restore main's baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-
          path: coverage-baseline.json
      - name: Compute this PR's summary
        run: |
          if [ -f coverage.out ]; then
            scripts/coverage-summary.sh coverage.out tmp/gobco > pr-coverage.json
          fi
      - name: Render the comment
        run: node scripts/pr-comment.mjs pr-coverage.json coverage-baseline.json tmp/test-counts > pr-comment.md
      - name: Upsert the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT: pr-comment.md
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- coverage-report -->'
            const body = fs.readFileSync(process.env.COMMENT, 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            // Every page, so a pull request with a long discussion updates its
            // comment rather than posting a second one.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  commit-lint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Pull requests only: this checks the commits a branch adds, and on a push to
    # main they have already been through this same gate.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same script lefthook's commit-msg hook runs, so a LEFTHOOK=0
      # bypass cannot land a message the hook would have refused.
      - name: Check Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          message="${RUNNER_TEMP}/commit-message"
          # Listed before the loop: a range git cannot read must fail the step,
          # and a failure inside the loop's process substitution would not.
          shas="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
          failed=0
          while IFS= read -r sha; do
            if [ -z "${sha}" ]; then
              continue
            fi
            # A merge commit's message is generated by the forge, not written by
            # the author, so it is not held to the format.
            parents="$(git log -1 --format=%P "${sha}" | wc -w)"
            if [ "${parents}" -gt 1 ]; then
              continue
            fi
            git log -1 --format=%B "${sha}" >"${message}"
            if ! reason="$(scripts/check-commit-message.sh "${message}" 2>&1)"; then
              echo "::error::${sha:0:12}: ${reason%%$'\n'*}"
              echo "${reason}"
              failed=1
            fi
          done <<<"${shas}"
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Every commit message follows Conventional Commits."

  # The single required status check.
  #
  # Branch protection names THIS job and nothing else from this workflow. Listing
  # the individual jobs there instead means every rename or addition needs a
  # matching settings change that nobody remembers to make — and a required check
  # whose name no longer matches any job blocks every pull request permanently,
  # including the one that would fix it. One indirection removes that whole class
  # of mistake: add a job here, add it to `needs`, and protection keeps working.
  ci-gate:
    name: ci-gate
    needs: [lint, test, build, web, e2e, e2e-server, cross, scan, commit-lint]
    # always(), so the gate reports a verdict even when a dependency fails —
    # without it the gate would be skipped, and a skipped required check never
    # goes green.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # `skipped` passes: commit-lint is pull-request-only by design, and a
          # job that did not need to run is not a failure. `failure` and
          # `cancelled` fail the gate.
          if echo "${RESULTS}" | jq -e 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | length > 0' >/dev/null; then
            echo "::error::A required job did not succeed — see the list above."
            exit 1
          fi
          echo "All required jobs succeeded."

  # Deliberately NOT in the gate: Test summary, Coverage comment and Coverage
  # baseline. All three are reporting, not gating — Test summary reruns suites
  # the Test, Web and E2E jobs already gate on, and the coverage FLOORS live
  # inside the Test job, so a coverage regression already fails there. The
  # baseline job is also skipped on pull requests by design, and a gate should
  # not have to special-case that.
