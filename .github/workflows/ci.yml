name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token needs nothing but read access here; every job below only
# reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Both floors come from the same Taskfile variables the local gate reads,
      # so CI and a developer's machine cannot disagree about them.
      - run: task test:cover
      # Condition coverage. gobco reads every package in this module (it fails on
      # any that drops out of the report unannounced) — see
      # scripts/gobco-report.sh.
      - run: task cover:branch
      # Consumed by the coverage-comment and coverage-baseline jobs below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.out
            tmp/gobco/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: task build

  # The release build, run on every change so a broken cross-compilation — or a
  # loop that names every target the same and ships one — is caught on the pull
  # request rather than at the tag.
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: task release:binaries
      - run: task release:verify

  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # secrets:history scans the commits, not just the working tree; a
          # shallow clone would hide a secret committed earlier on the branch and
          # removed before the tip, which a rebase merge would still carry onto
          # main.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: task vuln
      - run: task secrets
      - run: task secrets:history

  # Cache main's coverage numbers so a PR has something to compare against. Push
  # to main only; the PR job restores whatever this last wrote.
  coverage-baseline:
    name: Coverage baseline
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Compute the summary
        run: scripts/coverage-summary.sh coverage.out tmp/gobco > coverage-baseline.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: coverage-baseline-${{ github.sha }}
          path: coverage-baseline.json

  # Report coverage on the PR itself. Informational: the floors in the test job
  # are what fail a build, and this job is deliberately not something to gate on.
  coverage-comment:
    name: Coverage comment
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      # The exact-SHA key never hits on a PR, so the prefix restore-key resolves
      # to the most recent baseline cached from main.
      - name: Restore main's baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-
          path: coverage-baseline.json
      - name: Compute this PR's summary
        run: scripts/coverage-summary.sh coverage.out tmp/gobco > pr-coverage.json
      - name: Upsert the coverage comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_COVERAGE: pr-coverage.json
          BASELINE: coverage-baseline.json
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- coverage-report -->'
            const pr = JSON.parse(fs.readFileSync(process.env.PR_COVERAGE, 'utf8'))
            const base = fs.existsSync(process.env.BASELINE)
              ? JSON.parse(fs.readFileSync(process.env.BASELINE, 'utf8'))
              : null
            const pct = (n) => (n === null ? 'n/a' : `${Number(n).toFixed(1)}%`)
            const delta = (cur, prev) => {
              if (cur === null || prev === undefined || prev === null) return '—'
              const d = Math.round((cur - prev) * 10) / 10
              return d === 0 ? '±0' : (d > 0 ? '+' : '') + d.toFixed(1)
            }
            const rows = [
              ['Statements', 'statements'],
              ['Conditions (gobco)', 'branch'],
            ]
            const body = [
              marker,
              '## Coverage',
              '',
              '| Metric | Coverage | Δ vs main |',
              '| --- | --- | --- |',
              ...rows.map(([label, key]) =>
                `| ${label} | ${pct(pr[key])} | ${delta(pr[key], base ? base[key] : null)} |`),
              '',
              '_The floors live in the gates, not here — `COVERAGE_MIN` and ' +
                '`BRANCH_COVERAGE_MIN` in `Taskfile.yml`. A number restated in prose drifts ' +
                'from the one enforced._',
              '',
              '_Conditions counts each branch arm separately: an `if a && b` is only covered ' +
                'once both arms have been observed. gobco reads every package in this ' +
                'module; `task cover:branch` fails if one drops out unlisted._',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  commit-lint:
    name: Commit messages
    runs-on: ubuntu-latest
    # Pull requests only: this checks the commits a branch adds, and on a push to
    # main they have already been through this same gate.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same script lefthook's commit-msg hook runs, so a LEFTHOOK=0
      # bypass cannot land a message the hook would have refused.
      - name: Check Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          message="${RUNNER_TEMP}/commit-message"
          # Listed before the loop: a range git cannot read must fail the step,
          # and a failure inside the loop's process substitution would not.
          shas="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
          failed=0
          while IFS= read -r sha; do
            if [ -z "${sha}" ]; then
              continue
            fi
            # A merge commit's message is generated by the forge, not written by
            # the author, so it is not held to the format.
            parents="$(git log -1 --format=%P "${sha}" | wc -w)"
            if [ "${parents}" -gt 1 ]; then
              continue
            fi
            git log -1 --format=%B "${sha}" >"${message}"
            if ! reason="$(scripts/check-commit-message.sh "${message}" 2>&1)"; then
              echo "::error::${sha:0:12}: ${reason%%$'\n'*}"
              echo "${reason}"
              failed=1
            fi
          done <<<"${shas}"
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Every commit message follows Conventional Commits."

  # The single required status check.
  #
  # Branch protection names THIS job and nothing else from this workflow. Listing
  # the individual jobs there instead means every rename or addition needs a
  # matching settings change that nobody remembers to make — and a required check
  # whose name no longer matches any job blocks every pull request permanently,
  # including the one that would fix it. One indirection removes that whole class
  # of mistake: add a job here, add it to `needs`, and protection keeps working.
  ci-gate:
    name: ci-gate
    needs: [lint, test, build, scan, commit-lint]
    # always(), so the gate reports a verdict even when a dependency fails —
    # without it the gate would be skipped, and a skipped required check never
    # goes green.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # `skipped` passes: commit-lint is pull-request-only by design, and a
          # job that did not need to run is not a failure. `failure` and
          # `cancelled` fail the gate.
          if echo "${RESULTS}" | jq -e 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | length > 0' >/dev/null; then
            echo "::error::A required job did not succeed — see the list above."
            exit 1
          fi
          echo "All required jobs succeeded."

  # Deliberately NOT in the gate: Coverage comment and Coverage baseline. Both
  # are reporting, not gating — the coverage FLOORS live inside the Test job, so
  # a coverage regression already fails there. The baseline job is also skipped
  # on pull requests by design, and a gate should not have to special-case that.
