name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token reads the repository and nothing more. One job asks for
# more: coverage-comment holds pull-requests: write, to post the coverage report
# on its pull request. Every other job only reads.
#
# Each mise step installs only the tools its job runs (install_args), not the
# whole of mise.toml: a node-only job has no use for Go, golangci-lint, hugo or
# gobco, and installing them is most of its setup time.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes the docs alone (scripts/docs-only.sh): then
  # Lint runs the docs gates (task lint:docs), Scan its secret scans, and the
  # Go, web and end-to-end jobs are skipped, which ci-gate accepts for such a
  # change only. A push to main, and a change the script cannot classify, run
  # everything. The base branch's copy of the script decides, never the pull
  # request's own: a change to the classifier is judged by the rules already
  # reviewed, so one that broke it cannot skip the Script tests that would
  # catch the break. A base without the script runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.kind.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch, to see which files a pull request changes.
          fetch-depth: 0
      - name: Decide whether the change is to the docs alone
        id: kind
        run: |
          docs=false
          classifier="${RUNNER_TEMP}/docs-only.sh"
          if [ "${GITHUB_EVENT_NAME}" = pull_request ] \
            && git show "origin/${GITHUB_BASE_REF}:scripts/docs-only.sh" >"${classifier}" \
            && bash "${classifier}" "origin/${GITHUB_BASE_REF}"; then
            docs=true
          fi
          echo "docs=${docs}" >>"${GITHUB_OUTPUT}"

  lint:
    name: Lint
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch, to see which files a pull request changes.
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task golangci-lint shellcheck shfmt typos actionlint hadolint taplo zizmor node jq
      # yamllint and markdownlint-cli2 are pinned outside mise.toml, each one's
      # whole tree by hash (Trade-off TRADE-53): `task tools` installs them into
      # tmp/tools/bin, and the path is added for the steps below, not left to
      # mise.toml's [env].
      - name: Install the linters pinned outside mise
        run: |
          task tools
          echo "${GITHUB_WORKSPACE}/tmp/tools/bin" >>"${GITHUB_PATH}"
      # A pull request lints its Markdown only when it changes Markdown, docs/,
      # the markdownlint config, build/markdownlint/, which pins the linter, or
      # mise.toml, which pins the node it runs under; a push to main lints all
      # of it, and a change that cannot be compared with its base is linted
      # too.
      - name: Decide whether the Markdown needs linting
        id: markdown
        run: |
          lint=true
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            status=0
            scripts/markdown-changed.sh "origin/${GITHUB_BASE_REF}" || status=$?
            if [ "${status}" -eq 1 ]; then
              lint=false
            fi
          fi
          echo "lint=${lint}" >>"${GITHUB_OUTPUT}"
      - run: task lint LINT_MARKDOWN="${LINT_MARKDOWN}"
        if: needs.changes.outputs.docs != 'true'
        env:
          LINT_MARKDOWN: ${{ steps.markdown.outputs.lint }}
      - run: task lint:docs
        if: needs.changes.outputs.docs == 'true'
      # The week-long age gate, for every version a pull request adds to
      # go.mod, docs/go.mod, web/yarn.lock, mise.toml or the two linters' pin
      # files under build/, Dependabot's or not.
      # Not in `task lint`: it asks the registries, and it needs the base. The
      # token lets it read GitHub release dates without the anonymous limit.
      - name: Check that each new dependency version is a week old
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-dependency-age.sh "origin/${GITHUB_BASE_REF}"

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lefthook for the wiring tests that run it, jq for go-test-json.sh.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task jq lefthook
      - name: Find the Go version and build cache
        id: go
        run: |
          echo "version=$(go env GOVERSION)" >>"${GITHUB_OUTPUT}"
          echo "cache=$(go env GOCACHE)" >>"${GITHUB_OUTPUT}"
      # The packages main last compiled, the standard library and every
      # dependency under -race among them, which took the run a minute and a
      # half before its first test. One entry per Go version and go.sum, so a
      # Dependabot bump makes the next one and nothing else churns against the
      # repository's 10 GB of cache; a change to go.sum restores the last entry
      # of the same Go and recompiles only what moved. Every run restores, a
      # fork's pull request included, and only a push to main saves (below).
      # release.yml, the release-please gate and pages.yml restore nothing and
      # build cold.
      - name: Restore main's Go build cache
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: go-build-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
          path: ${{ steps.go.outputs.cache }}
      # The statement floor comes from the same Taskfile variable the local
      # gate reads, so CI and a developer's machine cannot disagree about it.
      # The run's events are kept for the test summary's counts. -count=1
      # because the cache is there for compiled packages, never for a test's
      # pass: no test's pass is reused from an earlier run. (internal/tui's
      # pass could not be reused anyway: go test keys a test's result on the
      # modification times of the files it opens, and a checkout sets them
      # anew.)
      - run: task test:cover GO_TEST_JSON=tmp/go-events.json
        env:
          GOFLAGS: -count=1
      # Saved from a push to main alone, so what any run restores was compiled
      # from reviewed code: a pull request, a fork's included, only reads. Not
      # when main's entry was restored whole, since a key is written once.
      - name: Save the Go build cache
        if: github.event_name == 'push' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.gocache.outputs.cache-primary-key }}
          path: ${{ steps.go.outputs.cache }}
      # Consumed by the summary and coverage-baseline jobs below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
      # Uploaded whether the tests passed or not, so the summary shows a failure
      # as a count rather than leaving the row blank.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-go-unit
          path: tmp/go-events.json
          retention-days: 7

  # The gate scripts' own tests, every scripts/*_test.sh and
  # scripts/release/*_test.sh, in a job of their own so that they run beside
  # Test rather than after its Go race run, which they used to wait on. go,
  # task, jq and node are every tool a suite runs; each stubs the rest.
  scripts:
    name: Script tests
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task jq node
      - run: task test:scripts

  # Condition coverage, in a job of its own so that it runs beside Test rather
  # than after it: gobco runs every package's tests again, and as a step of
  # Test it added its whole run to the time every change waits for.
  branch-coverage:
    name: Branch coverage
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lefthook for the wiring tests that run it, which skip without it and
      # leave the arms they reach unseen; jq for scripts/gobco-report.sh.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task jq lefthook go:github.com/rillig/gobco
      # Condition coverage. gobco reads every package with tests, a package of
      # build-tagged twins a file at a time, and scripts/gobco-report.sh fails
      # on any it cannot read rather than drop it from the report. Its floor
      # comes from the same Taskfile variable the local gate reads.
      - run: task cover:branch
      # Consumed by the summary and coverage-baseline jobs below. An upload of
      # one directory holds its contents at the artifact's root, so each of
      # them downloads it into tmp/gobco, where scripts/coverage-summary.sh
      # reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-coverage
          path: tmp/gobco/
          retention-days: 7

  # The web frontend, gated by the same tasks `task check` runs, so a web lint
  # step added there is added here: the client regenerated from
  # api/openapi.yaml with no drift, the lint, the unit tests with their
  # coverage floor, and the committed bundle rebuilt with no drift. mise
  # provisions the pinned Node, and the tasks run the yarn its packageManager
  # field names through Corepack. web:install's --immutable uses the committed
  # lockfile as-is (so the 7-day age gate, applied only when resolving, does
  # not re-run here) and fails if it and package.json disagree.
  web:
    name: Web
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: node task
      - run: task web:gen:check
      - run: task web:lint
      - run: task web:test -- --reporter=default --reporter=json --outputFile.json=reports/web-unit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-web-unit
          path: web/reports/web-unit.json
          retention-days: 7
      - run: task web:dist:check

  # The frontend end-to-end run: build the SPA, serve it with Vite preview, and
  # drive it in a real browser, including an axe accessibility sweep. No backend:
  # the production build shows the shell and empty states, and the specs answer
  # the API themselves where they need data; a mockup build (VITE_MOCK) fills
  # every section for a second sweep and for the screenshots uploaded below. The
  # specs that drive a write against a running server are E2E (server)'s.
  e2e:
    name: E2E
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trade-off TRADE-58: every end-to-end job runs in Playwright's own image,
    # which holds the browsers @playwright/test drives and every system library
    # and font they need, so no job installs them over apt, whose mirror has
    # stalled a job to its timeout. scripts/check-playwright-image.sh holds the
    # image to the version web/yarn.lock resolves. The runner's user, since
    # Firefox will not start as root, and a /dev/shm Chromium does not run out
    # of.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=2gb
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: node
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      # Chromium's projects alone: E2E (firefox n/3) and E2E (webkit n/3) run
      # theirs.
      - run: yarn test:e2e --project=chromium --project=mock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-e2e
          path: web/reports/e2e.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      # Every populated section, in both themes, at three widths — uploaded
      # pass or fail, so a visual change can be read by eye on the pull request.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens
          path: web/test-results/**/*.png
          retention-days: 7

  # Every spec on the other two engines of the browsers the page supports:
  # Firefox and WebKit, Safari's engine, each run what E2E runs on Chromium, on
  # both builds (engineProjects in web/playwright.config.ts). Each engine's run
  # is split in three shards, jobs of their own beside E2E: Chromium takes about
  # six minutes for the whole of it on four cores, Gecko and WebKit run slower,
  # and a third each keeps every shard shorter than E2E. Their counts stay out
  # of the Test summary, whose E2E row is Chromium's. A failed shard uploads its
  # report and its test results, whose traces and error-context.md say what the
  # engine saw, since no other engine than Chromium runs where the change is
  # written.
  e2e-engines:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2, 3]
    # In Playwright's image, as E2E is.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=2gb
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: node
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - run: yarn test:e2e --project="${BROWSER}" --project="${BROWSER}-mock" --shard="${SHARD}/3"
        env:
          BROWSER: ${{ matrix.browser }}
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # The server-backed end-to-end run: `task build` makes the binary with the web
  # app embedded, scripts/e2e-server.sh serves `workflow --web` from it over a
  # throwaway repository with a bare origin, and the specs under web/e2e/server
  # stage, commit and push through the page, so a write reaches git. A job of
  # its own, not a step of E2E: the page must come from the binary rather than
  # from Vite preview. A leg per engine, each running every server spec:
  # commit.spec.ts writes to the one fixture a run serves, so the engines
  # cannot share a run. The Test summary's row is Chromium's leg, as E2E's is.
  e2e-server:
    name: E2E (server, ${{ matrix.browser }})
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: server
          - browser: firefox
            project: server-firefox
          - browser: webkit
            project: server-webkit
    # In Playwright's image, as E2E is.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --shm-size=2gb
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task node
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build the binary with the web app embedded
        run: task build
        working-directory: .
      - run: yarn test:e2e:server --project="${PROJECT}"
        env:
          PROJECT: ${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.browser == 'chromium'
        with:
          name: report-e2e-server
          path: web/reports/e2e-server.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-server-${{ matrix.browser }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Advisory, not a gate: one table of every suite's counts and the coverage,
  # with its change against main's last baseline, written to the run summary
  # and handed to the coverage comment. It runs no suite: it reads what the
  # Test, Branch coverage, Web, E2E and E2E (server) jobs uploaded, whether
  # they passed or not, so a failed suite shows as its counts and one that
  # never reported as dashes.
  summary:
    name: Test summary
    needs: [changes, test, branch-coverage, web, e2e, e2e-server]
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go for the coverage gate's `go tool cover`, jq for the counts and the
      # coverage summary, node for the rendering.
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go jq node
      # Each absent when its job stopped before uploading it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
          path: tmp/reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: branch-coverage
          path: tmp/gobco
      # On a pull request the exact-SHA key never hits, so the prefix
      # restore-key resolves to the most recent baseline cached from main.
      - name: Restore main's baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-
          path: coverage-baseline.json
      - name: Count each suite's tests
        run: |
          mkdir -p tmp/test-counts
          scripts/test-counts.sh go tmp/reports/go-events.json "Go unit" > tmp/test-counts/go-unit.json
          scripts/test-counts.sh vitest tmp/reports/web-unit.json "Web unit" > tmp/test-counts/web-unit.json
          scripts/test-counts.sh playwright tmp/reports/e2e.json "E2E" > tmp/test-counts/e2e.json
          scripts/test-counts.sh playwright tmp/reports/e2e-server.json "E2E (server)" > tmp/test-counts/e2e-server.json
      # Test and Branch coverage pass or fail apart, so tmp/gobco can be absent
      # beside coverage.out: the summary then reads the conditions as null.
      - name: Compute the coverage summary
        run: |
          if [ -f coverage.out ]; then
            scripts/coverage-summary.sh coverage.out tmp/gobco > pr-coverage.json
          fi
      - name: Render the report
        run: |
          node scripts/pr-comment.mjs pr-coverage.json coverage-baseline.json tmp/test-counts > ci-report.md
          cat ci-report.md >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report
          path: ci-report.md
          retention-days: 7

  # The release build, run on every change but a docs-only pull request so a
  # broken cross-compilation — or a loop that names every target the same and
  # ships one — is caught on the pull request rather than at the tag. With E2E (server)'s `task build`, it is
  # also what proves the binary builds, so no job of its own builds it again.
  cross:
    name: Cross-compile
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task node
      - run: task release:binaries
      - run: task release:verify
      # The formula a release fills, written from the binaries this change
      # builds, checksummed with the command release.yml uses: a platform
      # RELEASE_PLATFORMS gains without a place in the Homebrew formula, or a
      # name as installed from the release alone, fails the pull request
      # rather than the release.
      - name: Write the Homebrew formula
        run: |
          (cd dist && sha256sum workflow_* >SHA256SUMS)
          scripts/release/package-manifests.sh v0.0.0 dist/SHA256SUMS "${GITHUB_REPOSITORY}" tmp/packages
      # brew audit --strict, style cops and all, in developer mode, on that
      # formula, so a rule Homebrew adds, or a call it deprecates, fails a pull
      # request rather than the tap after a release. The audit never runs the
      # formula's install or test block, so a call deprecated there passes.
      # ubuntu-latest images install Homebrew under /home/linuxbrew without
      # putting it on PATH; without it there, the script says brew is missing.
      # Trade-off TRADE-42: this is whatever Homebrew the image ships, unpinned.
      - name: Audit the Homebrew formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          scripts/release/check-formula.sh tmp/packages/Formula/workflow.rb

  scan:
    name: Scan
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # secrets:history scans the commits, not just the working tree; a
          # shallow clone would hide a secret committed earlier on the branch and
          # removed before the tip, which a rebase merge would still carry onto
          # main.
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go task go:golang.org/x/vuln/cmd/govulncheck go:github.com/zricethezav/gitleaks/v8
      - run: task vuln
        if: needs.changes.outputs.docs != 'true'
      - run: task secrets
      - run: task secrets:history

  # Cache main's coverage numbers so a PR has something to compare against. Push
  # to main only; the PR job restores whatever this last wrote.
  coverage-baseline:
    name: Coverage baseline
    needs: [test, branch-coverage]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.8 # the mise binary itself; see min_version in mise.toml
          install_args: go jq
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: branch-coverage
          path: tmp/gobco
      - name: Compute the summary
        run: scripts/coverage-summary.sh coverage.out tmp/gobco > coverage-baseline.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: coverage-baseline-${{ github.sha }}
          path: coverage-baseline.json

  # Post the summary's report on the PR itself. Informational: the floors in the
  # Test and Branch coverage jobs are what fail a build, and this job is
  # deliberately not something to gate on. It checks nothing out and installs
  # nothing: it posts the markdown the summary job rendered.
  coverage-comment:
    name: Coverage comment
    # Not for a run a newer push cancelled: that run's partial counts would
    # overwrite the comment until the newer one lands.
    needs: [summary]
    # Same-repository pull requests only. A fork's PR runs with a read-only token,
    # so the pull-requests: write this job asks for is not granted and it would
    # fail rather than comment — and it is reporting, never a gate, so skipping it
    # on forks costs nothing.
    if: >-
      !cancelled() &&
      needs.summary.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-report
      - name: Upsert the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT: ci-report.md
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- coverage-report -->'
            const body = fs.readFileSync(process.env.COMMENT, 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            // Every page, so a pull request with a long discussion updates its
            // comment rather than posting a second one.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  commit-lint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pull requests only: this checks the commits a branch adds, and on a push to
    # main they have already been through this same gate.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same script lefthook's commit-msg hook runs, so a LEFTHOOK=0
      # bypass cannot land a message the hook would have refused.
      - name: Check Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          message="${RUNNER_TEMP}/commit-message"
          # Listed before the loop: a range git cannot read must fail the step,
          # and a failure inside the loop's process substitution would not.
          shas="$(git rev-list "${BASE_SHA}..${HEAD_SHA}")"
          failed=0
          while IFS= read -r sha; do
            if [ -z "${sha}" ]; then
              continue
            fi
            # A merge commit's message is generated by the forge, not written by
            # the author, so it is not held to the format.
            parents="$(git log -1 --format=%P "${sha}" | wc -w)"
            if [ "${parents}" -gt 1 ]; then
              continue
            fi
            git log -1 --format=%B "${sha}" >"${message}"
            if ! reason="$(scripts/check-commit-message.sh "${message}" 2>&1)"; then
              echo "::error::${sha:0:12}: ${reason%%$'\n'*}"
              echo "${reason}"
              failed=1
            fi
          done <<<"${shas}"
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "Every commit message follows Conventional Commits."

  # The single required status check.
  #
  # Branch protection names THIS job and nothing else from this workflow. Listing
  # the individual jobs there instead means every rename or addition needs a
  # matching settings change that nobody remembers to make — and a required check
  # whose name no longer matches any job blocks every pull request permanently,
  # including the one that would fix it. One indirection removes that whole class
  # of mistake: add a job here, add it to `needs`, and protection keeps working.
  ci-gate:
    name: ci-gate
    needs: [changes, lint, test, scripts, branch-coverage, web, e2e, e2e-engines, e2e-server, cross, scan, commit-lint]
    # always(), so the gate reports a verdict even when a dependency fails —
    # without it the gate would be skipped, and a skipped required check never
    # goes green.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The verdict and the skips it allows are scripts/ci-gate.sh's, with its
      # sibling test, so the rule is tested rather than only read.
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs }}
        run: scripts/ci-gate.sh

  # Deliberately NOT in the gate: Test summary, Coverage comment and Coverage
  # baseline. All three are reporting, not gating — Test summary reports what
  # the Test, Branch coverage, Web, E2E and E2E (server) jobs uploaded, and
  # the coverage FLOORS live inside the Test and Branch coverage jobs, so a
  # coverage regression already fails there. The baseline job is also skipped
  # on pull requests by design, and a gate should not have to special-case
  # that.
