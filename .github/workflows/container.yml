name: Container

# The build container is what `task container:check` runs the gate inside and
# `task container:release` cross-compiles in, both by hand; the release itself
# is built on a runner by release.yml, with mise. So nothing else builds the
# image in CI, and a drift in build/Dockerfile (a dead download URL, a base
# image that moved, a tool version that no longer resolves) would surface only
# when someone built it. Build it and run the full gate inside it weekly and on
# demand, so that drift is caught on a Monday rather than by a developer.
on:
  schedule:
    # Weekly, Monday 09:00 UTC, after CodeQL and Scorecard.
    - cron: "0 9 * * 1"
  workflow_dispatch:

# The default token only reads the repository here.
permissions:
  contents: read

# A newer run builds the same image from a newer tree, so it replaces one in
# flight rather than queueing behind it.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-check:
    name: Container check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
          # The gate runs inside the image, which provisions its own tools.
          install_args: task
      # Builds build/Dockerfile with the versions scripts/tool-versions.sh reads
      # from mise.toml, then runs `task check` inside it — the same gate a
      # developer runs, in the container they can run it in.
      - run: task container:check
