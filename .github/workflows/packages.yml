name: Packages

# Points the Homebrew tap at a release. It downloads the release's
# SHA256SUMS, writes the formula from it with
# scripts/release/package-manifests.sh, and commits it with
# scripts/release/publish-packages.sh to jacob-delgado/homebrew-tap as
# Formula/workflow.rb, for `brew install jacob-delgado/tap/workflow`. Windows
# has no package: it installs the release's binary, as install.md says.
#
# release.yml dispatches this on main once a release is out. A dispatch rather
# than a trigger on the release event, for the reason pages.yml gives: an event
# raised by GITHUB_TOKEN starts no workflow. A workflow of its own, too, so it
# can run alone: Actions → Packages → Run workflow fills the tap for a release
# already out or repairs it after a failed run, without releasing again.
#
# A run publishes whichever release is latest when it starts, and takes no tag:
# GitHub keeps one run of a concurrency group pending and cancels the one it
# held, so a run that named an older release could take the place of the
# newest one's, and the tap would never move to it. A prerelease is never the
# latest, so no run publishes one.
#
# ONE-TIME REPO SETUP:
#   1. Create the public repository jacob-delgado/homebrew-tap, with a README
#      so its main exists. The homebrew- prefix is what lets
#      `brew tap jacob-delgado/tap` find it.
#   2. Create a fine-grained personal access token: resource owner
#      jacob-delgado, only that repository, repository permission Contents read
#      and write and nothing more. Note when it expires.
#   3. Settings → Environments → New environment "packages", deployment
#      branches limited to main, with the token as its secret PACKAGES_TOKEN.
#      The environment is what keeps the token from every other branch's runs.
# Without the secret a run warns and changes nothing. Once the token expires a
# run fails when it writes: replace the secret, then run this.

on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, never cut off midway, so the tap's writes never race. A
# run canceled while pending is one a later run, which publishes the latest
# too, took the place of; publish-packages.sh refuses a release no longer the
# latest by the time it writes, so the tap never moves back.
concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    name: Update the Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds PACKAGES_TOKEN, and lets only main's runs read it.
    environment: packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release every later step works on.
      - name: Find the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      # The checksums people verify their downloads against, from the release
      # itself.
      - name: Download the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: >-
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}"
          --pattern SHA256SUMS --dir "${RUNNER_TEMP}/release"

      - name: Write the Homebrew formula
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: >-
          scripts/release/package-manifests.sh "${TAG}" "${RUNNER_TEMP}/release/SHA256SUMS"
          "${GITHUB_REPOSITORY}" "${RUNNER_TEMP}/packages"

      # What the run commits, kept to be read afterwards.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 7

      - name: Commit it to the tap
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: >-
          scripts/release/publish-packages.sh "${TAG}" "${GITHUB_REPOSITORY}" "${RUNNER_TEMP}/packages"
          "${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
