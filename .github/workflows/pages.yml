name: Pages

# Builds the documentation site and publishes it to GitHub Pages at
# https://jacob-delgado.github.io/workflow/.
#
# The build is `task docs:build` — the same command a developer runs locally.
# That is deliberate: a workflow that reimplements the build grows its own
# behavior, and the site then depends on who built it.
#
# ONE-TIME REPO SETUP: Settings → Pages → Build and deployment → Source =
# "GitHub Actions". Without it, deploy-pages fails with "Get Pages site failed".

on:
  push:
    branches: [main]
    # Skip the deploy when a push cannot change the site. The reference pages
    # are generated from the command tree, so the CLI source counts as input.
    paths:
      - "docs/**"
      - "internal/cli/**"
      - "cmd/docsgen/**"
      - "mise.toml"
      - "Taskfile.yml"
      - ".github/workflows/pages.yml"
  # release.yml dispatches this on main once a release is published, so the
  # published docs describe the version people just got, whether or not the
  # release touched the docs. A dispatch rather than a trigger on the release
  # event: release.yml publishes the release with GITHUB_TOKEN, and an event
  # raised by GITHUB_TOKEN starts no workflow. workflow_dispatch is exempt from
  # that rule, which is also how scripts/release/push-release-tag.sh starts
  # release.yml.
  workflow_dispatch:

# The default token only reads. The deploy job alone holds the Pages rights:
# the build runs repository code (the reference generator, Hugo over the
# site), so it runs on a read-only token and hands the site on as an artifact.
permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: cancelling mid-publish
# can leave the live site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: false for the same reason as release.yml: this job builds
      # the site people read, so a restored tool cache is state carried in
      # from an earlier run that should not influence what gets published.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
          cache: false
          # Go for the reference's generator and Hugo's modules, Hugo for the site.
          install_args: go task hugo-extended

      # Fails if the committed command reference disagrees with the command
      # tree, so the site can never publish documentation for flags that no
      # longer exist.
      - name: Check the generated reference is current
        run: task docs:check

      - name: Build the site
        run: task docs:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages proves the deployment with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
