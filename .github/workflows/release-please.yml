name: release-please

# release-please reads the Conventional Commits on main, opens a PR that bumps
# the version and regenerates CHANGELOG.md, and — once that PR is merged — this
# workflow pushes the vX.Y.Z tag and fires release.yml, which builds the binaries
# and creates the GitHub Release with them attached.
#
# The flow:
#   1. Conventional commits land on main (enforced by lefthook and CI).
#   2. release-please opens or updates a release PR.
#   3. A maintainer merges that PR. Nothing is released until they do.
#   4. push-release-tag.sh (below) decides from the subject whether that commit
#      is a release; if so, the gate runs, and the script checks the commit
#      against the manifest and the release PR's label, tags it, and dispatches
#      release.yml.
#   5. release.yml builds, checksums, attests, and publishes the release with
#      every asset in one call.
#
# Why release-please does not create the release itself (skip-github-release in
# release-please-config.json): GitHub treats a published release as immutable for
# asset uploads, so a release created before the binaries exist can never receive
# them. See scripts/release/push-release-tag.sh for the full reasoning.
#
# ONE-TIME REPO SETUP: Settings → Actions → General → Workflow permissions →
# enable "Allow GitHub Actions to create and approve pull requests". Without it
# the action runs to completion and then fails to open the PR.
#
# EVERY RELEASE PR: it is opened with GITHUB_TOKEN, and GitHub holds the
# workflow runs of such a pull request in an approval-required state. The
# required checks report nothing, and the PR stays blocked, until someone with
# write access chooses "Approve workflows to run" on it. Expect to do that once
# per push release-please makes to the PR.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Three jobs, each needing the one before, so they run in the order their steps
# once ran in one job: release-please, the gate, the tag. After release-please,
# the tag job alone holds write permissions; the gate job's checkout, toolchain
# and task check run on a read-only token.
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the release PR
      pull-requests: write # open the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  gate:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # fetch-depth: 0 because the tag script reads local history. The checkout
      # keeps no credential: nothing in this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag script alone says what a release commit is: it writes
      # version=vX.Y.Z, or version= for any other push, and every step below
      # and the tag job, through this job's output, read that answer instead of
      # restating the subject. The commit message reaches it as an environment
      # variable, not through the run: line.
      - name: Decide whether this is a release commit
        id: release
        env:
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: bash scripts/release/push-release-tag.sh decide

      # Provision the pinned toolchain to run the gate in the next step. Only for
      # a release commit, as the step above decided: any other push to main
      # needs nothing installed here. cache: false for the reason release.yml sets
      # it — a restored cache is attacker-influenceable state, and this gate
      # decides whether a release ships.
      - name: Provision the toolchain for the gate
        if: steps.release.outputs.version != ''
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.3 # the mise binary itself; see min_version in mise.toml
          cache: false

      # Gate before the tag job tags anything. A failed step fails this job, so
      # the tag job, which needs it, never runs and no tag is pushed — a tag with
      # no release behind it is the failure this guards, and a published release
      # cannot be taken back. release.yml runs the gate again for the manual
      # tag-push path it also answers.
      - name: Verify the gate before tagging
        if: steps.release.outputs.version != ''
        run: task check

  tag:
    needs: gate
    if: needs.gate.outputs.version != ''
    runs-on: ubuntu-latest
    # The release group release.yml runs in, for the tag this job pushes, so
    # tagging and the release it dispatches never overlap a hand-pushed one. A
    # job's group and not the workflow's: a group keeps one run waiting and
    # cancels any other, so a workflow-wide group could drop the run of a
    # release commit queued behind two others, and its tag with it.
    concurrency:
      group: release-${{ needs.gate.outputs.version }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: write # push the tag
      pull-requests: write # flip the release PR's label
      actions: write # dispatch release.yml after tagging
    steps:
      # fetch-depth: 0 because the tag script reads local history. The checkout
      # keeps no credential: the push step gets the token through its own env.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # GH_TOKEN carries the job's token to gh, and `gh auth setup-git` has git
      # ask gh for it when the script pushes the tag, so it is written to no file.
      - name: Push tag for a merged release PR
        env:
          # The commit message is attacker-influenceable, so it reaches the script
          # as an environment variable rather than being interpolated into the
          # run: line where it would be shell input.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          bash scripts/release/push-release-tag.sh
