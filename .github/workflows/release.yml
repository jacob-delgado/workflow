name: Release

# Builds the cross-platform binaries for a vX.Y.Z tag and publishes the GitHub
# Release with them attached.
#
# Normally dispatched by release-please.yml right after it pushes the tag; the
# push trigger is the manual path, for a tag pushed by hand. The release and its
# assets are created in ONE call (softprops/action-gh-release), because GitHub
# refuses asset uploads to an already-published release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore mints a short-lived signing certificate
      attestations: write # write the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # cache: false is deliberate. This job publishes artifacts people
      # download, and a restored tool cache is attacker-influenceable state
      # from an earlier run. Provisioning from scratch costs a minute and
      # removes the cache as a path into a release.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      # The same gate a developer runs locally. A tag is the last place to
      # discover the tests were red.
      - name: Verify
        run: task check

      # Cross-compiles the release targets into dist/ — Apple Silicon macOS and
      # amd64 Linux and Windows — with CGO_ENABLED=0, the same task the build
      # container runs.
      - name: Build release binaries
        run: task release:binaries

      # Every target must have produced its own binary. This catches a build that
      # names them all the same and ships one, which is what a broken loop did.
      - name: Verify every platform built
        run: task release:verify

      # An SBOM of the module, so a downloader can see exactly which dependencies
      # went into the binaries and check them against advisories. Attached to the
      # release and attested alongside the binaries below.
      - name: Generate an SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/workflow.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in workflow_*; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum workflow_* > SHA256SUMS
          cat SHA256SUMS

      # Provenance lets anyone verify a downloaded binary was built by this
      # workflow from this commit, with `gh attestation verify`. The checksum
      # files are attested too, so the checksums themselves cannot be swapped on
      # a tampered release page.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/workflow_*
            dist/SHA256SUMS
            dist/workflow.spdx.json

      - name: Publish the release
        # Kept over a `gh release` script step: this uploads the binaries,
        # their checksums and the provenance in ONE publish call, which is
        # what the header above explains GitHub requires.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 # zizmor: ignore[superfluous-actions]
        with:
          # A tag carrying a hyphen (v0.1.0-rc1) is a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/workflow_*
            dist/SHA256SUMS
            dist/workflow.spdx.json
