name: Scorecard

# OpenSSF Scorecard grades this repository's supply-chain posture — are actions
# pinned by SHA, is branch protection real, are workflow tokens least-privilege,
# is there a security policy — and publishes the findings to the Security tab.
#
# It scores the repository's *configuration*, which no linter in `task check`
# can see: those run against the source tree, while this reads the GitHub
# settings around it. When a setting drifts, this is what notices.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly, since most of what it grades changes through settings rather than
    # commits. Monday 08:00 UTC, an hour after CodeQL.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF results
      id-token: write # publish the result so the badge can resolve it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publishes the score so it can be shown as a badge. Public repository,
          # public results — nothing here is private.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard-results.sarif
