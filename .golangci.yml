version: "2"

# Everything is on. `default: all` enables every linter the pinned
# golangci-lint ships, and the short list below is the only exception — each
# entry names why it cannot do useful work here, not that it was inconvenient.
# A new violation means fix the code, not extend this list.
linters:
  default: all
  disable:
    # Same shape: an allow/blocklist of modules that is empty today. Dependency
    # choices are gated by review (see CLAUDE.md) until there is a list worth
    # writing down.
    - gomodguard_v2
    # Requires every field of every struct literal to be set explicitly,
    # including third-party structs (cobra.Command has ~40 fields). Unusable in
    # practice; the zero value is part of Go's design.
    - exhaustruct_v5
    # Deprecated, superseded by the _v5 linters enabled above. Leaving them on
    # would double-report and emit deprecation warnings on every run.
    - exhaustruct
    - gomodguard
    - wsl

  settings:
    depguard:
      # Each rule holds a direction the package layout depends on, so the build
      # rather than a reviewer keeps it.
      rules:
        # exec lives in one place. internal/proc is the module's only door to
        # os/exec — it sets the process group, the deadline and the redirect-free
        # command — so nothing else may import it and quietly grow a second way to
        # run a program. Tests reach for it to act as their own helper binary.
        exec-only-in-proc:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/proc/**"
          deny:
            - pkg: os/exec
              desc: run programs through internal/proc, the one place exec lives
        # internal/rlimit lowers a resource limit that holds for the whole
        # process, which is only safe around one call in a test that runs alone.
        # It also imports testing. So only tests may import it; a production path
        # that did would put a process-wide limit where every goroutine feels it.
        rlimit-only-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/jacob-delgado/workflow/internal/rlimit
              desc: a test helper; lower a resource limit only from a _test.go file
        # internal/gittest clears git's repository variables from the whole
        # process and imports testing, which only a test's own process should
        # do: a production path that did would undo a hook's GIT_DIR for every
        # git workflow runs.
        gittest-only-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/jacob-delgado/workflow/internal/gittest
              desc: a test helper; clear git's environment and run test git only from a _test.go file
        # internal/loop composes the loop once for the command line, the terminal
        # and the web, so it sits below all three and above the domain packages.
        # Importing a surface back, or wiring (which imports the terminal for
        # tui.Deps), is already a cycle the compiler refuses; this rule holds the
        # rest, so no other package — a terminal library, the web's generated
        # API — drifts into the shared layer. strict mode allows only the list.
        loop-below-the-surfaces:
          list-mode: strict
          files:
            - "**/internal/loop/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jacob-delgado/workflow/internal/activity
            - github.com/jacob-delgado/workflow/internal/codeowners
            - github.com/jacob-delgado/workflow/internal/config
            - github.com/jacob-delgado/workflow/internal/convention
            - github.com/jacob-delgado/workflow/internal/forge
            - github.com/jacob-delgado/workflow/internal/gitrepo
            - github.com/jacob-delgado/workflow/internal/jira
            - github.com/jacob-delgado/workflow/internal/messaging
            - github.com/jacob-delgado/workflow/internal/proc
            - github.com/jacob-delgado/workflow/internal/taskwarrior
        # internal/activity groups and words what was done over a period from
        # what each source read, which a caller hands it: it holds no clock and
        # does no I/O, so a test can pin any day and any zone. strict mode
        # allows only the standard packages that keep it so, and
        # internal/sanitize, which does neither, for the one Markdown escape
        # the Summary's text and messaging's rendering of it share.
        activity-without-io:
          list-mode: strict
          files:
            - "**/internal/activity/**"
            - "!$test"
          allow:
            - cmp
            - errors
            - fmt
            - slices
            - strconv
            - strings
            - time
            - unicode
            - unicode/utf8
            - github.com/jacob-delgado/workflow/internal/sanitize
        # internal/seams declares the seam bundles the surfaces share, so it sits
        # below all three and above internal/loop, whose Announced record
        # seams.Store speaks (loop can therefore never take a bundle: that would be
        # a cycle). The terminal imports it, so importing the terminal back is a
        # cycle the compiler refuses; this rule holds the rest, so no terminal
        # library or surface drifts into the bundles and any surface can import them
        # without the terminal. strict mode allows only the domain packages,
        # internal/loop and internal/setup, whose types the bundles speak.
        seams-below-the-surfaces:
          list-mode: strict
          files:
            - "**/internal/seams/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jacob-delgado/workflow/internal/codeowners
            - github.com/jacob-delgado/workflow/internal/config
            - github.com/jacob-delgado/workflow/internal/forge
            - github.com/jacob-delgado/workflow/internal/gitrepo
            - github.com/jacob-delgado/workflow/internal/hooks
            - github.com/jacob-delgado/workflow/internal/jira
            - github.com/jacob-delgado/workflow/internal/loop
            - github.com/jacob-delgado/workflow/internal/messaging
            - github.com/jacob-delgado/workflow/internal/proc
            - github.com/jacob-delgado/workflow/internal/setup
            - github.com/jacob-delgado/workflow/internal/store
            - github.com/jacob-delgado/workflow/internal/taskwarrior
            - github.com/jacob-delgado/workflow/internal/workdirs
        # internal/setup is the first run all three surfaces ask for — the
        # command line at a prompt, the terminal and the web in a form — so it
        # sits below them, beside the domain packages it composes. strict mode
        # allows only those, so no surface, and no terminal or web library,
        # drifts into the shared composition.
        setup-below-the-surfaces:
          list-mode: strict
          files:
            - "**/internal/setup/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/jacob-delgado/workflow/internal/config
            - github.com/jacob-delgado/workflow/internal/gitrepo
            - github.com/jacob-delgado/workflow/internal/jira
            - github.com/jacob-delgado/workflow/internal/proc
        # internal/report builds what every surface reports in the API's own
        # shapes — the Summary, the directories, the review queue, the words for
        # a failure — so the web server and the command line both import it,
        # and it sits below them beside internal/api. strict mode allows only
        # the domain packages, internal/loop and internal/seams, whose answers
        # it reads, and the API's generated types, so no surface drifts into
        # what the surfaces share.
        report-below-the-surfaces:
          list-mode: strict
          files:
            - "**/internal/report/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/oapi-codegen/runtime/types
            - github.com/jacob-delgado/workflow/internal/activity
            - github.com/jacob-delgado/workflow/internal/api
            - github.com/jacob-delgado/workflow/internal/config
            - github.com/jacob-delgado/workflow/internal/forge
            - github.com/jacob-delgado/workflow/internal/gitrepo
            - github.com/jacob-delgado/workflow/internal/httpx
            - github.com/jacob-delgado/workflow/internal/jira
            - github.com/jacob-delgado/workflow/internal/loop
            - github.com/jacob-delgado/workflow/internal/messaging
            - github.com/jacob-delgado/workflow/internal/seams
            - github.com/jacob-delgado/workflow/internal/store
            - github.com/jacob-delgado/workflow/internal/taskwarrior
            - github.com/jacob-delgado/workflow/internal/workdirs
        # The command line serves --web from web.go and from nowhere else: what
        # it prints in the API's shapes — the Summary, the repositories, the
        # review queue, a failure's words — comes from internal/report, which
        # the web server reads too, never from the server itself.
        cli-serves-the-web-only-from-web-go:
          files:
            - "**/internal/cli/**"
            - "!**/internal/cli/web.go"
            - "!$test"
          deny:
            - pkg: github.com/jacob-delgado/workflow/internal/webserver
              desc: the command line imports the web server only to serve --web, in web.go; share through internal/report
        # The web server is a surface beside the terminal, not built on it: what
        # the two share lives in internal/loop and the domain packages. wiring is
        # denied with it, because wiring imports the terminal.
        webserver-not-terminal:
          files:
            - "**/internal/webserver/**"
          deny:
            - pkg: github.com/jacob-delgado/workflow/internal/tui
              desc: the web server does not build on the terminal; share through internal/loop
            - pkg: github.com/jacob-delgado/workflow/internal/wiring
              desc: wiring imports the terminal; the web server takes its seams through webserver.Deps
    errcheck:
      # fmt.Fprint* is excluded whatever it writes to. Most of its writes go to
      # a command's output streams, and checking each one triples the length of
      # every help and report function. Stdout is checked once instead, where
      # internal/cli sets it up (checkedOutput), so an artifact that went
      # nowhere still fails the command; a failed write to stderr leaves no
      # channel to report it on. A file written through fmt.Fprint* is checked
      # by hand, as the request log checks each outline it writes.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      # Check map literals keyed by an enum as well as switches. The interface
      # keys glyphs off forge.CIState and hooks.JobState in map literals rather
      # than switches (gochecknoglobals forbids the package-level table, and a
      # map has no arm gobco cannot cover), so without this a new enum value
      # would draw an empty glyph in silence.
      check:
        - switch
        - map
    tagliatelle:
      # The config file is snake_case, which is what a hand-edited dotfile
      # conventionally looks like. tagliatelle defaults to camel.
      case:
        rules:
          json: snake
    wrapcheck:
      # Wrapping is for crossing a boundary into someone else's package, so the
      # caller learns where the error came from. Errors from this module's own
      # packages already carry that context, and re-wrapping them at every layer
      # produces "workflow: loading config: opening file: open …: no such file".
      ignore-package-globs:
        - github.com/jacob-delgado/workflow/*
    funlen:
      # Length discipline is about production code carrying too much; comments
      # are documentation, not weight.
      lines: 60
      statements: 40
      ignore-comments: true
    gocyclo:
      # CLAUDE.md: "cyclomatic complexity ≤ 10 — enforced, not aspirational."
      min-complexity: 10
    gocognit:
      # Nesting-weighted backstop for code that stays under 10 branches but
      # still cannot be held in your head.
      min-complexity: 20
    misspell:
      # American English, per CLAUDE.md. Without a locale, misspell lets valid
      # British spellings straight through.
      locale: US
    nolintlint:
      require-explanation: true # every //nolint says why
      require-specific: true # and names the linter it silences
      allow-unused: false # a directive that suppresses nothing is a leftover
    ireturn:
      # The defaults, plus generic: a function returning a type parameter T
      # returns whatever concrete type its caller named, which is not the
      # interface return ireturn exists to catch. It is how the forge client
      # decodes each answer into its own type without an `into any` argument.
      # Also the web API's generated response objects: oapi-codegen's strict
      # server declares each handler returning a per-operation response
      # interface, exactly the third-party contract ireturn is told to permit.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - github.com/jacob-delgado/workflow/internal/api\..+ResponseObject
    varnamelen:
      # `tt` for a table-test case and `ok` for a comma-ok are conventional
      # enough to read at any scope, and so is `m` for the Bubble Tea model,
      # which every overlay's methods take and hand back, and `w` for the world
      # harness every interface test drives.
      ignore-names: [tt, ok, m, w]
    testpackage:
      # Black-box only, enforced: every *_test.go must declare package
      # <name>_test, so a test reaches the package solely through its exported
      # surface — never an unexported function, field or seam. testpackage's
      # default skip-regexp exempts *_internal_test.go; override it to match only
      # the empty string (i.e. skip nothing) so there is no white-box escape
      # hatch. A behavior with no public surface is driven through a fake
      # (jira over httptest, gh/glab on PATH via forge.cli, a stub opener) or,
      # when even that is impossible, left to its own package's tests and the
      # coverage floor lowered — the floor flexes, this rule does not.
      skip-regexp: "^$"

  exclusions:
    warn-unused: true # tell us when an exclusion below stops matching anything
    paths:
      # web/node_modules ships stray Go (flatted's Go port) that ./... sweeps in.
      # It is the frontend's dependency tree, not ours to lint.
      - web/node_modules
    # Generated files (internal/api/*.gen.go) are already excluded from the
    # linters by golangci's default `generated: lax` detection of the
    # "DO NOT EDIT" banner; the formatters need the explicit path below.
    rules:
      # A test's length and branch count are its assertions. Gating them pushes
      # toward fewer checks, which is backwards — table-driven tests are
      # legitimately long, and every `if got != want` is a branch.
      - path: _test\.go$
        linters: [funlen, gocyclo, gocognit, maintidx]
      # Test fixtures legitimately use weak randomness, fixed credentials and
      # variable file paths. gosec stays fully strict on production code.
      - path: _test\.go$
        linters: [gosec]
      # This CLI test interrupts its own process, as Ctrl+C does, which every
      # run beside it would hear too, so it runs alone. Every other CLI test is
      # handed an Environment of its own and runs in parallel.
      - path: internal/cli/interrupt_test\.go$
        linters: [paralleltest]
      # The wiring tests run the real git and lefthook, which read their
      # configuration, TMPDIR and PATH from the environment. t.Setenv is the
      # only way to isolate those, and it panics in a parallel test.
      - path: internal/wiring/.*_test\.go$
        linters: [paralleltest]
      # The request-log tests wrap fixture Doers whose responses carry no body
      # (http.NoBody). bodyclose cannot follow the func-var indirection of the
      # logging wrapper and flags the pass-through; there is nothing to close.
      - path: internal/wiring/reqlog_test\.go$
        linters: [bodyclose]
      # The snake_case rule is for .workflow.json. Jira's REST is camelCase by
      # contract, and internal/jira holds no JSON of ours: every tag there is
      # Jira's field name on the wire, not ours to pick.
      - path: internal/jira/
        linters: [tagliatelle]

formatters:
  # gofumpt is a strict superset of gofmt, and gci owns import grouping (it runs
  # after goimports, so its sections are what survives).
  enable:
    - gofmt
    - gofumpt
    - goimports
    - gci
  exclusions:
    paths:
      # web/node_modules ships stray Go (flatted's Go port); not ours to format.
      - web/node_modules
      # A formatter rewrite of a generated file would break the drift gate.
      - internal/api/.*\.gen\.go$
  settings:
    gci:
      custom-order: true
      sections:
        - standard # stdlib
        - default # third-party
        - prefix(github.com/jacob-delgado/workflow) # local
