# rumdl — Markdown lint and format, wired into `task lint:markdown`,
# `task fmt` and the lefthook pre-commit hook. It reads markdownlint's rule
# IDs. Whatever .gitignore keeps out is not linted either (respect-gitignore,
# on by default): a checkout Claude Code keeps under .claude/worktrees/ among
# it, whose own generated reference pages the excludes below would miss.

[global]
# The excludes hold for the files lefthook names on the command line too.
force-exclude = true
# A whole run takes well under a second, so it keeps no .rumdl_cache in the
# checkout for other tools to walk.
cache = false

exclude = [
  "tmp/**",
  "docs/public/**",
  # The frontend's dependency tree ships thousands of vendored READMEs.
  "web/node_modules/**",
  # Generated from the Cobra command tree by `task docs:gen`. Autofixing these
  # would rewrite the generator's output, and `task docs:check` would then fail
  # on drift that no hand edit caused. The sibling _index.md IS hand-written
  # and stays linted, which is why this names the generated files rather than
  # the whole directory.
  "docs/content/docs/reference/workflow*.md",
  # Generated by release-please, which separates its sections with two blank
  # lines (MD012). It exists only on the release pull request until that
  # merges, and a release pull request that cannot pass lint cannot be merged
  # at all.
  "CHANGELOG.md",
]

disable = [
  # Prose here is hand-wrapped at 80, but tables and long URLs are not worth
  # breaking to satisfy a counter. Line length stays a review judgment.
  "MD013",
  # A pull request template opens with an HTML comment and a `##` section on
  # purpose: it is a form to fill in, not a document with a title.
  "MD041",
]

# Hugo pages carry their title in front matter AND open with an `# H1`, which
# counts as two top-level headings. Naming the front-matter field as empty
# stops it competing with the real heading; the rule still catches a genuine
# second `#` in the body.
[MD025]
front-matter-title = ""
