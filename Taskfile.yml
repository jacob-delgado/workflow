version: "3"

vars:
  BINARY: workflow
  PKG: ./cmd/workflow
  # Generated by `task docs:gen`; never hand-edited.
  DOCS_REFERENCE: docs/content/docs/reference
  # The coverage floor. This is the number the gate enforces — no document
  # restates it, because a restated number drifts. Raise it with the ratchet
  # scripts/coverage-gate.sh prints: floor(measured) - 2.
  COVERAGE_MIN: 95
  # The condition (branch) coverage floor, enforced over EVERY package —
  # scripts/gobco-report.sh's skip list is now empty and fails on any package
  # that drops out unannounced.
  #
  # This number went DOWN from 95, and that is the gate getting stronger, not
  # weaker. gobco had been built by an older Go than mise.toml pins, which made
  # it unable to parse internal/cli and internal/tui; both sat on the skip list,
  # so "95%" was measuring internal/config's 36 condition arms and nothing else.
  # Rebuilt correctly, the module's real figure across all 84 arms is 83.3%.
  # It started at 81, that measurement minus the standard ratchet slack, and
  # ratchets up as the conditions the gate lists get tests. The gate prints the
  # available ratchet on every run.
  BRANCH_COVERAGE_MIN: 93
  # Container tasks work with docker or podman: CONTAINER_RUNTIME=podman task ...
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  BUILD_IMAGE: '{{.BUILD_IMAGE | default "workflow-build:local"}}'
  # Release targets, as GOOS/GOARCH pairs.
  RELEASE_PLATFORMS: >-
    darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Download modules and install the git hooks
    cmds:
      - go mod download
      - lefthook install

  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o bin/{{.BINARY}} {{.PKG}}

  run:
    desc: Run from source — `task run -- doctor --online` passes arguments through
    cmds:
      # {{.CLI_ARGS}} is everything after `--`, so subcommands and flags both
      # reach the binary: `task run -- config show`, `task run -- --help`.
      - go run {{.PKG}} {{.CLI_ARGS}}

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race ./...
      - task: test:scripts

  test:scripts:
    desc: Run the gate scripts' own tests
    cmds:
      - scripts/check-commit-message_test.sh

  test:cover:
    desc: Run the tests and enforce the coverage floor
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - scripts/coverage-gate.sh coverage.out {{.COVERAGE_MIN}}
      - task: test:scripts

  cover:branch:
    desc: Condition (branch) coverage via gobco, with its floor
    cmds:
      # Statement coverage cannot see this: an `if a && b` counts as covered the
      # moment the line runs. gobco reports each condition never observed both
      # ways, which is a list of missing test cases rather than a number to chase.
      - scripts/gobco-report.sh {{.BRANCH_COVERAGE_MIN}}

  cover:html:
    desc: Open the coverage profile as HTML
    deps: [test:cover]
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Wrote coverage.html"

  lint:
    desc: Run every linter
    cmds:
      - task: lint:go
      - task: lint:shell
      - task: lint:yaml
      - task: lint:docker
      - task: lint:actions
      - task: lint:markdown
      - task: lint:toml
      - task: lint:headers
      - task: lint:typos
      - task: lint:filelength
      - task: docs:check

  lint:go:
    desc: Lint the Go code
    cmds:
      - golangci-lint run

  lint:shell:
    desc: Lint and format-check the shell scripts
    vars:
      # Found rather than globbed: scripts/ has subdirectories, and a glob that
      # silently misses one means a script nobody ever lints.
      SHELL_FILES:
        sh: find scripts .devcontainer -name '*.sh' -type f | sort | tr '\n' ' '
    cmds:
      - shfmt -i 2 -ci -bn -d {{.SHELL_FILES}}
      - shellcheck {{.SHELL_FILES}}

  lint:yaml:
    desc: Lint the YAML
    cmds:
      - yamllint .

  lint:docker:
    desc: Lint the build container's Dockerfile
    cmds:
      - hadolint build/Dockerfile

  lint:actions:
    desc: Lint and security-audit the GitHub Actions workflows
    cmds:
      # actionlint fails on a repo with no workflows, so the absence is handled
      # rather than reported. Written as an if/else on purpose: the older
      # `[ -d … ] && actionlint || echo` form also swallowed actionlint's OWN
      # failure, reporting "no workflows" for a workflow that did not lint.
      # actionlint says a workflow is valid; zizmor says it is safe.
      - |
        if [ -d .github/workflows ]; then
          actionlint
          zizmor --no-progress .github/workflows
        else
          echo "No workflows to lint."
        fi

  lint:markdown:
    desc: Lint the Markdown
    cmds:
      - markdownlint-cli2

  lint:toml:
    desc: Lint and format-check the TOML
    cmds:
      - taplo fmt --check --diff
      - taplo lint

  lint:filelength:
    desc: Check that no source file has grown past the ceiling
    cmds:
      - scripts/check-file-length.sh

  lint:headers:
    desc: Check the SPDX license headers on Go files
    cmds:
      - scripts/check-license-headers.sh

  lint:typos:
    desc: Spell-check the repo (American English)
    cmds:
      - typos

  fmt:
    desc: Format everything in place
    vars:
      SHELL_FILES:
        sh: find scripts .devcontainer -name '*.sh' -type f | sort | tr '\n' ' '
    cmds:
      - golangci-lint fmt
      - shfmt -i 2 -ci -bn -w {{.SHELL_FILES}}
      - markdownlint-cli2 --fix
      - taplo fmt

  docs:gen:
    desc: Regenerate the command reference from the Cobra command tree
    cmds:
      - go run ./cmd/docsgen {{.DOCS_REFERENCE}}
      - echo "Wrote the command reference to {{.DOCS_REFERENCE}}"

  docs:build:
    desc: Build the documentation site into docs/public
    # CI publishes exactly this output by calling exactly this task. Two copies
    # of a build — one in a Taskfile, one in a workflow — drift, and the site
    # then differs depending on who built it.
    dir: docs
    cmds:
      - hugo --minify

  docs:serve:
    desc: Preview the documentation site with live reload
    dir: docs
    cmds:
      - hugo server --buildDrafts --openBrowser=false

  docs:check:
    desc: Check that the generated command reference matches the code
    cmds:
      - scripts/check-docs-drift.sh

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      - govulncheck ./...

  secrets:
    desc: Scan the working tree for secrets
    cmds:
      - gitleaks dir --redact --no-banner .

  cloc:
    desc: Count the source lines, and the Go test ratio (advisory, never a gate)
    cmds:
      # cloc does NOT read .clocrc on its own — its default is
      # ~/.config/cloc/options.txt — so the config is passed explicitly. Without
      # it cloc walks the filesystem and counts bin/, dist/, docs/public/ and
      # the JetBrains files, which makes a Go-only repository look like it is
      # mostly JavaScript.
      - cloc --config .clocrc .
      - echo ""
      - echo "Go, excluding tests:"
      - cloc --config .clocrc --include-lang=Go --not-match-f='_test\.go$' .

  deadcode:
    desc: Report code unreachable from main (advisory, never a gate)
    cmds:
      # Complements golangci-lint's `unused`, which is intra-package and so
      # cannot see an exported identifier in an internal package that nothing
      # imports. Advisory because a helper reached only from tests is dead to
      # this tool and alive to the project.
      - deadcode ./...

  check:
    desc: The full local gate — run this before calling any task done
    cmds:
      - task: lint
      - task: test:cover
      - task: cover:branch
      - task: vuln
      - task: secrets

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin dist coverage.out coverage.html

  container:build:
    desc: Build the build-container image (tools pinned from mise.toml)
    cmds:
      - >-
        {{.CONTAINER_RUNTIME}} build $(scripts/tool-versions.sh)
        -t {{.BUILD_IMAGE}} -f build/Dockerfile .

  container:check:
    desc: Run the full gate inside the build container
    deps: [container:build]
    cmds:
      - >-
        {{.CONTAINER_RUNTIME}} run --rm -v "$(pwd)":/src -w /src
        {{.BUILD_IMAGE}} task check

  container:release:
    desc: Cross-compile release binaries into dist/
    deps: [container:build]
    cmds:
      - >-
        {{.CONTAINER_RUNTIME}} run --rm -v "$(pwd)":/src -w /src
        {{.BUILD_IMAGE}} task release:binaries

  release:binaries:
    desc: Cross-compile every release platform into dist/ (runs in the container)
    cmds:
      - mkdir -p dist
      - for:
          var: RELEASE_PLATFORMS
          split: " "
          as: PLATFORM
        cmd: |
          goos="${PLATFORM%%/*}"
          goarch="${PLATFORM##*/}"
          ext=""
          [ "$goos" = "windows" ] && ext=".exe"
          echo "Building dist/{{.BINARY}}_${goos}_${goarch}${ext}"
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/{{.BINARY}}_${goos}_${goarch}${ext}" {{.PKG}}
