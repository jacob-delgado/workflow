version: "3"

vars:
  BINARY: workflow
  PKG: ./cmd/workflow
  # Explicit Go package roots. Not `./...`: web/node_modules ships stray Go
  # (flatted's Go port) that `./...` would sweep into every Go tool. The
  # module's own code is cmd/, internal/ and api/ (package apispec, which
  # embeds the OpenAPI document). The one place they are written: the tasks
  # below pass them to every Go tool and to the scripts that run one
  # (gobco-report.sh, test-summary.sh), and lefthook's pre-push runs `task test`.
  GO_PKGS: ./cmd/... ./internal/... ./api/...
  # How long each package's tests may run under `task test` and `task
  # test:cover`, which CI's Test job runs. go test's own default, ten minutes
  # a package, is too close to what the race detector costs the slowest one:
  # internal/tui takes up to six minutes on CI, and its time is CPU, not
  # waiting, so it grows with the load. internal/webserver, before it parsed
  # its API contract once a process, came near ten on a loaded four-core
  # machine and once passed it, failing a suite whose every test passed.
  # Twice the default leaves a loaded machine room and still fits inside CI's
  # Test job.
  GO_TEST_TIMEOUT: 20m
  # Generated by `task docs:gen`; never hand-edited.
  DOCS_REFERENCE: docs/content/docs/reference
  # The coverage floor. This is the number the gate enforces — no document
  # restates it, because a restated number drifts. Raise it with the ratchet
  # scripts/coverage-gate.sh prints: floor(measured) - 2. It is a floor on the
  # product's code alone: the total the gate measures leaves out the generated
  # trees and every package whose line in CLAUDE.md's layout block ends
  # "(tests only)" (CONTRIBUTING.md, *Tests*).
  #
  # It stepped 95→94 when the white-box tests were removed to make testpackage
  # strict (.golangci.yml — no *_internal_test.go exemption): a few of them
  # covered behavior with no public surface — signal-context cancellation, the
  # --web/--log dispatch, the by-construction help/dry-run/buffer-cap guarantees —
  # which a black-box test cannot reach, so that coverage falls to each package's
  # own tests and the floor lowers to match. The rule does not bend; the floor does.
  # The --web dispatch has since gained a public surface (cli.NewRootCmdOver) and
  # its tests are back, in internal/cli/root_test.go.
  #
  # It rose 94→96 when the pre-1.0 paydown ended: the module then read 98.4%
  # as the dev user locally, and 98.1% in CI on 1bdb36a4, and both give
  # floor(measured) - 2 = 96.
  COVERAGE_MIN: 96
  # The condition coverage floor, enforced over every package with tests —
  # scripts/gobco-report.sh reads a package of build-tagged twins a file at a
  # time, keeps no skip list, and fails on any package it cannot read.
  #
  # This number went DOWN from 95, and that is the gate getting stronger, not
  # weaker. gobco had been built by an older Go than mise.toml pins, which made
  # it unable to parse internal/cli and internal/tui; both sat on the skip list,
  # so an early figure measured only a fraction of the module's condition arms.
  # Rebuilt correctly, gobco read every package but the build-tagged twins,
  # which it now reads a file at a time, so the floor is measured across them
  # all. It started below the measured figure by the standard slack, and
  # ratchets up as the conditions the gate lists get tests. The gate prints the
  # available ratchet on every run.
  #
  # It stepped from 93 to 92 with the scriptable write commands (workflow branch /
  # pr / announce). This module's tests are black-box only (package <name>_test,
  # driving the CLI through cli.Execute, never its unexported seams), and a few of
  # the commands' condition arms have no black-box reach: the working-directory
  # read failing and a Slack post SUCCEEDING (there is a stand-in for the forge CLI
  # but none for the Slack transport, so only a failed post is reachable). See
  # internal/cli/*_test.go and internal/cli/pr/*_test.go. The GitLab-only "merge
  # request" noun was a third until it moved onto forge.Kind, whose own tests
  # reach it.
  #
  # It then stepped 92→91 when the white-box tests were removed to make
  # testpackage strict (.golangci.yml — every *_test.go must be package
  # <name>_test now). Most converted cleanly, but a few condition arms had no
  # public surface at all — signal-context cancellation reaching a subprocess,
  # the --web/--log dispatch, and the by-construction help/dry-run/buffer-cap
  # guarantees — so those tests were deleted and this floor lowered to match.
  # The rule does not bend; the floor does. The --web dispatch has since gained
  # one (cli.NewRootCmdOver, tested in internal/cli/root_test.go).
  #
  # It moved 91→89 when the metric changed, not the tests. gobco had run with
  # -branch, which counts branches: an `if a && b` was one counter whose operands
  # were never seen apart, and a boolean outside a branch (`return goos ==
  # "darwin"`) was not counted at all. Without the flag every operand and every
  # boolean expression is a condition of its own, the metric this file and
  # CLAUDE.md describe. It reads more arms and a lower share of them, so the floor
  # was measured afresh and set to floor(measured) - 2. The name stays, and so
  # does coverage-summary.sh's "branch" key the CI comment compares against main.
  #
  # It rose 89→92 once every condition had run and a test had seen each
  # `err != nil` both ways, but for those TECH_DEBT.md's register kept then;
  # the report then read 94.5%, and the floor is floor(measured) - 2.
  #
  # It fell 92→91 in #166, at 91.9%: the Slack workspace, directory and
  # GitLab group work added store and webserver error branches (a failed
  # scan, a failed exec, a write the database refuses) that no public input
  # reaches. They carry no test, since a test through internals or a refactor
  # made only to reach them is worse than the gap; the CLI's Slack paths,
  # which a fake Slack could reach, were tested instead.
  #
  # It rose 91→93 when the report stopped being a worklist alone: every
  # condition that never ran and every error arm never seen got a test, a
  # refactor that left no such arm, or a line of scripts/gobco-allowlist.txt
  # naming the trade-off that keeps it, and the gate now fails a new one. The
  # report then read 95.4%, and the floor is floor(measured) - 2.
  BRANCH_COVERAGE_MIN: 93
  # Container tasks work with docker or podman: CONTAINER_RUNTIME=podman task ...
  # container:check needs a VM of about 8 GiB: knip's parser reserves 6 GiB in
  # one allocation, and golangci-lint alone is killed for memory in the 2 GiB a
  # podman machine or colima starts with. Stop the machine and run
  # `podman machine set --memory 8192`, or `colima start --memory 8`.
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  # Runs the container as the invoking user, whose "$(id -u):$(id -g)" the task
  # shell expands on the host. Rootless podman maps that user to root inside
  # the container, so under a bare --user the checkout reads as root's; keep-id
  # maps it to its own uid instead.
  CONTAINER_USER: >-
    {{if eq .CONTAINER_RUNTIME "podman"}}--userns=keep-id{{else}}--user "$(id -u):$(id -g)"{{end}}
  BUILD_IMAGE: '{{.BUILD_IMAGE | default "workflow-build:local"}}'
  # Release targets, as GOOS/GOARCH pairs. The one list of them: the docs and
  # the release notes name a platform only as an example, such as
  # workflow_darwin_arm64, and point at the release's assets for the rest.
  # scripts/release/package-manifests.sh is the one other place a platform is
  # spelled: it gives each binary its place in the Homebrew formula, or names
  # it as installed from the release alone, and fails for one it has no place
  # for, which CI's Cross-compile job checks on every change.
  RELEASE_PLATFORMS: >-
    darwin/arm64 linux/amd64 windows/amd64

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Download modules, install the linters mise does not, and install the git hooks
    cmds:
      - go mod download
      - task: tools
      # Asked of git rather than of a .git directory: in a linked worktree or
      # a submodule .git is a file, and the hooks belong there all the same.
      # The dev container runs this before its workspace may be a repository.
      - |
        if git rev-parse --git-dir >/dev/null 2>&1; then
          lefthook install
        else
          echo "Not a git repository yet; run 'task setup' after 'git init' to add the hooks."
        fi

  # The two linters mise.toml does not pin (Trade-off TRADE-53), each
  # installed from committed files that pin its whole dependency tree by
  # version and hash, into tmp/tools/bin, which mise.toml puts on PATH. Each
  # linter's task is skipped until its pin files change or what it installed
  # no longer runs, as a venv does once its python3 moves to another minor
  # version. CI's Lint job and the release gates run this before `task lint`
  # and `task check`.
  tools:
    desc: Install yamllint and markdownlint-cli2 from their pin files into tmp/tools/bin
    cmds:
      - task: tools:yamllint
      - task: tools:markdownlint

  # yamllint 1.38.0 needs Python 3.10 or later, and pyyaml 6.0.3 has wheels up
  # to CPython 3.14 alone, which --only-binary :all: holds pip to: the range
  # moves with the pins in build/yamllint/requirements.txt.
  tools:yamllint:
    internal: true
    sources:
      - build/yamllint/requirements.txt
    generates:
      - tmp/tools/bin/yamllint
    status:
      - tmp/tools/bin/yamllint --version
    cmds:
      - rm -rf tmp/tools/yamllint tmp/tools/bin/yamllint
      - |
        if ! python3 -c 'import sys; sys.exit(not (3, 10) <= sys.version_info[:2] <= (3, 14))' \
          || ! python3 -m venv tmp/tools/yamllint; then
          echo "task tools: yamllint needs a python3 from 3.10 to 3.14, with venv, on PATH; found $(python3 --version 2>&1)" >&2
          exit 1
        fi
      - tmp/tools/yamllint/bin/python -m pip install --quiet --disable-pip-version-check -r build/yamllint/requirements.txt
      - mkdir -p tmp/tools/bin
      - ln -sfn ../yamllint/bin/yamllint tmp/tools/bin/yamllint
      - tmp/tools/bin/yamllint --version

  # Installed from a copy of its lock, so node_modules lands under tmp/ rather
  # than beside the pin files. npm ci takes exactly what the lock names, by
  # each package's sha512, and runs no package's install script; the node it
  # runs under is mise.toml's. markdownlint-cli2 has no --version flag.
  # Given only the negated glob '#**', with --no-globs, it lints no file
  # wherever it runs, and the first line of its output names the version.
  tools:markdownlint:
    internal: true
    sources:
      - build/markdownlint/package.json
      - build/markdownlint/package-lock.json
    generates:
      - tmp/tools/bin/markdownlint-cli2
    status:
      - tmp/tools/bin/markdownlint-cli2 --no-globs '#**'
    cmds:
      - rm -rf tmp/tools/markdownlint tmp/tools/bin/markdownlint-cli2
      - mkdir -p tmp/tools/markdownlint tmp/tools/bin
      - cp build/markdownlint/package.json build/markdownlint/package-lock.json tmp/tools/markdownlint/
      - npm ci --prefix tmp/tools/markdownlint --ignore-scripts --no-fund --no-audit
      - ln -sfn ../markdownlint/node_modules/.bin/markdownlint-cli2 tmp/tools/bin/markdownlint-cli2
      - tmp/tools/bin/markdownlint-cli2 --no-globs '#**'

  build:
    desc: Build the binary into bin/, with the web interface embedded
    deps: [web:build]
    cmds:
      # web:build refreshes internal/web/dist first, so the binary embeds the
      # working tree's frontend rather than the last committed bundle.
      - go build -o bin/{{.BINARY}} {{.PKG}}

  run:
    desc: Run from source — `task run -- doctor --online` passes arguments through
    cmds:
      # {{.CLI_ARGS}} is everything after `--`, so subcommands and flags both
      # reach the binary: `task run -- config show`, `task run -- --help`.
      - go run {{.PKG}} {{.CLI_ARGS}}

  # Corepack ships with the pinned Node and runs the yarn the packageManager
  # field names. The web tasks below invoke it as `corepack yarn`, which
  # sidesteps a mise `yarn` shim that would otherwise shadow it, and
  # COREPACK_ENABLE_DOWNLOAD_PROMPT=0 lets the first run fetch yarn without
  # stopping to ask.
  dev:
    desc: Run the whole cockpit in one shell, live-reloading the Go API and the UI
    deps: [dev:api, dev:ui]

  dev:api:
    internal: true
    cmds:
      # air rebuilds and restarts `workflow --web` on any .go change.
      - air

  dev:ui:
    internal: true
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn install
      - corepack yarn dev

  web:mockup:
    desc: Serve the web UI against mock data in one shell — no backend, for review
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_MOCK: "true"
    cmds:
      - corepack yarn install
      - corepack yarn dev

  # The cockpit in two shells rather than `task dev`'s one: `task web` serves
  # the Go API and event stream, built once rather than rebuilt on a change, and
  # `task web:ui` serves the frontend that proxies to it.
  web:
    desc: "Serve only the cockpit's API and event stream on 127.0.0.1:13579 (pair with web:ui)"
    cmds:
      - go run {{.PKG}} --web

  web:ui:
    desc: "Serve only the cockpit's web UI on :5173, proxying /api to :13579 (pair with web)"
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn install
      - corepack yarn dev

  # The one install every gated web task depends on, so `task check` and
  # `task build` work from a clean checkout. run: once installs a single time
  # however many of those tasks one `task` run pulls in; --immutable installs
  # exactly what yarn.lock pins, fails if package.json disagrees with it, and
  # is a no-op when node_modules already matches.
  web:install:
    internal: true
    run: once
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn install --immutable

  web:lint:
    desc: Lint the web frontend (eslint, tsc, prettier, knip, import boundaries)
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn lint

  # The web twin of gen:verify: regenerate the TypeScript client from
  # api/openapi.yaml and fail on any diff, so a spec change that skipped
  # `yarn gen` is red locally rather than first in CI. The diff runs from web/,
  # so it takes the same scrub as `test`: under a hook or `git rebase --exec`
  # from a linked worktree, git would otherwise take web/ as the top of the
  # worktree and the diff would match nothing.
  web:gen:check:
    desc: Fail if the generated web client has drifted from api/openapi.yaml
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - unset $(git rev-parse --local-env-vars); corepack yarn gen:check

  # The bundle's twin of gen:verify: rebuild the frontend and fail when the
  # committed internal/web/dist differs, so a web change that skipped
  # `task web:build` cannot ship a stale app to `go install`. Vite names each
  # asset by its content hash, so a stale bundle shows up as a deleted file
  # beside an untracked one, and check-generated.sh asks for both.
  web:dist:check:
    desc: Fail if the committed web bundle in internal/web/dist is stale
    deps: [web:build]
    cmds:
      - >-
        scripts/check-generated.sh internal/web/dist
        "The embedded web bundle is out of date. Run 'task web:build' and commit internal/web/dist."

  # Prettier writes what `web:lint`'s `prettier --check` reads, so `task fmt`,
  # which runs this, leaves nothing for the lint to refuse.
  web:fmt:
    desc: Format the web frontend in place (prettier)
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn fmt

  web:test:
    desc: Run the web frontend's unit tests with the coverage floor
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      # {{.CLI_ARGS}} reaches vitest: CI's Web job adds its json reporter
      # this way, `task web:test -- --reporter=json ...`.
      - corepack yarn test {{.CLI_ARGS}}

  web:build:
    desc: Build the web frontend's production bundle into internal/web/dist for embedding
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn build

  test:
    desc: Run the tests with the race detector
    cmds:
      # Git exports the variables that locate a repository to a hook and to
      # `git rebase --exec`, and from a linked worktree GIT_DIR is an absolute
      # path into the shared repository: a test's `git -C <temp dir>` then works
      # on that repository instead. The packages that run git clear them in
      # their TestMain; clearing them here as well, with git's own list
      # (githooks(5)) as lefthook.yml's pre-push does, covers a package that
      # starts running git before it has one. Each cmd is a shell of its own,
      # so the unset shares the line with the tests it protects.
      - unset $(git rev-parse --local-env-vars); go test -race -timeout {{.GO_TEST_TIMEOUT}} {{.GO_PKGS}}
      - task: test:scripts

  test:docs:
    desc: Run the Go tests that hold the docs' contract pages to the code
    cmds:
      # The tests docs/CLAUDE.md names under Contract pages, so a docs-only
      # change runs them without the suites around them: errors.md and
      # scripting.md against the web API's problem codes, scripting.md against
      # the commands, and configuration.md and usage.md against the terminal's
      # keys and help groups. Each one's name starts with TestDocs, and the
      # packages are the ones that hold such a test, so a new contract test
      # joins by its name alone.
      - >-
        unset $(git rev-parse --local-env-vars); go test -count=1 -run '^TestDocs'
        $(git grep -l -E '^func TestDocs' -- '*_test.go' | xargs -n1 dirname | sort -u | sed 's|^|./|')

  test:scripts:
    desc: Run the gate scripts' own tests
    cmds:
      # The one runner: it finds every scripts/*_test.sh and
      # scripts/release/*_test.sh and runs each once, under a hook's git
      # environment, so a new test needs no line here and none runs twice.
      - scripts/hook-environment_test.sh

  test:cover:
    desc: Run the Go tests and enforce the coverage floor
    cmds:
      # The same scrub as `test`, for the same reason. CI passes GO_TEST_JSON to
      # keep the run's events for the pull request comment's test counts;
      # go-test-json.sh keeps the log as plain as go test's own.
      - >-
        unset $(git rev-parse --local-env-vars);
        {{if .GO_TEST_JSON}}scripts/go-test-json.sh {{.GO_TEST_JSON}}{{else}}go test{{end}}
        -race -timeout {{.GO_TEST_TIMEOUT}} -coverprofile=coverage.out -covermode=atomic {{.GO_PKGS}}
      # Run from the root: the gate reads CLAUDE.md's layout there for the
      # packages that serve only tests, which leave its total, as the
      # generated trees do.
      - scripts/coverage-gate.sh coverage.out {{.COVERAGE_MIN}}

  fuzz:
    desc: Run each fuzz target briefly (advisory, never a gate)
    cmds:
      # `go test -fuzz` runs one target at a time, and the gate only ever runs
      # the seed corpus, so a target that would find a new input never gets the
      # chance. Discover every Fuzz function and give each a short run. Advisory:
      # a real fuzzing session is long and non-deterministic, not something CI
      # should gate on.
      - |
        set -euo pipefail
        for pkg in $(go list {{.GO_PKGS}}); do
          for target in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
            echo "Fuzzing ${target} in ${pkg}"
            go test -run '^$' -fuzz="^${target}$" -fuzztime="${FUZZTIME:-10s}" "$pkg"
          done
        done

  cover:branch:
    desc: Condition coverage via gobco, with its floor
    cmds:
      # Statement coverage cannot see this: an `if a && b` counts as covered the
      # moment the line runs. gobco reports each condition never observed both
      # ways, which is a list of missing test cases rather than a number to chase;
      # one never evaluated, or an error arm never seen, fails unless
      # scripts/gobco-allowlist.txt keeps it for a trade-off.
      # gobco measures a package by running its tests: the same scrub as `test`.
      - unset $(git rev-parse --local-env-vars); scripts/gobco-report.sh {{.BRANCH_COVERAGE_MIN}} {{.GO_PKGS}}

  cover:html:
    desc: Open the coverage profile as HTML
    deps: [test:cover]
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Wrote coverage.html"

  test:summary:
    desc: Report unit and e2e test counts (pass/skip/fail) and coverage (advisory)
    cmds:
      # Runs the Go, web (vitest) and Playwright suites here and prints one
      # markdown table of counts and coverage. Advisory: it reports, it does not
      # gate. CI's Test summary job reports the same from what its test jobs
      # uploaded, and runs no suite again.
      # It runs the Go tests too, so it takes the same roots and the same scrub
      # as `test`.
      - unset $(git rev-parse --local-env-vars); scripts/test-summary.sh {{.GO_PKGS}}

  lint:
    desc: Run every linter
    cmds:
      - task: lint:go
      - task: lint:crossvet
      - task: lint:testshape
      - task: lint:shell
      - task: lint:yaml
      - task: lint:docker
      - task: lint:actions
      - task: lint:markdown
      - task: lint:toml
      - task: lint:headers
      - task: lint:typos
      - task: lint:filelength
      - task: lint:packagesize
      - task: lint:goversion
      - task: lint:miseversion
      - task: lint:checksums
      - task: lint:mediachecksums
      - task: lint:goroutines
      - task: lint:tradeoffs
      - task: lint:techdebtpaths
      - task: lint:siblingtests
      - task: lint:layout
      - task: docs:check
      - task: gen:verify

  lint:go:
    desc: Lint the Go code
    cmds:
      - golangci-lint run

  # golangci-lint vets the build of the system it runs on, and every CI job
  # runs on Linux, so the code only a macOS or a Windows build holds, and the
  # tests only they compile, would meet no compiler before a user of that
  # system did. This vets every release platform's build, tests and all,
  # compiling each without running it. Trade-off TRADE-35: it compiles that
  # code, and nothing here runs it.
  lint:crossvet:
    desc: Vet every release platform's build, tests and all, compiled but not run
    cmds:
      - for:
          var: RELEASE_PLATFORMS
          split: " "
          as: PLATFORM
        # Interpolated into a shell variable first, as release:binaries does.
        cmd: |
          platform="{{.PLATFORM}}"
          echo "Vetting ${platform}"
          CGO_ENABLED=0 GOOS="${platform%%/*}" GOARCH="${platform##*/}" go vet {{.GO_PKGS}}

  lint:testshape:
    desc: Check that every test marks its Arrange, Act and Assert
    vars:
      # Tracked and not-yet-added test files alike, so a new test is checked
      # before its first `git add`.
      TEST_FILES:
        sh: git ls-files --cached --others --exclude-standard '*_test.go' | sort | tr '\n' ' '
    cmds:
      - go run ./cmd/testshape {{.TEST_FILES}}

  lint:shell:
    desc: Lint and format-check the shell scripts
    vars:
      # Found rather than globbed: scripts/ has subdirectories, and a glob that
      # silently misses one means a script nobody ever lints. .claude/'s are
      # listed from git instead, tracked and not-yet-added alike so a new hook
      # is checked before its first `git add`: Claude Code keeps its own
      # checkouts of this repository under .claude/, which .gitignore keeps
      # out, but whose scripts a find would lint and fmt would rewrite.
      SHELL_FILES:
        sh: "{ find scripts .devcontainer -name '*.sh' -type f; git ls-files --cached --others --exclude-standard -- '.claude/*.sh'; } | sort | tr '\\n' ' '"
    cmds:
      - shfmt -i 2 -ci -bn -d {{.SHELL_FILES}}
      - shellcheck {{.SHELL_FILES}}

  lint:yaml:
    desc: Lint the YAML
    cmds:
      # --strict, so a warning fails as an error does: yamllint exits 0 on a
      # warning, and a "missing starting space in comment" warning once hid a
      # description YAML had cut short at a " #".
      - yamllint --strict .

  lint:docker:
    desc: Lint the build container's Dockerfile
    cmds:
      - hadolint build/Dockerfile

  lint:actions:
    desc: Lint and security-audit the GitHub Actions workflows
    cmds:
      # actionlint fails on a repo with no workflows, so the absence is handled
      # rather than reported. Written as an if/else on purpose: the older
      # `[ -d … ] && actionlint || echo` form also swallowed actionlint's OWN
      # failure, reporting "no workflows" for a workflow that did not lint.
      # actionlint says a workflow is valid; zizmor says it is safe.
      - |
        if [ -d .github/workflows ]; then
          actionlint
          zizmor --no-progress .github/workflows
        else
          echo "No workflows to lint."
        fi

  lint:markdown:
    desc: Lint the Markdown
    cmds:
      # CI's Lint job passes LINT_MARKDOWN=false for a pull request that changes
      # no Markdown, nothing under docs/, not the markdownlint config, nothing
      # under build/markdownlint/, which pins markdownlint-cli2 and its tree,
      # and not mise.toml, which pins the node it runs under
      # (scripts/markdown-changed.sh); everywhere else every file is linted.
      - >-
        {{if eq .LINT_MARKDOWN "false"}}echo "Markdown lint skipped: this change touches no Markdown, docs/, its config or its pins"{{else}}markdownlint-cli2{{end}}

  lint:toml:
    desc: Lint and format-check the TOML
    cmds:
      - taplo fmt --check --diff
      - taplo lint

  lint:filelength:
    desc: Check that no source file has grown past the ceiling
    cmds:
      - scripts/check-file-length.sh

  lint:packagesize:
    desc: Check that no directory holds more source files than its budget
    cmds:
      - scripts/check-package-size.sh

  package-size:
    desc: List every source directory with its file count and budget
    cmds:
      - scripts/check-package-size.sh --list

  lint:goversion:
    desc: Check that the Go version agrees across the files that pin it
    cmds:
      - scripts/check-go-version.sh

  lint:miseversion:
    desc: Check that the mise version agrees across mise.toml, the workflows and the devcontainer
    cmds:
      - scripts/check-mise-version.sh

  lint:checksums:
    desc: Check that every build-container download is pinned to a SHA-256 at mise.toml's version
    cmds:
      - scripts/check-tool-checksums.sh

  lint:mediachecksums:
    desc: Check that the docs' ttyd is pinned to a SHA-256 at mise.toml's version for every machine
    cmds:
      - scripts/check-media-checksums.sh

  lint:goroutines:
    desc: Check that no goroutine starts outside internal/proc, the tests and the written exceptions
    cmds:
      - scripts/check-goroutines.sh

  lint:tradeoffs:
    desc: Check the trade-off register's shape, and that every site comment names an entry
    cmds:
      - scripts/check-tradeoffs.sh

  lint:techdebtpaths:
    desc: Check that every repository path TECH_DEBT.md names in backticks is tracked
    cmds:
      - scripts/check-tech-debt-paths.sh

  lint:siblingtests:
    desc: Check that every script under scripts/ has its sibling test
    cmds:
      - scripts/check-sibling-tests.sh

  lint:layout:
    desc: Check CLAUDE.md's layout against the Go packages and its (tests only) marks against depguard
    cmds:
      - scripts/check-layout.sh

  lint:headers:
    desc: Check the SPDX license headers on Go files
    cmds:
      - scripts/check-license-headers.sh

  lint:typos:
    desc: Spell-check the repo (American English)
    cmds:
      - typos

  fmt:
    desc: Format everything in place
    vars:
      # The same list as lint:shell's; its comment says why.
      SHELL_FILES:
        sh: "{ find scripts .devcontainer -name '*.sh' -type f; git ls-files --cached --others --exclude-standard -- '.claude/*.sh'; } | sort | tr '\\n' ' '"
    cmds:
      - golangci-lint fmt
      - shfmt -i 2 -ci -bn -w {{.SHELL_FILES}}
      - markdownlint-cli2 --fix
      - taplo fmt
      - task: web:fmt

  deps:age:
    desc: Check that every dependency version this branch adds is a week old (BASE=origin/main)
    cmds:
      # CI's Lint job runs this on every pull request. It asks the registries
      # when each version was published, so it is not part of the offline
      # `task lint`.
      - scripts/check-dependency-age.sh {{.BASE | default "origin/main"}}

  # `task deps:yamllint VERSION=1.39.0` moves yamllint itself, and
  # `task deps:yamllint -- pyyaml==6.0.4` takes a vulnerability fix younger
  # than the week, which scripts/dependency-age-exceptions.txt then lists.
  deps:yamllint:
    desc: Re-pin yamllint's tree in build/yamllint/requirements.txt, each dependency at its newest release a week old (VERSION= moves yamllint)
    vars:
      PINNED:
        sh: sed -n -E 's/^yamllint==([^ ]+).*/\1/p' build/yamllint/requirements.txt
    cmds:
      # Written aside and then moved, so a run that fails leaves the pins as
      # they were.
      - mkdir -p tmp
      - scripts/pin-yamllint.sh {{.VERSION | default .PINNED}} {{.CLI_ARGS}} >tmp/yamllint-requirements.txt
      - mv tmp/yamllint-requirements.txt build/yamllint/requirements.txt

  # Edit the version in build/markdownlint/package.json first to move
  # markdownlint-cli2 itself; left as it is, the run moves only its tree.
  # .npmrc beside it holds npm to versions a week old, which a fix younger
  # than that passes with --min-release-age-exclude=<name> for one run, listed
  # in scripts/dependency-age-exceptions.txt.
  deps:markdownlint:
    desc: Re-lock markdownlint-cli2's tree in build/markdownlint/package-lock.json, each package a week old
    cmds:
      # Resolved aside and then moved, so a run that fails leaves the lock as
      # it was. The directory holds no lock, so the tree resolves afresh.
      - rm -rf tmp/markdownlint-lock
      - mkdir -p tmp/markdownlint-lock
      - cp build/markdownlint/package.json build/markdownlint/.npmrc tmp/markdownlint-lock/
      - cd tmp/markdownlint-lock && npm install --package-lock-only --ignore-scripts --no-fund --no-audit {{.CLI_ARGS}}
      - mv tmp/markdownlint-lock/package-lock.json build/markdownlint/package-lock.json

  docs:gen:
    desc: Regenerate the command reference from the Cobra command tree
    cmds:
      - go run ./cmd/docsgen {{.DOCS_REFERENCE}}
      - echo "Wrote the command reference to {{.DOCS_REFERENCE}}"

  gen:
    desc: Regenerate the web API's Go code from api/openapi.yaml
    cmds:
      - go tool oapi-codegen -config api/oapi-codegen-models.yaml api/openapi.yaml
      - go tool oapi-codegen -config api/oapi-codegen-server.yaml api/openapi.yaml

  gen:verify:
    desc: Fail if the generated API code has drifted from api/openapi.yaml
    cmds:
      - task: gen
      # A changed file or one the generator added and nobody committed.
      - scripts/check-generated.sh internal/api "Generated API code is out of date. Run 'task gen' and commit."

  docs:build:
    desc: Build the documentation site into docs/public
    # CI publishes exactly this output by calling exactly this task. Two copies
    # of a build — one in a Taskfile, one in a workflow — drift, and the site
    # then differs depending on who built it.
    dir: docs
    cmds:
      - hugo --minify

  docs:serve:
    desc: Preview the documentation site with live reload
    dir: docs
    cmds:
      - hugo server --buildDrafts --openBrowser=false

  docs:check:
    desc: Check that the generated command reference matches the code
    cmds:
      - scripts/check-docs-drift.sh

  # The docs' screenshots, filmed web walkthrough and recorded terminal, written into
  # docs/assets/images by hand and checked by no gate or CI job, since their
  # bytes differ by machine; scripts/docs-media.sh says what it needs and why.
  docs:media:
    desc: Regenerate the docs' web screenshots, web walkthrough and terminal recording (Linux, with Chromium and ffmpeg, on an idle machine)
    deps: [web:install]
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - scripts/docs-media.sh

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      - govulncheck {{.GO_PKGS}}

  secrets:
    desc: Scan the working tree for secrets
    cmds:
      - gitleaks dir --redact --no-banner .

  secrets:history:
    desc: Scan the commit history for secrets a rebase merge would keep
    cmds:
      - gitleaks git --redact --no-banner .

  cloc:
    desc: Count the source lines, and the Go test ratio (advisory, never a gate)
    cmds:
      # cloc does NOT read .clocrc on its own — its default is
      # ~/.config/cloc/options.txt — so the config is passed explicitly. Without
      # it cloc walks the filesystem and counts bin/, dist/, docs/public/ and
      # the JetBrains files, which makes a Go-only repository look like it is
      # mostly JavaScript.
      - cloc --config .clocrc .
      - echo ""
      - echo "Go, excluding tests:"
      - cloc --config .clocrc --include-lang=Go --not-match-f='_test\.go$' .
      - echo ""
      # The web frontend: React/TypeScript (.ts and .tsx, both counted as
      # TypeScript by cloc) and CSS, minus the hey-api generated client and the
      # vitest/Playwright tests, the same way the Go count drops _test.go.
      # --exclude-dir, as in .clocrc: --not-match-d drops nothing from a
      # --vcs=git file list. Given here it replaces .clocrc's own, which only
      # left out Markdown this line does not count.
      - echo "Web (TypeScript/TSX and CSS), excluding generated code and tests:"
      - cloc --config .clocrc --include-lang=TypeScript,CSS --not-match-f='(\.test\.tsx?|\.spec\.ts)$' --exclude-dir=generated .

  deadcode:
    desc: Report code unreachable from main (advisory, never a gate)
    cmds:
      # Complements golangci-lint's `unused`, which is intra-package and so
      # cannot see an exported identifier in an internal package that nothing
      # imports. Advisory because a helper reached only from tests is dead to
      # this tool and alive to the project.
      - deadcode {{.GO_PKGS}}

  check:
    desc: The full local gate — run this before calling any task done
    # The web frontend's lint, client-drift check and unit tests sit beside
    # their Go twins, so a broken frontend fails here and not first in CI. The
    # Playwright suites stay out: each needs a browser installed, and the
    # server-backed one needs `task build`'s binary and port 13580 free as
    # well. CI's e2e, e2e-engines and e2e-server jobs run them, and `task e2e`
    # by hand.
    cmds:
      - task: lint
      - task: web:lint
      - task: web:gen:check
      - task: web:dist:check
      - task: test:cover
      - task: test:scripts
      - task: web:test
      - task: cover:branch
      - task: vuln
      - task: secrets

  check:docs:
    desc: The gate for a change to the docs alone (scripts/docs-only.sh says which)
    cmds:
      - task: lint:docs
      - task: secrets

  lint:docs:
    desc: The linters and tests a docs-only change can fail, which CI's Lint job runs for one
    # Every gate that reads a file a docs-only change can touch: the Markdown
    # and prose linters and their configuration, the generated command
    # reference, the gates that read CLAUDE.md, scripts/CLAUDE.md, TECH_DEBT.md,
    # README.md, CONTRIBUTING.md and the budget history, and the docs' contract
    # tests. The Go, web and end-to-end suites and the code linters are left
    # out: no file they read changed. The secret scan is check:docs' own step,
    # since CI's Scan job runs it for every change.
    cmds:
      - task: lint:markdown
      - task: lint:typos
      - task: lint:yaml
      - task: lint:toml
      - task: lint:headers
      - task: lint:filelength
      - task: lint:packagesize
      - task: lint:goversion
      - task: lint:tradeoffs
      - task: lint:techdebtpaths
      - task: lint:siblingtests
      - task: lint:layout
      - task: docs:check
      - task: test:docs

  # The Playwright suites `task check` leaves out: the web frontend alone,
  # served by Vite preview, with the axe scan and the layout spec among its
  # specs, then the same page served by the binary `task build` makes,
  # writing through to git. Chromium, Firefox and WebKit each run every spec,
  # so each needs the three browsers (`yarn playwright install chromium
  # firefox webkit` in web/ once), and the second port 13580 free. CI's E2E,
  # E2E (firefox n/3), E2E (webkit n/3) and E2E (server, …) jobs run the same.
  e2e:
    desc: Run the web's Playwright suites, which task check leaves out (needs Chromium, Firefox and WebKit)
    deps: [build]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn test:e2e
      # A run per engine: commit.spec.ts writes to the one fixture a run
      # serves, as in CI's E2E (server) legs.
      - corepack yarn test:e2e:server --project=server
      - corepack yarn test:e2e:server --project=server-firefox
      - corepack yarn test:e2e:server --project=server-webkit

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin dist coverage.out coverage.html

  container:build:
    desc: Build the build-container image (tools pinned from mise.toml and the pin files under build/)
    cmds:
      - >-
        {{.CONTAINER_RUNTIME}} build $(scripts/tool-versions.sh)
        -t {{.BUILD_IMAGE}} -f build/Dockerfile .

  # Both run as the invoking user (CONTAINER_USER), under an init. Root would
  # list a directory a permission test locked, and leave root-owned files in a
  # Linux checkout. The init at PID 1 reaps the orphans a cancel test waits to
  # see gone.
  #
  # The anonymous volume over web/node_modules keeps the host's out of the
  # container: its native bindings are built for the host's platform (darwin on
  # a Mac) and fail to load on Linux, and an install inside the container would
  # otherwise overwrite them. The container installs its own, and --rm drops
  # them with it. Each task first makes web/node_modules on the host, as the
  # invoking user: a missing mount point is made by the runtime as root, in the
  # checkout, before the user flag applies, and --rm leaves it behind.
  container:check:
    desc: Run the full gate inside the build container
    deps: [container:build]
    cmds:
      - mkdir -p web/node_modules
      - >-
        {{.CONTAINER_RUNTIME}} run --rm --init {{.CONTAINER_USER}}
        -v "$(pwd)":/src -v /src/web/node_modules -w /src
        {{.BUILD_IMAGE}} task check

  container:release:
    desc: Cross-compile release binaries into dist/
    deps: [container:build]
    cmds:
      - mkdir -p web/node_modules
      - >-
        {{.CONTAINER_RUNTIME}} run --rm --init {{.CONTAINER_USER}}
        -v "$(pwd)":/src -v /src/web/node_modules -w /src
        {{.BUILD_IMAGE}} task release:binaries

  release:binaries:
    desc: Cross-compile every release platform into dist/ (the release job runs it on its runner)
    # web:build produces internal/web/dist once; every platform embeds the same
    # frontend below.
    deps: [web:build]
    cmds:
      - mkdir -p dist
      - for:
          var: RELEASE_PLATFORMS
          split: " "
          as: PLATFORM
        # {{.PLATFORM}} is a Task template variable, not a shell one: the loop
        # exposes it for interpolation, and it is never exported to the shell.
        # Reading it as ${PLATFORM} gave an empty string, so every platform built
        # to dist/{{.BINARY}}__ and overwrote the last. Interpolate it into a
        # shell variable first, then the goos/goarch split works.
        cmd: |
          platform="{{.PLATFORM}}"
          goos="${platform%%/*}"
          goarch="${platform##*/}"
          ext=""
          [ "$goos" = "windows" ] && ext=".exe"
          echo "Building dist/{{.BINARY}}_${goos}_${goarch}${ext}"
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -trimpath -ldflags="-s -w" \
            -o "dist/{{.BINARY}}_${goos}_${goarch}${ext}" {{.PKG}}

  release:verify:
    desc: Fail unless dist/ holds one binary per release platform and none with an empty platform
    cmds:
      # One binary must exist per target, named for its platform.
      - for:
          var: RELEASE_PLATFORMS
          split: " "
          as: PLATFORM
        cmd: |
          platform="{{.PLATFORM}}"
          goos="${platform%%/*}"
          goarch="${platform##*/}"
          ext=""
          [ "$goos" = "windows" ] && ext=".exe"
          binary="dist/{{.BINARY}}_${goos}_${goarch}${ext}"
          test -f "$binary" || { echo "missing release binary: $binary"; exit 1; }
          echo "ok: $binary"
      # And none built with an empty platform, which is what dist/{{.BINARY}}__
      # was: the failure that shipped one nameless binary instead of the set.
      - |
        set -- dist/{{.BINARY}}__*
        if [ -e "$1" ]; then
          echo "a binary built with an empty platform: $1"
          exit 1
        fi
