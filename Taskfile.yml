version: "3"

vars:
  BINARY: workflow
  PKG: ./cmd/workflow
  # Explicit Go package roots. Not `./...`: web/node_modules ships stray Go
  # (flatted's Go port) that `./...` would sweep into every Go tool. The
  # module's own code is cmd/ and internal/, and nothing else carries Go.
  GO_PKGS: ./cmd/... ./internal/...
  # Generated by `task docs:gen`; never hand-edited.
  DOCS_REFERENCE: docs/content/docs/reference
  # The coverage floor. This is the number the gate enforces — no document
  # restates it, because a restated number drifts. Raise it with the ratchet
  # scripts/coverage-gate.sh prints: floor(measured) - 2.
  #
  # It stepped 95→94 when the white-box tests were removed to make testpackage
  # strict (.golangci.yml — no *_internal_test.go exemption): a few of them
  # covered behavior with no public surface — signal-context cancellation, the
  # --web/--log dispatch, the by-construction help/dry-run/buffer-cap guarantees —
  # which a black-box test cannot reach, so that coverage falls to each package's
  # own tests and the floor lowers to match. The rule does not bend; the floor does.
  # The --web dispatch has since gained a public surface (cli.NewRootCmdOver) and
  # its tests are back, in internal/cli/root_test.go.
  COVERAGE_MIN: 94
  # The condition (branch) coverage floor, enforced over every package gobco can
  # read — scripts/gobco-report.sh's skip list names only the two build-tagged
  # twins it cannot, and the script fails on any package that drops out
  # unannounced.
  #
  # This number went DOWN from 95, and that is the gate getting stronger, not
  # weaker. gobco had been built by an older Go than mise.toml pins, which made
  # it unable to parse internal/cli and internal/tui; both sat on the skip list,
  # so an early figure measured only a fraction of the module's condition arms.
  # Rebuilt correctly, gobco reads every package but the two build-tagged twins,
  # and the floor is measured across all the rest. It started below the measured
  # figure by the standard slack, and ratchets up as the conditions the gate lists
  # get tests. The gate prints the available ratchet on every run.
  #
  # It stepped from 93 to 92 with the scriptable write commands (workflow branch /
  # pr / announce). This module's tests are black-box only (package <name>_test,
  # driving the CLI through cli.Execute, never its unexported seams), and a few of
  # the commands' condition arms have no black-box reach: the working-directory
  # read failing and a Slack post SUCCEEDING (there is a stand-in for the forge CLI
  # but none for the Slack transport, so only a failed post is reachable). See
  # internal/cli/*_test.go. The GitLab-only "merge request" noun was a third until
  # it moved onto forge.Kind, whose own tests reach it.
  #
  # It then stepped 92→91 when the white-box tests were removed to make
  # testpackage strict (.golangci.yml — every *_test.go must be package
  # <name>_test now). Most converted cleanly, but a few condition arms had no
  # public surface at all — signal-context cancellation reaching a subprocess,
  # the --web/--log dispatch, and the by-construction help/dry-run/buffer-cap
  # guarantees — so those tests were deleted and this floor lowered to match.
  # The rule does not bend; the floor does. The --web dispatch has since gained
  # one (cli.NewRootCmdOver, tested in internal/cli/root_test.go).
  BRANCH_COVERAGE_MIN: 91
  # Container tasks work with docker or podman: CONTAINER_RUNTIME=podman task ...
  # container:check needs a VM of about 8 GiB: knip's parser reserves 6 GiB in
  # one allocation, and golangci-lint alone is killed for memory in the 2 GiB a
  # podman machine or colima starts with. Stop the machine and run
  # `podman machine set --memory 8192`, or `colima start --memory 8`.
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  # Runs the container as the invoking user, whose "$(id -u):$(id -g)" the task
  # shell expands on the host. Rootless podman maps that user to root inside
  # the container, so under a bare --user the checkout reads as root's; keep-id
  # maps it to its own uid instead.
  CONTAINER_USER: >-
    {{if eq .CONTAINER_RUNTIME "podman"}}--userns=keep-id{{else}}--user "$(id -u):$(id -g)"{{end}}
  BUILD_IMAGE: '{{.BUILD_IMAGE | default "workflow-build:local"}}'
  # Release targets, as GOOS/GOARCH pairs: Apple Silicon macOS, and amd64 on
  # Linux and Windows.
  RELEASE_PLATFORMS: >-
    darwin/arm64 linux/amd64 windows/amd64

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Download modules and install the git hooks
    cmds:
      - go mod download
      - lefthook install

  build:
    desc: Build the binary into bin/, with the web interface embedded
    deps: [web:build]
    cmds:
      # -tags embedui compiles internal/web's embed of the built frontend, so
      # `workflow --web` serves the app from the one binary. web:build put it in
      # internal/web/dist first.
      - go build -tags embedui -o bin/{{.BINARY}} {{.PKG}}

  run:
    desc: Run from source — `task run -- doctor --online` passes arguments through
    cmds:
      # {{.CLI_ARGS}} is everything after `--`, so subcommands and flags both
      # reach the binary: `task run -- config show`, `task run -- --help`.
      - go run {{.PKG}} {{.CLI_ARGS}}

  # Running the cockpit takes two shells: `task web` serves the Go API and event
  # stream, `task web:ui` serves the frontend that proxies to it. Corepack ships
  # with the pinned Node and runs the yarn the packageManager field names;
  # invoking it as `corepack yarn` sidesteps a mise `yarn` shim that would
  # otherwise shadow it, and DOWNLOAD_PROMPT=0 lets the first run fetch yarn
  # without stopping to ask.
  dev:
    desc: Run the whole cockpit in one shell, live-reloading the Go API and the UI
    deps: [dev:api, dev:ui]

  dev:api:
    internal: true
    cmds:
      # air rebuilds and restarts `workflow --web` on any .go change.
      - air

  dev:ui:
    internal: true
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn install
      - corepack yarn dev

  web:mockup:
    desc: Serve the web UI against mock data in one shell — no backend, for review
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_MOCK: "true"
    cmds:
      - corepack yarn install
      - corepack yarn dev

  web:
    desc: "Serve only the cockpit's API and event stream on 127.0.0.1:7000"
    cmds:
      - go run {{.PKG}} --web

  web:ui:
    desc: "Shell 2 — install and serve the web UI on :5173 (proxies /api to :7000)"
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn install
      - corepack yarn dev

  # The one install every gated web task depends on, so `task check` and
  # `task build` work from a clean checkout. run: once installs a single time
  # however many of those tasks one `task` run pulls in; --immutable installs
  # exactly what yarn.lock pins, fails if package.json disagrees with it, and
  # is a no-op when node_modules already matches.
  web:install:
    internal: true
    run: once
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn install --immutable

  web:lint:
    desc: Lint the web frontend (eslint, tsc, prettier, knip, import boundaries)
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn lint

  # The web twin of gen:verify: regenerate the TypeScript client from
  # api/openapi.yaml and fail on any diff, so a spec change that skipped
  # `yarn gen` is red locally rather than first in CI.
  web:gen:check:
    desc: Fail if the generated web client has drifted from api/openapi.yaml
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn gen:check

  web:test:
    desc: Run the web frontend's unit tests with the coverage floor
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn test

  web:build:
    desc: Build the web frontend's production bundle into internal/web/dist for embedding
    deps: [web:install]
    dir: web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    cmds:
      - corepack yarn build

  test:
    desc: Run the tests with the race detector
    cmds:
      # Git exports the variables that locate a repository to a hook and to
      # `git rebase --exec`, and from a linked worktree GIT_DIR is an absolute
      # path into the shared repository: a test's `git -C <temp dir>` then works
      # on that repository instead. The packages that run git clear them in
      # their TestMain; clearing them here as well, with git's own list
      # (githooks(5)) as lefthook.yml's pre-push does, covers a package that
      # starts running git before it has one. Each cmd is a shell of its own,
      # so the unset shares the line with the tests it protects.
      - unset $(git rev-parse --local-env-vars); go test -race {{.GO_PKGS}}
      - task: test:scripts

  test:scripts:
    desc: Run the gate scripts' own tests
    cmds:
      - scripts/check-commit-message_test.sh
      - scripts/check-docs-drift_test.sh
      - scripts/check-file-length_test.sh
      - scripts/check-go-version_test.sh
      - scripts/check-goroutines_test.sh
      - scripts/check-license-headers_test.sh
      - scripts/check-package-size_test.sh
      - scripts/coverage-gate_test.sh
      - scripts/coverage-summary_test.sh
      - scripts/gobco-report_test.sh
      - scripts/tool-versions_test.sh
      - scripts/release/push-release-tag_test.sh

  test:cover:
    desc: Run the tests and enforce the coverage floor
    cmds:
      # The same scrub as `test`, for the same reason.
      - unset $(git rev-parse --local-env-vars); go test -race -coverprofile=coverage.out -covermode=atomic {{.GO_PKGS}}
      - scripts/coverage-gate.sh coverage.out {{.COVERAGE_MIN}}
      - task: test:scripts

  fuzz:
    desc: Run each fuzz target briefly (advisory, never a gate)
    cmds:
      # `go test -fuzz` runs one target at a time, and the gate only ever runs
      # the seed corpus, so a target that would find a new input never gets the
      # chance. Discover every Fuzz function and give each a short run. Advisory:
      # a real fuzzing session is long and non-deterministic, not something CI
      # should gate on.
      - |
        set -euo pipefail
        for pkg in $(go list {{.GO_PKGS}}); do
          for target in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
            echo "Fuzzing ${target} in ${pkg}"
            go test -run '^$' -fuzz="^${target}$" -fuzztime="${FUZZTIME:-10s}" "$pkg"
          done
        done

  cover:branch:
    desc: Condition (branch) coverage via gobco, with its floor
    cmds:
      # Statement coverage cannot see this: an `if a && b` counts as covered the
      # moment the line runs. gobco reports each condition never observed both
      # ways, which is a list of missing test cases rather than a number to chase.
      # gobco measures a package by running its tests: the same scrub as `test`.
      - unset $(git rev-parse --local-env-vars); scripts/gobco-report.sh {{.BRANCH_COVERAGE_MIN}}

  cover:html:
    desc: Open the coverage profile as HTML
    deps: [test:cover]
    cmds:
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Wrote coverage.html"

  test:summary:
    desc: Report unit and e2e test counts (pass/skip/fail) and coverage (advisory)
    cmds:
      # Runs the Go, web (vitest) and Playwright suites and prints one markdown
      # table of counts and coverage. In CI it also appends to the run summary.
      # Advisory: it reports, it does not gate — the gates are the test jobs.
      # It runs the Go tests too: the same scrub as `test`.
      - unset $(git rev-parse --local-env-vars); scripts/test-summary.sh

  lint:
    desc: Run every linter
    cmds:
      - task: lint:go
      - task: lint:testshape
      - task: lint:shell
      - task: lint:yaml
      - task: lint:docker
      - task: lint:actions
      - task: lint:markdown
      - task: lint:toml
      - task: lint:headers
      - task: lint:typos
      - task: lint:filelength
      - task: lint:packagesize
      - task: lint:goversion
      - task: lint:goroutines
      - task: docs:check
      - task: gen:verify

  lint:go:
    desc: Lint the Go code
    cmds:
      - golangci-lint run

  lint:testshape:
    desc: Check that every test marks its Arrange, Act and Assert
    vars:
      # Tracked and not-yet-added test files alike, so a new test is checked
      # before its first `git add`.
      TEST_FILES:
        sh: git ls-files --cached --others --exclude-standard '*_test.go' | sort | tr '\n' ' '
    cmds:
      - go run ./cmd/testshape {{.TEST_FILES}}

  lint:shell:
    desc: Lint and format-check the shell scripts
    vars:
      # Found rather than globbed: scripts/ has subdirectories, and a glob that
      # silently misses one means a script nobody ever lints.
      SHELL_FILES:
        sh: find scripts .devcontainer -name '*.sh' -type f | sort | tr '\n' ' '
    cmds:
      - shfmt -i 2 -ci -bn -d {{.SHELL_FILES}}
      - shellcheck {{.SHELL_FILES}}

  lint:yaml:
    desc: Lint the YAML
    cmds:
      - yamllint .

  lint:docker:
    desc: Lint the build container's Dockerfile
    cmds:
      - hadolint build/Dockerfile

  lint:actions:
    desc: Lint and security-audit the GitHub Actions workflows
    cmds:
      # actionlint fails on a repo with no workflows, so the absence is handled
      # rather than reported. Written as an if/else on purpose: the older
      # `[ -d … ] && actionlint || echo` form also swallowed actionlint's OWN
      # failure, reporting "no workflows" for a workflow that did not lint.
      # actionlint says a workflow is valid; zizmor says it is safe.
      - |
        if [ -d .github/workflows ]; then
          actionlint
          zizmor --no-progress .github/workflows
        else
          echo "No workflows to lint."
        fi

  lint:markdown:
    desc: Lint the Markdown
    cmds:
      - markdownlint-cli2

  lint:toml:
    desc: Lint and format-check the TOML
    cmds:
      - taplo fmt --check --diff
      - taplo lint

  lint:filelength:
    desc: Check that no source file has grown past the ceiling
    cmds:
      - scripts/check-file-length.sh

  lint:packagesize:
    desc: Check that no directory holds more source files than its budget
    cmds:
      - scripts/check-package-size.sh

  package-size:
    desc: List every source directory with its file count and budget
    cmds:
      - scripts/check-package-size.sh --list

  lint:goversion:
    desc: Check that the Go version agrees across the files that pin it
    cmds:
      - scripts/check-go-version.sh

  lint:goroutines:
    desc: Check that no goroutine is started outside internal/proc
    cmds:
      - scripts/check-goroutines.sh

  lint:headers:
    desc: Check the SPDX license headers on Go files
    cmds:
      - scripts/check-license-headers.sh

  lint:typos:
    desc: Spell-check the repo (American English)
    cmds:
      - typos

  fmt:
    desc: Format everything in place
    vars:
      SHELL_FILES:
        sh: find scripts .devcontainer -name '*.sh' -type f | sort | tr '\n' ' '
    cmds:
      - golangci-lint fmt
      - shfmt -i 2 -ci -bn -w {{.SHELL_FILES}}
      - markdownlint-cli2 --fix
      - taplo fmt

  docs:gen:
    desc: Regenerate the command reference from the Cobra command tree
    cmds:
      - go run ./cmd/docsgen {{.DOCS_REFERENCE}}
      - echo "Wrote the command reference to {{.DOCS_REFERENCE}}"

  gen:
    desc: Regenerate the web API's Go code from api/openapi.yaml
    cmds:
      - go tool oapi-codegen -config api/oapi-codegen-models.yaml api/openapi.yaml
      - go tool oapi-codegen -config api/oapi-codegen-server.yaml api/openapi.yaml

  gen:verify:
    desc: Fail if the generated API code has drifted from api/openapi.yaml
    cmds:
      - task: gen
      - |
        if ! git diff --quiet -- internal/api; then
          echo "Generated API code is out of date. Run 'task gen' and commit." >&2
          git --no-pager diff --stat -- internal/api >&2
          exit 1
        fi

  docs:build:
    desc: Build the documentation site into docs/public
    # CI publishes exactly this output by calling exactly this task. Two copies
    # of a build — one in a Taskfile, one in a workflow — drift, and the site
    # then differs depending on who built it.
    dir: docs
    cmds:
      - hugo --minify

  docs:serve:
    desc: Preview the documentation site with live reload
    dir: docs
    cmds:
      - hugo server --buildDrafts --openBrowser=false

  docs:check:
    desc: Check that the generated command reference matches the code
    cmds:
      - scripts/check-docs-drift.sh

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      - govulncheck {{.GO_PKGS}}

  secrets:
    desc: Scan the working tree for secrets
    cmds:
      - gitleaks dir --redact --no-banner .

  secrets:history:
    desc: Scan the commit history for secrets a rebase merge would keep
    cmds:
      - gitleaks git --redact --no-banner .

  cloc:
    desc: Count the source lines, and the Go test ratio (advisory, never a gate)
    cmds:
      # cloc does NOT read .clocrc on its own — its default is
      # ~/.config/cloc/options.txt — so the config is passed explicitly. Without
      # it cloc walks the filesystem and counts bin/, dist/, docs/public/ and
      # the JetBrains files, which makes a Go-only repository look like it is
      # mostly JavaScript.
      - cloc --config .clocrc .
      - echo ""
      - echo "Go, excluding tests:"
      - cloc --config .clocrc --include-lang=Go --not-match-f='_test\.go$' .
      - echo ""
      # The web frontend: React/TypeScript (.ts and .tsx, both counted as
      # TypeScript by cloc) and CSS, minus the hey-api generated client and the
      # vitest/Playwright tests, the same way the Go count drops _test.go.
      - echo "Web (TypeScript/TSX and CSS), excluding generated code and tests:"
      - cloc --config .clocrc --include-lang=TypeScript,CSS --not-match-f='(\.test\.tsx?|\.spec\.ts)$' --not-match-d='generated' .

  deadcode:
    desc: Report code unreachable from main (advisory, never a gate)
    cmds:
      # Complements golangci-lint's `unused`, which is intra-package and so
      # cannot see an exported identifier in an internal package that nothing
      # imports. Advisory because a helper reached only from tests is dead to
      # this tool and alive to the project.
      - deadcode {{.GO_PKGS}}

  check:
    desc: The full local gate — run this before calling any task done
    # The web frontend's lint, client-drift check and unit tests sit beside
    # their Go twins, so a broken frontend fails here and not first in CI. The
    # Playwright suite stays out: it needs a browser installed, and CI's e2e
    # job runs it (`yarn test:e2e` by hand).
    cmds:
      - task: lint
      - task: web:lint
      - task: web:gen:check
      - task: test:cover
      - task: web:test
      - task: cover:branch
      - task: vuln
      - task: secrets

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin dist coverage.out coverage.html

  container:build:
    desc: Build the build-container image (tools pinned from mise.toml)
    cmds:
      - >-
        {{.CONTAINER_RUNTIME}} build $(scripts/tool-versions.sh)
        -t {{.BUILD_IMAGE}} -f build/Dockerfile .

  # Both run as the invoking user (CONTAINER_USER), under an init. Root would
  # list a directory a permission test locked, and leave root-owned files in a
  # Linux checkout. The init at PID 1 reaps the orphans a cancel test waits to
  # see gone.
  #
  # The anonymous volume over web/node_modules keeps the host's out of the
  # container: its native bindings are built for the host's platform (darwin on
  # a Mac) and fail to load on Linux, and an install inside the container would
  # otherwise overwrite them. The container installs its own, and --rm drops
  # them with it. Each task first makes web/node_modules on the host, as the
  # invoking user: a missing mount point is made by the runtime as root, in the
  # checkout, before the user flag applies, and --rm leaves it behind.
  container:check:
    desc: Run the full gate inside the build container
    deps: [container:build]
    cmds:
      - mkdir -p web/node_modules
      - >-
        {{.CONTAINER_RUNTIME}} run --rm --init {{.CONTAINER_USER}}
        -v "$(pwd)":/src -v /src/web/node_modules -w /src
        {{.BUILD_IMAGE}} task check

  container:release:
    desc: Cross-compile release binaries into dist/
    deps: [container:build]
    cmds:
      - mkdir -p web/node_modules
      - >-
        {{.CONTAINER_RUNTIME}} run --rm --init {{.CONTAINER_USER}}
        -v "$(pwd)":/src -v /src/web/node_modules -w /src
        {{.BUILD_IMAGE}} task release:binaries

  release:binaries:
    desc: Cross-compile every release platform into dist/ (runs in the container)
    # web:build produces internal/web/dist once; every platform embeds the same
    # frontend below via -tags embedui.
    deps: [web:build]
    cmds:
      - mkdir -p dist
      - for:
          var: RELEASE_PLATFORMS
          split: " "
          as: PLATFORM
        # {{.PLATFORM}} is a Task template variable, not a shell one: the loop
        # exposes it for interpolation, and it is never exported to the shell.
        # Reading it as ${PLATFORM} gave an empty string, so every platform built
        # to dist/{{.BINARY}}__ and overwrote the last. Interpolate it into a
        # shell variable first, then the goos/goarch split works.
        cmd: |
          platform="{{.PLATFORM}}"
          goos="${platform%%/*}"
          goarch="${platform##*/}"
          ext=""
          [ "$goos" = "windows" ] && ext=".exe"
          echo "Building dist/{{.BINARY}}_${goos}_${goarch}${ext}"
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
            go build -tags embedui -trimpath -ldflags="-s -w" \
            -o "dist/{{.BINARY}}_${goos}_${goarch}${ext}" {{.PKG}}

  release:verify:
    desc: Fail unless dist/ holds one binary per release platform and none with an empty platform
    cmds:
      # One binary must exist per target, named for its platform.
      - for:
          var: RELEASE_PLATFORMS
          split: " "
          as: PLATFORM
        cmd: |
          platform="{{.PLATFORM}}"
          goos="${platform%%/*}"
          goarch="${platform##*/}"
          ext=""
          [ "$goos" = "windows" ] && ext=".exe"
          binary="dist/{{.BINARY}}_${goos}_${goarch}${ext}"
          test -f "$binary" || { echo "missing release binary: $binary"; exit 1; }
          echo "ok: $binary"
      # And none built with an empty platform, which is what dist/{{.BINARY}}__
      # was: the failure that shipped one nameless binary instead of the set.
      - |
        set -- dist/{{.BINARY}}__*
        if [ -e "$1" ]; then
          echo "a binary built with an empty platform: $1"
          exit 1
        fi
