# typos spell-checker config (https://github.com/crate-ci/typos).
# American English is the house language — see CLAUDE.md.

[files]
extend-exclude = [
  "go.sum",
  "bin/**",
  "dist/**",
  "tmp/**",
]

[default]
# American English is the house language, per CLAUDE.md. Without a locale,
# typos accepts the British forms of color and organize without a word.
locale = "en-us"
# Go module pseudo-versions embed commit hashes whose hex sometimes spells a
# word. Never spell-check a version string.
extend-ignore-re = ["v\\d+\\.\\d+\\.\\d+-[0-9]{14}-[0-9a-f]{12}"]

[default.extend-words]
# Identifiers and proper nouns that are not typos go here as they appear.
