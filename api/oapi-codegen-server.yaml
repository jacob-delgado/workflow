# Generates internal/api/server.gen.go — the spec-driven routing surface: the
# stdlib net/http registration plus the strict, typed handler interface the web
# server implements. No third-party router; the mux is net/http's own.
#
# The two streaming operations are excluded: streamEvents (/api/events) is a
# Server-Sent Events stream and startRun (POST /api/runs) newline-delimited
# JSON, neither of which the strict, one-response-object handler shape can
# express, so the server hand-writes their handlers. Both stay in the spec — the
# request validator checks them and the TypeScript client still types them.
package: api
output: internal/api/server.gen.go
generate:
  std-http-server: true
  strict-server: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  exclude-operation-ids:
    - streamEvents
    - startRun
compatibility:
  always-prefix-enum-values: true
