# The contract for the local web API `workflow --web` serves.
#
# Single source of truth: the Go server (oapi-codegen) and the TypeScript client
# (@hey-api/openapi-ts) are both generated from this file. `task gen:verify`
# fails when the Go code drifts from it, and `task web:gen:check` when the
# TypeScript client does; CI runs both checks. Hand-write this; never hand-edit
# the generated trees.
#
# Field naming is snake_case, matching the rest of the project's JSON (the
# `tagliatelle` linter). Enum values are snake_case too. The server binds to
# 127.0.0.1 only; there is no auth (a single local user), so no security scheme.
openapi: 3.0.3
info:
  title: workflow web API
  description: >-
    The API behind `workflow --web`. It exposes the same information the
    terminal UI shows — the assigned issues, the current branch, the working
    tree, the pull request and its CI, the pull requests waiting on your
    review, your Taskwarrior tasks, and where it announces — makes the
    loop's writes (a checkout, a branch, staging, a commit, a push, a pull
    request and its follow-ups on the issue, an announcement, a change to a
    task), and lets the whole configuration file be read and written. It
    reuses the same domain seams the TUI and the CLI use. Between requests it
    keeps the configuration in effect and the revision of the file it was
    read at; the commit scope it learns, which it records in the store the
    terminal interface reads; who the forge says a post would come from; the
    forge's last answer about the branch's pull request and its CI, which
    every event stream shares until the forge is read again (streamEvents
    says when); which of the branches' issues the tracker last said are
    yours; and a search for Taskwarrior that failed, for a minute.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:13579
    description: >-
      The local server, bound to the loopback interface only. Its port is the
      one `workflow --web --port` names; 13579 when it names none.
tags:
  - name: meta
    description: Server and build information.
  - name: issues
    description: The tracker's issues and their detail.
  - name: repository
    description: The current branch and working tree, and the writes that change them.
  - name: review
    description: The branch's pull request and its CI.
  - name: reviews
    description: The pull requests on the forge that wait on your review.
  - name: tasks
    description: Your Taskwarrior tasks, and the writes that change them.
  - name: summary
    description: What you did over a period, read back from git, Taskwarrior, Jira and the forge.
  - name: repositories
    description: >-
      Where the server works, the directories you keep as favorites, and
      switching to another.
  - name: messaging
    description: Where and as whom an announcement would post.
  - name: config
    description: The configuration file, read and written.
  - name: local-data
    description: The local databases workflow keeps between sessions, listed and removed.
  - name: people
    description: >-
      Whom each code owner is on Slack, and the user groups a repository
      may tag, kept between sessions; and the Slack directory they are
      picked from.
  - name: events
    description: >-
      A live stream of state snapshots, pushed on connect and then every few
      seconds.

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Server and build information.
      tags: [meta]
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default: {$ref: "#/components/responses/Problem"}

  /api/views:
    get:
      operationId: listViews
      summary: The configured issue views (saved JQL), in order.
      tags: [issues]
      responses:
        "200":
          description: The views, which may be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewList"
        default: {$ref: "#/components/responses/Problem"}

  /api/issues:
    get:
      operationId: listIssues
      summary: One page of the issues a view matches.
      tags: [issues]
      parameters:
        - name: view
          in: query
          description: The configured view's name; the default view when omitted.
          required: false
          schema: {type: string}
        - name: start_at
          in: query
          description: The zero-based index of the first issue to return.
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: A page of issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuesPage"
        "404":
          description: No configured view carries that name.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}:
    get:
      operationId: getIssue
      summary: One issue in full, with its comments.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The issue key, such as PROJ-412.
          schema: {type: string}
      responses:
        "200":
          description: The issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetail"
        "404":
          description: No such issue.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}/link:
    post:
      operationId: linkPullRequest
      summary: Link the checked-out branch's pull request on its issue.
      description: >-
        Records the pull request the forge has for the checked-out branch as a
        link on the issue that branch names, so the team that watches the
        tracker sees it — the offer the terminal interface and `workflow pr`
        make once a pull request is open. The caller names only the issue; the
        pull request, its address and its title are the server's to find, never
        the caller's to supply. Refused with 409 when the branch does not name
        that issue or has no pull request, or the server is not running in a
        git repository, and 422 when the tracker cannot take a link or refuses
        this one.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The Jira issue the checked-out branch names, such as PROJ-412.
          schema: {type: string}
      responses:
        "200":
          description: The pull request, now linked on the issue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        "409":
          description: >-
            The checked-out branch does not name this issue, or has no pull
            request to link, or the server is not running in a git repository;
            nothing was linked.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: No tracker that takes a link is configured, or it refused the link.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}/transition:
    post:
      operationId: transitionIssue
      summary: Move an issue to the configured review status.
      description: >-
        Moves the issue to jira.review_status — the move the terminal
        interface and `workflow pr` offer once a pull request is open — and
        only there, without fields: any other change, or this one with its
        fields, is POST /api/issues/{key}/transitions. It is refused with 409
        when Jira offers no such move from where the issue stands, or wants
        fields filled for it (change the status from the issue, whose form asks
        for them), and 422 when no review status or tracker is configured, or
        Jira refuses the move.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The issue to move, such as PROJ-412.
          schema: {type: string}
      responses:
        "200":
          description: The issue, now in the review status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovedIssue"
        "409":
          description: >-
            Jira offers no move to the review status that needs no fields;
            nothing was moved.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: No review status or tracker is configured, or Jira refused the move.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}/comment:
    post:
      operationId: addComment
      summary: Comment on an issue, in Jira or on the forge.
      description: >-
        Posts a comment on the issue, as the terminal interface's c does, and
        answers the comment as its tracker stored it. On a Jira issue, with
        jira.markdown_comments on as last saved — a Settings save applies to
        the next comment, with no restart — the text is written as Markdown
        and posted as Jira's wiki markup; otherwise it is posted as it is, and
        Jira reads it as wiki markup. On a forge issue, numbered such as 42,
        the text is posted as it is, since the forge renders Markdown itself;
        GitLab runs a line starting with / as a quick action, and a comment
        made only of them is answered as an empty comment. It is refused with
        404 when the tracker has no such issue, and 422 when no tracker takes
        comments, the text is blank, the repository's forge cannot be told, or
        the tracker refuses the comment, with the forge's own reason when it
        gives one. Under --dry-run it is refused with a plain-text 403 and
        nothing is sent.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The issue to comment on, a Jira key such as PROJ-412 or a forge issue's number such as 42.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "200":
          description: The comment, as its tracker stored it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: The tracker has no such issue; nothing was posted.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Commenting is not available, the text is blank, the forge cannot be
            told, or the tracker refused the comment; nothing was posted.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}/transitions:
    get:
      operationId: listStatusChanges
      summary: The status changes the tracker offers an issue, with the fields each needs.
      description: >-
        Lists every status change the tracker offers the issue from where it
        stands — the list the terminal interface's t shows — each with the
        fields it cannot be made without and, for a field with a fixed set of
        values, those values. A forge issue offers one change, to close it. A
        field only Jira's own screen can fill is listed as only_jira, so the
        page can say so rather than offer a change it cannot make. Answered
        404 when the tracker has no such issue, and 422 when no tracker is
        configured. Reading works under --dry-run.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The issue, a Jira key such as PROJ-412 or a forge issue's number such as 42.
          schema: {type: string}
      responses:
        "200":
          description: The changes offered, in the tracker's order; empty when it offers none.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/StatusChange"}
        "404":
          description: The tracker has no such issue.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: No tracker is configured.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: changeStatus
      summary: Change an issue's status, filling the fields the change needs.
      description: >-
        Makes the status change named by its id, with a value for each field
        it needs, as the terminal interface's t and its field form do. The
        changes are read again first, so a change the tracker no longer offers
        from where the issue stands now is refused with 409 and nothing is
        sent. A field left without a value, a value the field does not take (an
        option it does not offer, a date that is not one), a field it does not
        ask for, or a field only Jira's own screen can fill is refused with 422
        naming the field, before the tracker is asked. A change the tracker
        refuses is a 422, and a tracker that cannot be reached a 502; neither
        answer carries the tracker's address. Under --dry-run it
        is refused with a plain-text 403 and nothing is sent.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The issue to change, a Jira key such as PROJ-412 or a forge issue's number such as 42.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
      responses:
        "200":
          description: The issue, now in the status the change leads to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovedIssue"
        "404":
          description: The tracker has no such issue; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: The tracker no longer offers that change from where the issue stands; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            No tracker is configured, a field's value is missing or not one it
            takes, or the tracker refused the change; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}/assignee:
    put:
      operationId: assignIssue
      summary: Assign an issue to someone, by username.
      description: >-
        Sets the issue's assignee, as the terminal interface's a does: a Jira
        username on a Jira issue, the forge's on a forge issue. A blank
        username is refused with 422 before the tracker is asked, and one the
        tracker refuses (no such user, or one who cannot be assigned) is a
        422 too. Under --dry-run it is refused with a
        plain-text 403 and nothing is sent.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The issue to assign, a Jira key such as PROJ-412 or a forge issue's number such as 42.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        "200":
          description: The issue and whom it is now assigned to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedIssue"
        "404":
          description: The tracker has no such issue; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Assigning is not available, the username is blank, or the tracker
            refused it; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/issues/{key}/worklog:
    post:
      operationId: logWork
      summary: Log time spent on a Jira issue.
      description: >-
        Logs work against a Jira issue, as the terminal interface's w does: a
        duration in Jira's own words (2h, 30m, 1d 4h) and an optional note.
        A forge issue keeps no worklog, and is refused with 422, as is a blank
        duration, before Jira is asked; a duration Jira cannot read is a 422
        too. Under --dry-run it is refused with a
        plain-text 403 and nothing is sent.
      tags: [issues]
      parameters:
        - name: key
          in: path
          required: true
          description: The Jira issue to log work on, such as PROJ-412.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorklogRequest"
      responses:
        "200":
          description: The work, as Jira logged it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedWork"
        "404":
          description: Jira has no such issue; nothing was logged.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Logging work is not available here, the duration is blank, or Jira
            refused it; nothing was logged.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/branch:
    get:
      operationId: getBranch
      summary: The current branch and how it stands against its base.
      tags: [repository]
      responses:
        "200":
          description: The branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default: {$ref: "#/components/responses/Problem"}

  /api/changes:
    get:
      operationId: listChanges
      summary: The working tree's changes.
      tags: [repository]
      responses:
        "200":
          description: The changes, which may be empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default: {$ref: "#/components/responses/Problem"}

  /api/changes/diff:
    get:
      operationId: getChangeDiff
      summary: A changed file's diff against HEAD, so it can be read before staging.
      description: >-
        The diff of one of the working tree's changes against HEAD, staged and
        unstaged together, line by line with every terminal control taken
        out — the terminal interface's diff of the selected file. The file is
        named by the path the working tree's changes list it under, and the
        server finds that change there, so a rename reads both of its paths
        and no path of the caller's own reaches git. An untracked file reads
        as one line saying so. Refused with 404 when no change is at that
        path, and 422 when there is no repository to read.
      tags: [repository]
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string}
          description: The changed file's path, as the working tree's changes list it.
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDiff"
        "404":
          description: No change is at that path.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: There is no repository to read a diff from.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/runs:
    post:
      operationId: startRun
      summary: Run pre-commit, rebase onto the base, amend or fix up, streaming its output.
      description: >-
        Starts one of the git runs the terminal streams in its run overlay,
        and streams its output as it is written: pre_commit runs the
        pre-commit hook on what is staged, without committing (the
        terminal's h); rebase replays the branch onto its base (u); amend
        folds the staged changes into the last commit not yet pushed (A);
        fixup records a fixup! of the commit named, one not yet pushed (f).
        The server reads the branch and the changes itself, so a rebase
        goes onto the base git names, and only a commit not yet pushed is
        ever rewritten. The answer is newline-delimited JSON, one RunEvent a
        line: the run as it starts, then each line of output as the program
        writes it, then the run as it ended. The run goes on to its end if
        the page goes away, and the event stream's run carries it meanwhile.
        One run goes at a time, and it holds the index, so a stage or a
        commit asked for meanwhile waits for it. A conflict leaves a rebase
        midway, for a terminal to finish. Refused before anything runs, as
        a problem: 409 when a run is going already, or there is nothing to
        rebase, amend or fix up; 422 when the run is not available here, the
        commit named cannot be fixed up, or the program could not start.
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: The run's events, one JSON object a line.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/RunEvent"
        "409":
          description: >-
            A run is going already, or there is nothing to rebase, amend or
            fix up; nothing was run.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            The run is not available, the commit cannot be fixed up, or the
            program could not start.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/hooks/setup:
    get:
      operationId: getHookSetup
      summary: The lefthook configuration offered for hooks lefthook does not manage.
      description: >-
        The git hooks in the repository's hooks directory that lefthook does
        not manage, and the lefthook.yml that would run them, as the
        terminal's g offers it: the configuration a hook's plain commands
        become, and how many hooks are kept whole as scripts under
        .lefthook. Nothing is offered once the repository configures
        lefthook, or holds no such hook. A read; nothing is written.
      tags: [repository]
      responses:
        "200":
          description: What would be set up, if anything.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookSetup"
        "422":
          description: There is no repository whose hooks can be read.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: setUpHooks
      summary: Write the offered lefthook.yml and install lefthook.
      description: >-
        Writes the lefthook configuration GET /api/hooks/setup offers — or,
        with verbatim, one that keeps every hook whole as a script, the
        terminal's other choice — with its scripts under .lefthook, then
        installs lefthook, which keeps the old hooks as .git/hooks/*.old. A
        change on this machine alone, which the offer itself previews.
        Refused with 409 when nothing is offered any more, and 422 when it
        is not available or the write or the install fails.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookSetupRequest"
      responses:
        "200":
          description: What was set up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookSetupWritten"
        "409":
          description: Nothing is offered to set up; nothing was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Setting up is not available, or the write or the install failed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/runs/current:
    delete:
      operationId: stopRun
      summary: Stop the run that is going.
      description: >-
        Stops the run POST /api/runs started — its program and every process
        it started — as the terminal's interrupt stops one, and answers once
        it is asked to stop; the run's own stream then ends with it stopped.
        A rebase stopped midway is left midway for a terminal to finish.
        Refused with 404 when no run is going.
      tags: [repository]
      responses:
        "204":
          description: The run was asked to stop.
        "404":
          description: No run is going.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/stage:
    post:
      operationId: stage
      summary: Stage a changed file, or every change the index does not hold yet.
      description: >-
        Takes a changed file into the index — the terminal interface's space —
        or, with all, every change the index does not hold yet: the rest of a
        partly staged file, an edit, an untracked file, and a conflict, which
        staging marks resolved (the terminal's a). The file is named by the
        path the working tree's changes list it under, and the server finds
        that change there, so a rename stages both of its paths and no path of
        the caller's own reaches git. Refused with 404 when no change is at
        that path, and 422 when staging is not available, the request names
        neither a path nor all (or both), or git will not stage it.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagingRequest"
      responses:
        "200":
          description: The working tree's changes, now staged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "404":
          description: No change is at that path; nothing was staged.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Staging is not available, the request names neither a path nor
            all, or git would not stage the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/unstage:
    post:
      operationId: unstage
      summary: Take a changed file out of the index, or every staged change.
      description: >-
        Takes a file's staged changes out of the index, leaving the work tree
        as it is — the terminal interface's space on a wholly staged file — or,
        with all, every staged change. The file is named and found as for
        POST /api/stage. Refused with 404 when no change is at that path, and
        422 when staging is not available, the request names neither a path
        nor all (or both), or git will not unstage it.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagingRequest"
      responses:
        "200":
          description: The working tree's changes, now unstaged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "404":
          description: No change is at that path; nothing was unstaged.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Staging is not available, the request names neither a path nor
            all, or git would not unstage the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/discard:
    post:
      operationId: discard
      summary: Drop a changed file's changes, staged and not.
      description: >-
        Discards a file's changes from the index and the work tree — the
        terminal interface's x, after its last look — which cannot be undone:
        a tracked file is put back as the last commit has it, and a file git
        does not track is deleted. The file is named and found as for POST
        /api/stage. Refused with 404 when no change is at that path, and 422
        when discarding is not available or git will not discard it.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardRequest"
      responses:
        "200":
          description: The working tree's changes, the file's now gone from them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "404":
          description: No change is at that path; nothing was discarded.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Discarding is not available, or git would not discard the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/pull-request/merge:
    get:
      operationId: getMergeMethods
      summary: How the branch's pull request may be merged, for the merge's preview.
      description: >-
        The merge methods the repository permits — a merge commit, a squash,
        a rebase — for the checked-out branch's pull request, once it can be
        merged as the terminal's M asks: open, not a draft, free of
        conflicts, approved with no changes asked for, and its CI passed. A
        read, so it answers under --dry-run too. Refused with 409 when the
        pull request cannot be merged yet, and 422 when merging is not
        available or the repository permits no method.
      tags: [review]
      responses:
        "200":
          description: The pull request and the methods permitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeOffer"
        "409":
          description: There is no pull request that can be merged now.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Merging is not available, or the repository permits no method.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: mergePullRequest
      summary: Merge the branch's pull request by a permitted method.
      description: >-
        Merges the checked-out branch's pull request by the method asked, one
        the repository permits, after the preview the page shows — the
        terminal's M. The pull request is read again first and merged only if
        it can still be merged. Refused with 409 when it cannot be merged
        now, and 422 when the method is not one permitted or the forge
        refuses the merge: a token without the scope a merge needs is told
        in the forge's words, naming the scope, never its address.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: The pull request, merged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        "409":
          description: There is no pull request that can be merged now; nothing was merged.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The method is not permitted, merging is not available, or the forge refused.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/branch/finish:
    post:
      operationId: finishBranch
      summary: Finish a merged branch — switch to the base, catch it up, delete the branch.
      description: >-
        Runs the three git commands the terminal's F previews — git switch to
        the base, git pull --ff-only, git branch -D the branch — once the
        branch's pull request has merged, the branch is checked out with a
        base to return to, and it holds no commit origin lacks, which the
        delete would lose. Refused with 409 when it cannot be finished, and
        422 when finishing is not available or git refuses, whose own words
        stay off the wire since they name origin.
      tags: [review]
      responses:
        "200":
          description: The branch now checked out, the base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: There is no merged branch to finish; nothing was run.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Finishing is not available, or git refused.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/review/rerun:
    post:
      operationId: rerunChecks
      summary: Re-run the failed CI on the branch's pull request.
      description: >-
        Asks the forge to re-run the failed checks of the checked-out
        branch's open pull request — the terminal's R — after the page's last
        look. The pull request and its CI are read again first. Answers
        whether anything was re-run: a failure with no job to restart re-runs
        nothing. Refused with 409 when the pull request is not open with
        failed CI, and 422 when re-running is not available or the forge
        refuses, in its own words, which name the scope, never its address.
      tags: [review]
      responses:
        "200":
          description: Whether anything was re-run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rerun"
        "409":
          description: There is no failed CI on an open pull request to re-run.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Re-running is not available, or the forge refused.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/review/checks/{id}/log:
    get:
      operationId: getCheckLog
      summary: The end of a check's log, read on demand.
      description: >-
        Reads the last lines of the log of one of the current pull request's
        checks, a GitHub Actions run or a GitLab job, with every terminal
        control taken out. Only a check the pull request's CI lists now is
        read; it is never read as CI is polled.
      tags: [review]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          description: The check's id, as the review's CI lists it.
      responses:
        "200":
          description: The end of the log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobLog"
        "404":
          description: No check of the current pull request has that id.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The forge keeps no log for the check.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/review:
    get:
      operationId: getReview
      summary: The branch's pull request and its CI, if one is open.
      tags: [review]
      responses:
        "200":
          description: The review state; pull and ci are absent when none is found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default: {$ref: "#/components/responses/Problem"}

  /api/reviews:
    get:
      operationId: listReviews
      summary: The pull requests on the forge that wait on your review.
      description: >-
        The review queue `workflow reviews` prints and the terminal's Reviews
        pane shows: the open pull or merge requests, across repositories,
        that ask for your review, the longest-waiting first. It is a search
        of the forge, not a snapshot field, so the stream does not carry it.
      tags: [reviews]
      responses:
        "200":
          description: >-
            The queue. With no forge to ask — outside a repository, or with an
            origin on no forge workflow can read — available is false and the
            queue is empty: an answer about where the server runs, not a
            missing resource, so never a 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueue"
        default: {$ref: "#/components/responses/Problem"}

  /api/messaging:
    get:
      operationId: getMessaging
      summary: The service, channel, its alternates, and who a post would come from.
      tags: [messaging]
      responses:
        "200":
          description: The messaging destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingDestination"
        default: {$ref: "#/components/responses/Problem"}

  /api/config:
    get:
      operationId: getConfig
      summary: The configuration in effect, with secrets masked.
      description: >-
        Reads the configuration file on each request, so an edit made to it on
        disk since the server last read or wrote it (by hand, or by `workflow
        config init --force`) becomes the configuration in effect. A file that
        has been deleted leaves the configuration in effect as it was, and a
        write puts the file back. The ETag names that configuration, even when
        its file is gone, and a write sends it back in If-Match. With no
        configuration file where the server works, it answers 404: a first one
        is set up through /api/config/setup.
      tags: [config]
      responses:
        "200":
          description: The configuration, redacted.
          headers:
            ETag:
              $ref: "#/components/headers/ConfigRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "404":
          description: >-
            No configuration file applies where the server works; set one up
            through /api/config/setup, or with workflow config init.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            The configuration file on disk is not valid; the configuration in
            effect is unchanged. workflow doctor says what is wrong with it.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    put:
      operationId: updateConfig
      summary: Write the configuration file.
      description: >-
        Replaces the configuration file, but only while it is still at the
        revision If-Match names, so a change made since that read, on disk or
        by another tab's save, refuses the write with 409. The check and the
        write are not one step, so a change landing between the two is written
        over. A secret field
        (jira.token, messaging.client_secret, messaging.refresh_token,
        messaging.access_token, messaging.webhook_url, forge.token) left empty
        or sent back with its masked value keeps the stored secret; a new value
        replaces it, and null removes it — every one but
        messaging.access_token, which goes with the client secret or the
        refresh token. A Jira header left out of jira.headers is removed. The body is validated the same way a file read is,
        and its ui.keys map is checked as the terminal interface checks one
        before it starts; a body that fails either is rejected with 422. With
        no configuration file where the server works there is none to write
        over, and it answers 404: a first one is set up through
        /api/config/setup.
      tags: [config]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            The ETag of the read the change was made over. A write without it
            is refused with 428, one whose value is not in the form of an ETag
            a read returns with 400, and one naming a revision the file is no
            longer at with 409.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: The configuration as written, redacted.
          headers:
            ETag:
              $ref: "#/components/headers/ConfigRevision"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "404":
          description: >-
            No configuration file applies where the server works; nothing was
            written. Set one up through /api/config/setup.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: >-
            The configuration file changed since the revision If-Match names,
            edited on disk or saved from another tab; nothing was written. Read
            it again, then make the change again.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            The configuration is invalid, or holds a ui.keys map the terminal
            interface would refuse to start on; nothing was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "428":
          description: The request named no revision in If-Match; nothing was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/keys:
    get:
      operationId: getKeys
      summary: The terminal interface's key actions, as its help lists them.
      description: >-
        Every action the terminal interface's help lists, in its order, with
        the ui.keys of the configuration in effect applied, so a page binds
        the same keys the terminal does and a rebinding in the file reaches
        both; and whether the page's single-key shortcuts are on
        (ui.web_shortcuts).
      tags: [config]
      responses:
        "200":
          description: The actions and the shortcut setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        default: {$ref: "#/components/responses/Problem"}

  /api/config/setup:
    get:
      operationId: getSetup
      summary: Whether a first configuration file is needed here, and where it may go.
      description: >-
        Says whether no configuration file applies where the server works, so
        Settings offers to set one up rather than edit one; where the file may
        go — the repository's root, or the working directory outside a
        repository, and the home directory — and whether the OS keychain can
        keep the Jira token out of it. Reading works under --dry-run.
      tags: [config]
      responses:
        "200":
          description: The setup offered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOffer"
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: setUp
      summary: Write a first configuration file, as workflow config init does.
      description: >-
        Asks what workflow config init asks, in one request: checks the Jira
        token with Jira over the server's own transport before anything is
        written, keeps it in the OS keychain when asked — so the file holds
        the command that reads it back — or in the file, which only you can
        read, and saves a Slack incoming webhook unchecked. A blank Jira
        address or webhook leaves that part out. Once the file is written the
        server works with it, as after a switch: open event streams end,
        asking the page to reconnect, and every read after answers with it.
        No answer carries a credential. Refused with 409 while a configuration
        file applies here or one is at the path chosen, which it never writes
        over, and with 403 under --dry-run, by the guard every write passes.
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: The file written, and whom the token authenticates as.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResult"
        "409":
          description: >-
            A configuration file already applies where the server works, or
            one is at a path setup offers; nothing was written. A file made
            since the server started (by hand, by config init, or by a setup
            that could not be taken up) is taken up, so Settings edits it.
            One setup runs at a time: of two sent at once, one writes and the
            other is answered 409.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Jira did not accept the token, or could not be asked, and the
            request did not say to keep it unchecked (code check_failed; send
            keep_unchecked to write it anyway); or Jira's address is not an
            http or https address without a username and password, which is
            never kept, keep_unchecked or not (code unprocessable); or the
            keychain was asked for where there is none. Nothing was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/local-data:
    get:
      operationId: getLocalData
      summary: The local databases workflow keeps, each with its size and what it holds.
      description: >-
        Lists the directory the store keeps its files in and each database
        file there: the cache (workflow.db), which a session makes again, and
        the kept file (kept.db), whom each code owner is on Slack and each
        repository's groups. A file is read without being written, and one
        that is not there is left out. Reading works under --dry-run.
      tags: [local-data]
      responses:
        "200":
          description: The directory and its database files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalData"
        "422":
          description: There is no store directory to list, or listing it is not available here.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeLocalData
      summary: Remove the cache, or with scope all the kept associations too.
      description: >-
        Removes the cache's database with its -wal and -shm companions, and
        with scope all the kept file's too, so people and group associations
        are asked again. Every file is set aside before any is removed, so a
        file that cannot be removed leaves the rest in place. Refused with 403
        under --dry-run, by the guard every write passes.
      tags: [local-data]
      parameters:
        - name: scope
          in: query
          required: true
          description: cache removes workflow.db; all also removes kept.db.
          schema:
            type: string
            enum: [cache, all]
      responses:
        "200":
          description: The directory and the database files left after the removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalData"
        "409":
          description: >-
            A file could not be removed, as one another program holds open can
            be on Windows. A file that could not be set aside leaves every
            file in place; one that could not be deleted after the rest were
            may leave some removed, so read the listing again to see what is
            left.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            Something other than the store's own plain file sits where a
            database file belongs, a symlink or a directory; nothing was
            removed. Or removing is not available here.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/slack/members:
    get:
      operationId: getSlackMembers
      summary: The people in a Slack channel, to link a code owner to.
      description: >-
        Everyone in the channel, labeled by the name Slack shows for them —
        the people a code owner who is a user can be linked to. Read only
        with a Slack user token, and kept for the session for ten minutes. A
        token without a scope the read needs is not a failure: the answer is
        empty and names the scope to add.
      tags: [people]
      parameters:
        - name: channel
          in: query
          required: false
          description: The channel, by name or ID; the configured channel when left out.
          schema: {type: string, maxLength: 200}
      responses:
        "200":
          description: The channel's members, or the scope the token lacks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackDirectory"
        "422":
          description: >-
            There is no Slack user token to read with, or no channel of yours
            has that name.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/slack/groups:
    get:
      operationId: getSlackGroups
      summary: The Slack workspace's user groups, to tag or to link a team to.
      description: >-
        Every enabled user group in the workspace. Read only with a Slack user
        token, and kept for the session for ten minutes. A token without the
        scope the read needs is not a failure: the answer is empty and names
        the scope to add. A workspace with no user groups answers none.
      tags: [people]
      responses:
        "200":
          description: The user groups, or the scope the token lacks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackDirectory"
        "422":
          description: There is no Slack user token to read with.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/people:
    get:
      operationId: getPeople
      summary: Whom each code owner is on Slack, on this repository's forge host.
      description: >-
        Every code owner decided on this forge host — linked to a Slack user
        (a team, to a user group) or marked not on Slack — then the owners of
        the branch's changes not decided yet. Kept in kept.db, which survives
        the cache's schema changes. Reading works under --dry-run.
      tags: [people]
      responses:
        "200":
          description: The owners and what is known of each on Slack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/People"
        "422":
          description: There is no store to keep people in.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    put:
      operationId: linkPerson
      summary: Record whom a code owner is on Slack, or that they are not on it.
      description: >-
        Links an owner to a Slack user — a team to a user group — or marks
        them not on Slack, so they are not asked again. The label kept is the
        one Slack's directory gives the ID, never the caller's. Refused with
        403 under --dry-run, by the guard every write passes.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonLink"
      responses:
        "200":
          description: The owners as they stand after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/People"
        "422":
          description: >-
            The link names both a Slack ID and not on Slack, or neither; an ID
            of the wrong kind for the owner (a user for a team, a group for a
            user) or one the channel's members or the workspace's user groups
            do not hold; or there is no Slack user token or no store. Nothing
            was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: forgetPerson
      summary: Forget what was decided for a code owner, so they are asked again.
      description: >-
        The owner is a query parameter, since a team's name holds a slash.
        Refused with 403 under --dry-run, by the guard every write passes.
      tags: [people]
      parameters:
        - name: owner
          in: query
          required: true
          description: The forge owner, a user or org/team.
          schema: {$ref: "#/components/schemas/OwnerName"}
      responses:
        "200":
          description: The owners as they stand after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/People"
        "422":
          description: There is no store to keep people in; nothing was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/repo-groups:
    get:
      operationId: getRepoGroups
      summary: The Slack user groups this repository's announcements may tag.
      description: >-
        The user groups chosen for this repository, which a ready-for-review
        announcement offers to tag. Reading works under --dry-run.
      tags: [people]
      responses:
        "200":
          description: The repository and its groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoGroups"
        "422":
          description: There is no store to keep groups in.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    put:
      operationId: setRepoGroups
      summary: Replace the Slack user groups this repository may tag.
      description: >-
        Replaces the list with the groups named, by ID. A group already
        saved keeps the label it was saved with, so one Slack no longer lists,
        or a token without the scope to read them, can still be kept or
        cleared; a new group's label is read from Slack's directory, never
        taken from the caller. Clearing the list needs no directory at all.
        Refused with 403 under --dry-run, by the guard every write passes.
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoGroupsRequest"
      responses:
        "200":
          description: The repository and its groups after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoGroups"
        "422":
          description: >-
            A new ID names no user group of the workspace, the token lacks the
            scope to read them, or there is no Slack user token to read a new
            one with, or no store. Nothing was written.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/branch/issue:
    put:
      operationId: linkBranchIssue
      summary: Link the checked-out branch to an issue, for work begun outside workflow.
      description: >-
        Keeps the issue in the repository's git configuration, so a branch whose
        name names no issue is for it from then on. With update_pull, the line
        naming the issue is added to the description of the pull request open
        from the branch, as workflow writes it on a pull request it opens,
        unless the description already names the issue. The description is
        changed first, so a forge that refuses the change leaves the branch
        unlinked; a link that then could not be kept is answered as such, and
        asking again is safe.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchIssueRequest"
      responses:
        "200":
          description: The branch, linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: No branch is checked out to link; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            The key names no issue, the link could not be kept, or linking is
            not available here.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: unlinkBranchIssue
      summary: Forget the issue the checked-out branch was linked to.
      tags: [repository]
      responses:
        "200":
          description: The branch, no longer linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: No branch is checked out to unlink; nothing was changed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The link could not be forgotten, or unlinking is not available here.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/branch/issue/preview:
    get:
      operationId: previewBranchIssue
      summary: What linking the checked-out branch to an issue would write in its pull request.
      tags: [repository]
      parameters:
        - name: key
          in: query
          required: true
          schema: {type: string}
          description: A Jira key, or a forge issue number with or without its #.
      responses:
        "200":
          description: >-
            The pull request's description with the issue's line added, and
            whether it needed adding; no pull request is pull 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchIssuePreview"
        "422":
          description: The key names no issue.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/checkout:
    post:
      operationId: checkout
      summary: Check out a local branch, switching the working tree to it.
      description: >-
        Switches to the named local branch — the write half of moving between
        issues. It is refused with 409 when the working tree has uncommitted
        changes, the same guard the terminal interface applies, so switching
        never carries work in progress onto another branch, and when the server
        is not running in a git repository.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: >-
            The branch that is now checked out. If it cannot be read back after
            the switch, only its name is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: >-
            The working tree has uncommitted changes, or the server is not
            running in a git repository; nothing was switched.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The branch could not be checked out.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/branches:
    post:
      operationId: createBranch
      summary: Create and switch to a branch for an issue — start work on it.
      description: >-
        Names a branch for the issue by the branch-name convention (from the
        issue's type and summary), fetches origin unless asked not to, and
        creates it off the base branch, switching the working tree to it. This is how a not-started issue is picked up. It
        is refused with 409 when a branch for the issue already exists — check
        that one out instead — and when the server is not running in a git
        repository.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "200":
          description: >-
            The branch that was created and is now checked out. If it cannot be
            read back after it was created, only its name is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: >-
            A branch for the issue already exists, or the server is not running
            in a git repository; nothing was created.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The branch could not be created.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/worktrees:
    post:
      operationId: createWorktree
      summary: Create a branch for an issue in a new worktree — start work on it there.
      description: >-
        Names a branch for the issue as createBranch does, fetches origin as
        it does, and creates it off the base branch in a new git worktree beside the repository, leaving
        the server's own checkout and directory as they are; switching to the
        worktree is PUT /api/repositories/here. It is refused with 409 when a
        branch for the issue already exists, and when the server is not
        running in a git repository.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorktreeRequest"
      responses:
        "200":
          description: The worktree that was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWorktree"
        "409":
          description: >-
            A branch for the issue already exists, or the server is not running
            in a git repository; nothing was created.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The worktree could not be created.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/announcement:
    get:
      operationId: getAnnouncement
      summary: The announcement message that would be posted, for a preview.
      description: >-
        Composes the announcement for the checked-out branch's pull request —
        author, title, link, and the issue — from the configured template,
        without posting it. With a Slack user token, tagging says whom it
        proposes to tag: the code owners of the branch's changes and the user
        groups it offers. Answered 409 when there is no pull request to
        announce, or the server is not running in a git repository.
      tags: [messaging]
      parameters:
        - name: channel
          in: query
          required: false
          description: >-
            The channel the preview would post to, whose members an owner not
            yet linked is checked against; the configured channel when left
            out.
          schema: {type: string, maxLength: 200}
      responses:
        "200":
          description: The composed announcement and the channel it would post to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "409":
          description: >-
            There is no pull request to announce, or the server is not running
            in a git repository.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/announce:
    post:
      operationId: announce
      summary: Post the pull request announcement to the configured service.
      description: >-
        Posts the composed announcement (see GET /api/announcement) to the
        configured service — to the given channel, or the configured one when
        none is given, or the webhook's own channel. Given the text a preview
        showed, it posts only that text: when the announcement composed now
        reads differently (CI turned red, the pull request merged), nothing is
        posted and the answer is 409, so the caller previews it again. Refused
        with 409 too when there is no pull request to announce or the server is
        not running in a git repository, and 422 when the service refuses the
        post or is not set up. Given mentions, it tags the linked user owners
        and the groups named on a line after the text; a group the
        announcement did not offer, or mentions where it tags no one, is a
        422 and nothing is posted; a service that cannot be reached, or asks to
        wait, is a 502. The mentions carry the user IDs the preview showed
        tagged: when the linked owners read now differ (a link changed in
        Settings or a terminal since), nothing is posted and the answer is
        409, as for changed text. Tagging needs a Slack user token in the
        configuration in effect at the post. No answer carries the service's
        own error, which can name the webhook. Given edited_text, that text is
        posted in place of the composed one, as the terminal's e in the
        preview does — still only when the announcement composed now reads as
        the given text did, so an edit never goes out over a moment that has
        passed; blank edited text is a 422. Given when ci_passes, as the
        terminal's w, a ready-for-review announcement whose pull request's CI
        is still running is held by the server and answered 202; it is posted
        once the forge reports the CI passed, and dropped, with the reason,
        when the CI fails or the branch's pull request is another one. One
        whose CI has passed already is posted at once (200), and one with no
        CI to wait for, or not ready for review, is a 409. The server holds a
        waiting announcement in memory and reads the CI for it on its own, on
        timing.ci_interval, whether a page is open or not: it is lost, unposted,
        if the server stops or switches directory first. Announcing now drops
        a waiting one, so the channel never reads it twice. A post that goes
        is remembered in the store, as the terminal's are, and a moment the
        store remembers announced already — from here, the terminal or
        workflow announce — is refused with 409, as the terminal offers no
        announcement it has made.
      tags: [messaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnounceRequest"
      responses:
        "200":
          description: The announcement as posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "202":
          description: The announcement, held until the pull request's CI passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedAnnouncement"
        "409":
          description: >-
            There is no pull request to announce, the server is not running in
            a git repository, or the announcement changed since the given text
            was previewed, or whom it tags did since the mentions' users were;
            or it was already announced at this moment; or, to post when CI
            passes, it is not ready for review or its pull
            request reports no CI.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            The announcement could not be posted, or its mentions name a
            group it does not offer.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/announce/queued:
    delete:
      operationId: cancelQueuedAnnouncement
      summary: Drop the announcement waiting for CI to pass, unposted.
      description: >-
        Drops the announcement POST /api/announce holds until the pull
        request's CI passes, so it is never posted. Refused with 409 when none
        is waiting — posted already, dropped, or never held. Under --dry-run it
        is refused with a plain-text 403, as every write is.
      tags: [messaging]
      responses:
        "204":
          description: The waiting announcement was dropped; nothing was posted.
        "409":
          description: No announcement is waiting for CI.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/push:
    post:
      operationId: push
      summary: Push the current branch to its remote, setting upstream.
      description: >-
        Publishes the checked-out branch to the push remote, setting upstream if
        it has none — the first outward step of opening a pull request. It is
        refused with 409 when there is nothing to push (a detached HEAD, the
        base branch, or a branch already published on its push remote and not
        ahead of it there) or the server is not running in a git repository, and 422 when the push
        fails.
      tags: [repository]
      responses:
        "200":
          description: The branch, now published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: >-
            There is nothing to push — a detached HEAD, the base branch, or a
            branch already published on its push remote and not ahead of it
            there — or the server is not running in a git repository.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The push failed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/commit:
    post:
      operationId: commit
      summary: Commit the staged changes with a Conventional Commit message.
      description: >-
        Commits what is already staged, with a message assembled from the
        Conventional Commit parts and a Refs trailer for the branch's issue.
        Staging is done elsewhere; this commits the index as it stands. It is
        refused with 409 when nothing is staged or the server is not running in
        a git repository, and 422 when the message is not a valid Conventional
        Commit or the commit (its hooks) fails.
      tags: [repository]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: >-
            The branch, now carrying the new commit. If the branch cannot be
            read back after the commit landed, this is the branch as it stood
            before, with head and commits empty; the event stream brings the
            rest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: >-
            Nothing is staged, or the server is not running in a git repository;
            nothing was committed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The message is invalid, or the commit failed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/pull-request/draft:
    get:
      operationId: getPullRequestDraft
      summary: The pull request that would be opened for the branch, for a preview.
      parameters:
        - name: template
          in: query
          required: false
          schema: {type: string}
          description: The template to start the body from, by name; the repository's first when omitted.
      description: >-
        Composes a pull request for the checked-out branch — a title and body
        from its commits, the issue, and the repository's template, with the base
        it would merge into — without opening it, so the browser can edit it
        before confirming. Given a template, by name, the body starts from it
        rather than the first, as the terminal's ctrl+t chooses one; an
        unknown name is a 404. Answered 409 when there is nothing to open: the tree
        is not on a branch, the branch has no commits, or a pull request is
        already open for it; and when the server is not running in a git
        repository.
      tags: [review]
      responses:
        "200":
          description: The composed pull request, editable before opening.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestDraft"
        "404":
          description: The repository has no template of that name.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: >-
            There is nothing to open a pull request for, or the server is not
            running in a git repository.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/pull-request:
    get:
      operationId: getPullRequestText
      summary: The branch's open pull request's title and description, to edit them.
      description: >-
        The title and description of the checked-out branch's pull request
        as the forge holds them now, read afresh for the editor the
        terminal's e opens. Refused with 409 when the branch has no open
        pull request.
      tags: [review]
      responses:
        "200":
          description: The pull request's title and description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestText"
        "409":
          description: The branch has no open pull request.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      operationId: editPullRequest
      summary: Change the branch's open pull request's title and description.
      description: >-
        Saves a new title and description on the checked-out branch's open
        pull request, as the terminal's editor (e) does; the form that sends
        it is the last look. Refused with 409 when the branch has no open
        pull request, and 422 when the title is empty, editing is not
        available, or the forge refuses the edit — a token without the
        scope, in the forge's own words, which never name its address.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestText"
      responses:
        "200":
          description: The pull request as the forge now holds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        "409":
          description: The branch has no open pull request.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The title is empty, editing is not available, or the forge refused it.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: openPullRequest
      summary: Open a pull request for the current branch, pushing it first if needed.
      description: >-
        Opens a pull request from the checked-out branch with the given title,
        body, base, and draft flag. The branch is always the checked-out one, not
        the caller's to choose; when it is not yet published, it is pushed first,
        as opening a pull request from an unpushed branch cannot work. Refused
        with 409 when there is nothing to open (see GET /api/pull-request/draft)
        or the server is not running in a git repository, and 422 when the push
        fails, the title or base is missing, the forge turns the pull request
        down, with the forge's reason, or the repository's forge cannot be
        told apart, which says to set forge.kind and forge.host. Any other failed open is
        answered as a read's failure is: 502 when the forge cannot be reached,
        asks to wait or redirects, 404 when it will not show the repository,
        and 422 when the forge token is missing or refused, or the forge
        settings are incomplete or reach no forge API. A reviewer either forge
        will not take, or an assignee GitLab does not know, does not stop the
        pull request: it opens with the reviewers and assignees the forge
        took, and the answer carries a warning.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPullRequestRequest"
      responses:
        "200":
          description: The pull request, now open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenedPullRequest"
        "409":
          description: >-
            There is nothing to open a pull request for, or the server is not
            running in a git repository.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            The push failed; the forge turned the pull request down or does not
            know a reviewer or assignee it names; the repository's forge cannot
            be told apart, or its token or settings do not let the server ask
            it; opening is not available; or the request is incomplete.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks:
    get:
      operationId: listTasks
      summary: Your pending Taskwarrior tasks, most urgent first.
      description: >-
        The pending tasks of Taskwarrior's active context, most urgent first,
        waiting ones included — what the terminal's Tasks pane lists — with the
        context's name and whether a sync backend is set. It is a read of
        Taskwarrior, not a snapshot field; the stream carries only a summary.
      tags: [tasks]
      responses:
        "200":
          description: >-
            The list. With no Taskwarrior to ask — turned off by
            taskwarrior.disabled, not installed, a task program that is not
            Taskwarrior (go-task), one too old, one never run, or one whose
            taskrc has a malformed line — available is false with the reason
            and tasks is empty: an answer about where the server runs, not a
            missing resource, so never a 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: addTask
      summary: Add a task from a line in Taskwarrior's own grammar.
      description: >-
        Adds a task the way `task add` does: a description with attributes such
        as project:web or due:friday among its words. Answers the pending list
        after the write. Refused with 422 when the line is empty, Taskwarrior
        is not available, or Taskwarrior refuses the line, with its own words.
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskLine"
      responses:
        "200":
          description: The pending list, now with the task, and added naming it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "422":
          description: >-
            The line is empty, Taskwarrior is not available, or it refused the
            line; nothing was added.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/track:
    post:
      operationId: trackIssue
      summary: Track an issue in Taskwarrior.
      description: >-
        Adds a task for the issue, read from the tracker: its key and page in
        the jiraid and jiraurl attributes, the jira tag, the issue's priority
        as Taskwarrior's, and "KEY: summary" as the description — the line the
        terminal's T prefills — then annotates the task with the issue's page,
        when the tracker gives one. Answers the pending list after the write;
        an annotation that failed leaves the task created, and said says so.
        Refused with 404 when the tracker has no such issue, and 422 when no
        tracker or Taskwarrior is available, the tracker's key is not one
        word, or Taskwarrior refuses the line.
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackIssueRequest"
      responses:
        "200":
          description: The pending list, now with the issue's task, and added naming it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "404":
          description: The tracker has no such issue; nothing was added.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: >-
            No issue key was given, the tracker's key for the issue is not one
            word, no tracker or Taskwarrior is available, or Taskwarrior
            refused the line; nothing was added.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/undo:
    post:
      operationId: undoTasks
      summary: Revert Taskwarrior's last change.
      description: >-
        Reverts Taskwarrior's last change, whatever made it, as `task undo`
        does. Answers the pending list after it, with said saying how many
        operations were reverted. Refused with 409 when Taskwarrior has nothing
        to undo, and 422 when it is not available or refuses.
      tags: [tasks]
      responses:
        "200":
          description: The pending list, as it stands after the undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "409":
          description: Taskwarrior has nothing to undo.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Taskwarrior is not available, or refused the undo.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/sync:
    post:
      operationId: syncTasks
      summary: Sync Taskwarrior with the backend its taskrc names.
      description: >-
        Syncs as `task sync` does. Answers the pending list after it, with said
        carrying what Taskwarrior printed. Refused with 422 when the taskrc
        names no sync backend, Taskwarrior is not available, or the sync
        fails; a failed sync's detail is fixed words, never Taskwarrior's,
        which name the sync server.
      tags: [tasks]
      responses:
        "200":
          description: The pending list, as it stands after the sync.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "422":
          description: >-
            No sync backend is set, Taskwarrior is not available, or the sync
            failed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/{uuid}/start:
    post:
      operationId: startTask
      summary: Start a task.
      description: >-
        Starts the task, whatever context Taskwarrior has active; starting a
        completed or deleted task reopens it, as Taskwarrior does. Answers the
        pending list after the write. Refused with 409 when Taskwarrior changes
        nothing — the task is already started, or no such task exists — and
        422 when it is not available or refuses.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskUUID"
      responses:
        "200":
          description: The pending list, with the task started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "409":
          description: >-
            Taskwarrior changed nothing: the task is already started, or no
            such task exists.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Taskwarrior is not available, or refused the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/{uuid}/stop:
    post:
      operationId: stopTask
      summary: Stop a started task.
      description: >-
        Stops the task, whatever context Taskwarrior has active. Answers the
        pending list after the write. Refused with 409 when Taskwarrior changes
        nothing — the task is not started, or is no longer pending — and 422
        when it is not available or refuses.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskUUID"
      responses:
        "200":
          description: The pending list, with the task stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "409":
          description: >-
            Taskwarrior changed nothing: the task is already in that state, or
            is no longer pending.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Taskwarrior is not available, or refused the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/{uuid}/done:
    post:
      operationId: completeTask
      summary: Complete a task.
      description: >-
        Marks the task done, whatever context Taskwarrior has active. Answers
        the pending list after the write. Refused with 409 when Taskwarrior
        changes nothing — the task is no longer pending — and 422 when it is
        not available or refuses.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskUUID"
      responses:
        "200":
          description: The pending list, without the task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "409":
          description: >-
            Taskwarrior changed nothing: the task is already in that state, or
            is no longer pending.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Taskwarrior is not available, or refused the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/{uuid}/annotations:
    post:
      operationId: annotateTask
      summary: Add a note to a task.
      description: >-
        Annotates the task with the text, whatever context Taskwarrior has
        active; every word stays a word, so nothing in it is read as an
        attribute. Answers the pending list after the write. Refused with 409
        when Taskwarrior changes nothing, and 422 when the text is empty or
        Taskwarrior is not available or refuses.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskText"
      responses:
        "200":
          description: The pending list, with the task annotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "409":
          description: >-
            Taskwarrior changed nothing: the task is already in that state, or
            is no longer pending.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The text is empty, or Taskwarrior is not available or refused the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/tasks/{uuid}/modify:
    post:
      operationId: modifyTask
      summary: Change a task by a line in Taskwarrior's own grammar.
      description: >-
        Changes the task the way `task modify` does — project:web, due:friday,
        +tag, or new words for its description — whatever context Taskwarrior
        has active. Answers the pending list after the write. Refused with 409
        when Taskwarrior changes nothing, and 422 when the line is empty or
        Taskwarrior is not available or refuses the line, with its own words.
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/TaskUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskLine"
      responses:
        "200":
          description: The pending list, with the task changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "409":
          description: >-
            Taskwarrior changed nothing: the task is already in that state, or
            is no longer pending.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The line is empty, or Taskwarrior is not available or refused the change.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/activity:
    get:
      operationId: getActivity
      summary: What you did over a period, grouped by year, month, day and hour.
      description: >-
        Reads back what you did from start to end of the days from and to,
        both included, in the server's own time zone: the commits you wrote in
        the repository the server runs in, the Taskwarrior tasks you added,
        annotated and completed and the ones you started that are still
        going, what you did to Jira issues, and the pull or merge requests you
        opened, had merged and reviewed on the forge, in any repository.
        Nothing is kept: every request reads the sources again. With neither
        day given it is the previous working day; with one, that day alone.
        Each source answers on its own, so one that cannot be read is named in
        sources with why, and the rest still answer. The period is refused with 422 when it runs backwards or is
        longer than a year and a day, or a day is not written as YYYY-MM-DD.
      tags: [summary]
      parameters:
        - name: from
          in: query
          required: false
          description: The first day, written as YYYY-MM-DD.
          schema: {type: string}
        - name: to
          in: query
          required: false
          description: The last day, written as YYYY-MM-DD.
          schema: {type: string}
      responses:
        "200":
          description: >-
            The period, what each source said, the items nested oldest first,
            and the same as Markdown to copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "422":
          description: The period could not be read as asked.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/activity/post:
    post:
      operationId: postActivity
      summary: Post the Summary to the configured messaging service.
      description: >-
        Posts text — the Summary's Markdown for the days from and to, as GET
        /api/activity wrote it, or as a preview edited it — to the configured
        service: to the given channel, or the configured one when none is
        given, or the webhook's own channel. The Markdown is rendered for the
        service as it is posted: on Slack, which shows no heading, a heading
        is a bold line and an item a bullet; on Teams a heading is bold; on
        Discord the first three levels stay headings; and a plain webhook
        gets a heading's words alone. Nothing about the post is kept, as an
        announcement is. The period is refused with 422 as GET /api/activity
        refuses it, and so is blank text or text too long for the service; a
        service that refuses the post or is not set up is a 422, and one that
        cannot be reached, or asks to wait, a 502. No answer carries the service's own error, which can name
        the webhook. Under --dry-run it is refused with a plain-text 403, as
        every write is.
      tags: [summary]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityPostRequest"
      responses:
        "200":
          description: The Summary as posted, and where it went.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPost"
        "422":
          description: >-
            The period could not be read, the text was blank, the text rendered
            for the service is longer than it takes (code too_long, naming the
            length against the limit; nothing was sent), or the post could not
            be made.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/events:
    get:
      operationId: streamEvents
      summary: A stream of state snapshots, pushed on connect and then every few seconds.
      description: >-
        A Server-Sent Events stream (text/event-stream). Each message is a
        "snapshot" event whose data is a Snapshot: the current issues, branch,
        changes, review, messaging destination, the issues in flight, the
        scope a new commit opens on, and a summary of your Taskwarrior tasks.
        The first is pushed on connect and another every few seconds after,
        whether or not anything changed: the upstreams send no notice of a
        change, so the server reads them again on that cadence. The browser
        subscribes once and updates from the pushes rather than polling. The
        review is the forge's answer, read at most once every
        timing.ci_interval (twenty seconds unless set) for every stream
        together, and again at once for another branch or head commit, or after
        a pull request is opened here. A read that fails keeps the last answer
        for the same branch and head commit, and with no answer to keep reports
        none found until a read succeeds. Which branches are for your issues is
        the tracker's answer too, asked again once a minute or when the
        branches name other issues; an ask that fails keeps the last answer,
        and with none lists every branch that names an issue. A search for
        Taskwarrior that finds none is not made again for a minute. An
        announcement held until CI passes (POST /api/announce with when
        ci_passes) is settled on each frame from the review it carries —
        posted once the CI has passed, dropped once it has failed — and the
        frame's queued_announcement says how it stands.
      tags: [events]
      parameters:
        - name: view
          in: query
          description: The configured view's name whose issues to include; the default view when omitted.
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The event stream; each message's data is a Snapshot.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          description: >-
            No configured view carries that name. Refused before the stream
            opens, so the answer is a problem rather than an event stream.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/repositories:
    get:
      operationId: getRepositories
      summary: Where the server works, and your favorite directories.
      description: >-
        The directory the server works in, the repository it is in and the
        path within it, origin's host and path, and the configuration files
        that apply there; then your favorite directories, each with what is
        there now. Each directory is also written from your home, as
        ~/src/api. Favorites are read from the store's kept file and looked at
        on disk each time.
      tags: [repositories]
      responses:
        "200":
          description: Where the server works and your favorites.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repositories"}
        default: {$ref: "#/components/responses/Problem"}

  /api/repositories/here:
    put:
      operationId: switchRepository
      summary: Switch the directory the server works in.
      description: >-
        Wires the directory named as the server's first was wired — its
        repository, forge, the configuration files that apply there and the
        store's keys — and serves from it from then on; open event streams
        end, asking the page to reconnect, and every read after answers for
        the new directory. Refused with 404 when the directory is not there,
        422 when it is not a directory or its configuration's ui.keys would
        be refused, and 409 while a write is in flight, which the switch
        would leave unknown. A write that carries a Workflow-Here header
        naming another directory than the server's is refused with 409, so a
        page still showing the old directory cannot write to the new one.
        Refused with 403 under --dry-run, by the guard every write passes.
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectoryChoice"}
      responses:
        "200":
          description: The directory now worked in, and your favorites.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repositories"}
        "404":
          description: The directory is not there.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: A write is in flight.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The directory cannot be switched to.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/repositories/favorites:
    put:
      operationId: addFavorite
      summary: Keep a directory as a favorite.
      description: >-
        Marks the directory named a favorite in the store's kept file, keeping
        when it was first marked. Refused with 422 when the store keeps
        nothing or the path is not absolute, and with 403 under --dry-run.
      tags: [repositories]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectoryChoice"}
      responses:
        "200":
          description: Where the server works, and your favorites now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repositories"}
        "422":
          description: The favorite cannot be kept.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeFavorite
      summary: Forget a directory as a favorite.
      description: >-
        Forgets the directory named as a favorite; one that was not is left as
        it is. Refused with 422 when the store keeps nothing, and with 403
        under --dry-run.
      tags: [repositories]
      parameters:
        - name: dir
          in: query
          required: true
          description: The directory, as an absolute path.
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: Where the server works, and your favorites now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Repositories"}
        "422":
          description: The favorite cannot be forgotten.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

  /api/directories:
    get:
      operationId: getDirectories
      summary: The directories in one, to browse for a directory to switch to.
      description: >-
        Lists the directories in the one path names — from where the server
        works, or from your home after a ~ — or in where the server works
        when path is not given. A directory linked to is listed with them; a
        hidden one is not, and is reached by naming it. Each says whether it
        is a repository's root. At most a thousand are listed. Refused with
        404 when the directory is not there and 422 when it cannot be listed;
        neither detail repeats the path. Reading works under --dry-run.
      tags: [repositories]
      parameters:
        - name: path
          in: query
          required: false
          description: The directory to list.
          schema: {type: string}
      responses:
        "200":
          description: The directory and the directories in it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectoryListing"}
        "404":
          description: The directory is not there.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: The path names something that cannot be listed.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}

components:
  parameters:
    TaskUUID:
      name: uuid
      in: path
      required: true
      description: The task's uuid, as the task list gives it.
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: 5f3c9a1e-8b2d-4c6f-9e7a-1d2b3c4d5e6f

  responses:
    Problem:
      description: An RFC 9457 problem details object describing the failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  headers:
    ConfigRevision:
      description: >-
        What the configuration in effect stands for, quoted: an opaque token
        naming the revision of the file it was read from or written as, and
        whether a read has since found that file gone. It changes whenever the
        file's bytes do, and the server honors it until it restarts.
      required: true
      schema: {type: string}

  schemas:
    Place:
      type: object
      description: >-
        A directory the server works in, as it is now. Each path is also
        written from your home, as ~/src/api, for showing.
      required: [dir, shown, root, root_shown, within, origin, config]
      properties:
        dir: {type: string, description: "The directory, as an absolute path."}
        shown: {type: string, description: "The directory written from your home."}
        root:
          type: string
          description: The repository's root, or empty outside a repository.
        root_shown: {type: string, description: "The root written from your home, or empty."}
        within:
          type: string
          description: The path from the root to the directory, or empty at the root or outside a repository.
        origin:
          type: string
          description: Origin's host and path, as github.com/acme/api, or empty when there is none.
        config:
          type: array
          description: >-
            The configuration files that apply, each written from your home,
            the repository's first; empty when the defaults apply.
          items: {type: string}
      additionalProperties: false

    Favorite:
      type: object
      description: A directory you keep as a favorite, and what is there now.
      required: [dir, shown, state, origin]
      properties:
        dir: {type: string, description: "The directory, as an absolute path."}
        shown: {type: string, description: "The directory written from your home."}
        state:
          type: string
          description: >-
            here is where the server works; repository is a repository's
            directory; directory is one in no repository; missing is not there.
          enum: [here, repository, directory, missing]
          x-enum-varnames: [FavoriteHere, FavoriteRepository, FavoriteDirectory, FavoriteMissing]
        origin:
          type: string
          description: Origin's host and path, or empty.
      additionalProperties: false

    Worktree:
      type: object
      description: One working tree of the repository the server works in.
      required: [dir, shown, branch, head, state, locked]
      properties:
        dir: {type: string, description: "The worktree's directory, as an absolute path."}
        shown: {type: string, description: "The directory written from your home."}
        branch:
          type: string
          description: The branch it has checked out, or empty when its HEAD is detached.
        head:
          type: string
          description: The commit it has checked out, abbreviated.
        state:
          type: string
          description: >-
            here is the worktree the server works in; worktree is another;
            missing is one git still lists whose directory is gone.
          enum: [here, worktree, missing]
          x-enum-varnames: [WorktreeHere, WorktreeOther, WorktreeMissing]
        locked:
          type: boolean
          description: Whether git keeps it from being removed or pruned.
      additionalProperties: false

    Repositories:
      type: object
      description: Where the server works, the repository's worktrees, and your favorite directories.
      required: [here, worktrees, worktrees_error, favorites, favorites_kept]
      properties:
        here: {$ref: "#/components/schemas/Place"}
        worktrees:
          type: array
          description: >-
            The working trees of the repository the server works in, the main
            one first, as git lists them; empty outside a repository.
          items: {$ref: "#/components/schemas/Worktree"}
        worktrees_error:
          type: string
          description: >-
            Why the worktrees could not be read, in words that never name a
            path or a host; empty when they were.
        favorites:
          type: array
          description: Your favorites, by path.
          items: {$ref: "#/components/schemas/Favorite"}
        favorites_kept:
          type: boolean
          description: >-
            Whether a favorite can be marked or forgotten here: false when the
            store keeps nothing, or under --dry-run.
      additionalProperties: false

    DirectoryChoice:
      type: object
      description: A directory, as an absolute path.
      required: [dir]
      properties:
        dir: {type: string, minLength: 1}
      additionalProperties: false

    DirectoryEntry:
      type: object
      description: A directory in another.
      required: [name, path, repository]
      properties:
        name: {type: string}
        path: {type: string, description: "The directory, as an absolute path."}
        repository: {type: boolean, description: "Whether it is a repository's root."}
      additionalProperties: false

    DirectoryListing:
      type: object
      description: A directory and the directories in it, by name.
      required: [path, shown, parent, entries, truncated]
      properties:
        path: {type: string, description: "The directory listed, as an absolute path."}
        shown: {type: string, description: "The directory written from your home."}
        parent:
          type: string
          description: The directory above it, or empty at the root.
        entries:
          type: array
          items: {$ref: "#/components/schemas/DirectoryEntry"}
        truncated:
          type: boolean
          description: Whether there were more than a thousand.
      additionalProperties: false

    Problem:
      type: object
      description: >-
        An RFC 9457 problem details object. The detail is safe to show and never
        carries a secret; code is a stable, machine-readable reason.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: A URI that identifies the problem type.
          example: https://jacob-delgado.github.io/workflow/docs/errors/#not-found
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        code:
          type: string
          description: >-
            A stable, machine-readable reason. not_set_up is a service with
            nothing set up to ask — no credential, no forge the origin names,
            no Taskwarrior installed, no git user.email — whose detail says how
            to set it up; unprocessable is a request or a setting that cannot
            be used as it is.
          enum: [bad_request, not_found, method_not_allowed, conflict, unprocessable, not_set_up, too_long, precondition_required, unreachable, fetch_failed, check_failed, internal]
      additionalProperties: false

    BranchIssueRequest:
      type: object
      required: [key, update_pull]
      properties:
        key:
          type: string
          description: A Jira key, or a forge issue number with or without its #.
          example: PROJ-412
        update_pull:
          type: boolean
          description: Add the line naming the issue to the open pull request's description.
      additionalProperties: false

    BranchIssuePreview:
      type: object
      required: [key, pull, body, changes]
      properties:
        key:
          type: string
          description: The issue's key, a forge number without its #.
        pull:
          type: integer
          description: The open pull request's number, or 0 when the branch has none.
        body:
          type: string
          description: Its description as linking would leave it.
        changes:
          type: boolean
          description: Whether linking would change the description at all.
      additionalProperties: false

    LocalData:
      type: object
      description: The store's directory and the database files in it.
      required: [dir, files]
      properties:
        dir:
          type: string
          description: The directory the store keeps its files in.
        files:
          type: array
          description: Each database file there, the cache first; a file not there is left out.
          items: {$ref: "#/components/schemas/LocalDataFile"}
        dry_run:
          type: boolean
          description: Whether the server runs with --dry-run, which refuses a removal.
      additionalProperties: false

    LocalDataFile:
      type: object
      description: One database file, with its companions counted in its size.
      required: [name, kind, bytes, holds]
      properties:
        name:
          type: string
          description: The file's name in the directory, as workflow.db or kept.db.
        kind:
          type: string
          enum: [cache, kept]
          description: >-
            cache holds conveniences a session makes again; kept holds what the
            user decided, which removing all makes workflow ask again.
        bytes:
          type: integer
          format: int64
          minimum: 0
          description: Its size with its -wal and -shm companions.
        holds:
          type: array
          description: >-
            How many of each thing it holds; empty when the file could not be
            read as a database.
          items: {$ref: "#/components/schemas/LocalDataHeld"}
      additionalProperties: false

    LocalDataHeld:
      type: object
      required: [what, count]
      properties:
        what:
          type: string
          description: What is counted, as scopes or repository groups.
        count:
          type: integer
          minimum: 0
      additionalProperties: false

    SlackTarget:
      type: object
      description: A Slack user or user group, by its ID and the name Slack shows for it.
      required: [id, label]
      properties:
        id:
          type: string
          pattern: "^[UWS][A-Z0-9]{2,}$"
          description: A user ID (U or W…) or a user group ID (S…).
          example: U024BE7LH
        label:
          type: string
          description: The name to show for it.
      additionalProperties: false

    OwnerName:
      type: string
      description: A forge owner as CODEOWNERS names it, without its @ — a user, or org/team.
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9._-]+)*$"
      maxLength: 200
      example: acme/control-plane

    OwnerTag:
      type: object
      description: >-
        A code owner and what is known of them on Slack: linked (to a user,
        or a team to a user group), decided not on Slack, or not asked yet.
      required: [owner, kind, state]
      properties:
        owner: {$ref: "#/components/schemas/OwnerName"}
        kind:
          type: string
          enum: [user, team]
        state:
          type: string
          enum: [linked, not_on_slack, unlinked]
        slack:
          $ref: "#/components/schemas/SlackTarget"
      additionalProperties: false

    GroupTag:
      type: object
      description: A user group an announcement offers to tag.
      required: [slack, checked, from_owners]
      properties:
        slack: {$ref: "#/components/schemas/SlackTarget"}
        checked:
          type: boolean
          description: Whether it starts checked — a team owning the changed paths links it, or it was chosen last time.
        from_owners:
          type: boolean
          description: Whether it is offered because a team owning the changed paths is linked to it.
      additionalProperties: false

    AnnouncementTagging:
      type: object
      description: >-
        Whom a ready-for-review announcement proposes to tag on Slack: the
        code owners of the branch's changes, and the user groups it offers.
      required: [available, owners, groups]
      properties:
        available:
          type: boolean
          description: >-
            Whether this announcement can tag anyone: only a ready-for-review
            announcement does, and only with the store on. When false, owners
            and groups are empty.
        missing_scope:
          type: string
          description: >-
            A scope the Slack token lacks to offer the people or groups an
            owner not yet linked could be linked to, such as users:read. The
            announcement still posts, tagging whom it can.
          example: usergroups:read
        unavailable_reason:
          type: string
          description: >-
            Why this announcement tags no one though it would: the Slack
            workspace the token is for could not be read, and links are kept
            per workspace. The announcement posts untagged; available is false
            and owners and groups are empty.
          example: >-
            can't tell which Slack workspace this token is for: the credential
            was not accepted
        owners:
          type: array
          items: {$ref: "#/components/schemas/OwnerTag"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupTag"}
      additionalProperties: false

    AnnounceMentions:
      type: object
      description: >-
        Whom to tag with the post. The linked user owners are tagged from what
        is kept, not from the request; users are the ones the preview showed
        tagged, so a post whose kept links changed since is refused rather
        than tagging someone else. groups name the user groups checked, each
        one the announcement offered.
      required: [users, groups]
      properties:
        users:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: "^[UW][A-Z0-9]+$"
        groups:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: "^S[A-Z0-9]+$"
      additionalProperties: false

    SlackDirectory:
      type: object
      description: People or user groups read from Slack, or the scope the token lacks to read them.
      required: [entries]
      properties:
        entries:
          type: array
          items: {$ref: "#/components/schemas/SlackTarget"}
        missing_scope:
          type: string
          description: The scope to add to the Slack token for this read; entries are empty then.
          example: users:read
      additionalProperties: false

    People:
      type: object
      description: Every code owner decided on this forge host, then the branch's undecided owners.
      required: [owners]
      properties:
        owners:
          type: array
          items: {$ref: "#/components/schemas/OwnerTag"}
      additionalProperties: false

    PersonLink:
      type: object
      description: >-
        Whom a code owner is on Slack: slack_id, or not_on_slack true — one or
        the other.
      required: [owner, not_on_slack]
      properties:
        owner: {$ref: "#/components/schemas/OwnerName"}
        slack_id:
          type: string
          pattern: "^[UWS][A-Z0-9]{2,}$"
          description: A user ID for a user owner, a user group ID for a team.
        not_on_slack:
          type: boolean
          description: Mark the owner not on Slack, so they are not asked again.
        channel:
          type: string
          maxLength: 200
          description: >-
            The channel whose members a user was picked from, so the label is
            read from there; the configured channel when left out.
      additionalProperties: false

    RepoGroups:
      type: object
      description: The Slack user groups a repository's announcements may tag.
      required: [repository, groups]
      properties:
        repository:
          type: string
          description: The repository's name, as its forge path or its directory.
          example: acme/widgets
        groups:
          type: array
          items: {$ref: "#/components/schemas/SlackTarget"}
      additionalProperties: false

    RepoGroupsRequest:
      type: object
      description: The user groups, by ID, this repository may tag from now on.
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 50
          items:
            type: string
            pattern: "^S[A-Z0-9]{2,}$"
      additionalProperties: false

    CheckoutRequest:
      type: object
      description: The branch to check out.
      required: [branch]
      properties:
        branch:
          type: string
          description: The local branch to switch the working tree to.
          example: fix/PROJ-412-redact-tokens
      additionalProperties: false

    HookSetup:
      type: object
      description: The lefthook configuration offered for hooks lefthook does not manage.
      required: [offered, hooks, config, scripts]
      properties:
        offered:
          type: boolean
          description: Whether there is anything to set up.
        hooks:
          type: array
          description: The hooks found that lefthook does not manage.
          items: {$ref: "#/components/schemas/UnmanagedHook"}
        config:
          type: string
          description: The lefthook.yml that would run them; empty when nothing is offered.
        scripts:
          type: integer
          description: How many hooks it keeps whole as scripts under .lefthook.
      additionalProperties: false

    UnmanagedHook:
      type: object
      required: [name, lines]
      properties:
        name:
          type: string
          example: pre-commit
        lines:
          type: integer
          description: How many lines its script holds.
      additionalProperties: false

    HookSetupRequest:
      type: object
      properties:
        verbatim:
          type: boolean
          default: false
          description: >-
            Keep every hook whole as a script rather than turning plain
            commands into lefthook jobs.
      additionalProperties: false

    HookSetupWritten:
      type: object
      required: [scripts]
      properties:
        scripts:
          type: integer
          description: How many scripts were written under .lefthook beside lefthook.yml.
      additionalProperties: false

    RunRequest:
      type: object
      description: Which run to start, and for a fixup the commit it fixes up.
      required: [kind]
      properties:
        kind: {$ref: "#/components/schemas/RunKind"}
        commit:
          type: string
          description: >-
            For fixup, the hash of the commit to record a fixup! of, as the
            branch lists it; it must be one not yet pushed. Ignored otherwise.
      additionalProperties: false

    RunKind:
      type: string
      description: >-
        A git run: the pre-commit hook on what is staged, a rebase onto the
        base, an amend of the last commit, or a fixup! of an earlier one.
      enum: [pre_commit, rebase, amend, fixup]

    Run:
      type: object
      description: >-
        A git run and how it stands: running, or how it ended, with what it
        wrote.
      required: [kind, title, state, lines, outcome]
      properties:
        kind: {$ref: "#/components/schemas/RunKind"}
        title:
          type: string
          description: What is running, as the terminal titles it, such as git rebase.
        state:
          type: string
          enum: [in_progress, succeeded, refused, stopped]
          description: >-
            How the run stands: in progress, succeeded, refused — the program
            ended with a failure, a hook that failed or a rebase stopped at a
            conflict — or stopped by DELETE /api/runs/current.
        lines:
          type: array
          description: >-
            What the program wrote, standard output and standard error in the
            order written, with terminal controls taken out. A run the event
            stream carries holds its last 200 lines.
          items: {type: string}
        outcome:
          type: string
          description: >-
            What the run did, once it has ended — Rebased onto main, the
            pre-commit hook failed — and empty while it runs.
      additionalProperties: false

    RunEvent:
      type: object
      description: >-
        One line of a run's stream: the run itself, as it starts and as it
        ends, or one line of its output.
      properties:
        run: {$ref: "#/components/schemas/Run"}
        line:
          type: string
          description: A line the program wrote, with terminal controls taken out.
      additionalProperties: false

    FileDiff:
      type: object
      description: A changed file's diff against HEAD.
      required: [path, lines]
      properties:
        path:
          type: string
          description: The file, as the working tree's changes list it.
        lines:
          type: array
          description: >-
            The diff, line by line, as git writes it — headers, hunks, and
            each line marked +, - or space — with terminal controls taken
            out; empty when git reports no difference.
          items: {type: string}
      additionalProperties: false

    CreateWorktreeRequest:
      type: object
      description: The issue to start work on in a new worktree.
      required: [issue_key]
      properties:
        issue_key:
          type: string
          description: The issue to name and create a branch for.
          example: PROJ-412
        fetch:
          type: boolean
          default: true
          description: >-
            Whether to fetch origin first, so the branch starts from what
            origin holds now, as the terminal's branch creator and workflow
            branch --fetch do. A fetch that fails creates nothing and is a
            502 with code fetch_failed; asking again with fetch false
            branches from what you have, the terminal's way out. With no
            base to refresh nothing is fetched either way.
      additionalProperties: false

    CreatedWorktree:
      type: object
      description: A worktree just created for an issue's branch.
      required: [dir, shown, branch]
      properties:
        dir: {type: string, description: "The worktree's directory, as an absolute path."}
        shown: {type: string, description: "The directory written from your home."}
        branch: {type: string, description: "The branch created and checked out there."}
      additionalProperties: false

    CreateBranchRequest:
      type: object
      description: The issue to start work on by creating its branch.
      required: [issue_key]
      properties:
        issue_key:
          type: string
          description: The issue to name and create a branch for.
          example: PROJ-412
        fetch:
          type: boolean
          default: true
          description: >-
            Whether to fetch origin first, so the branch starts from what
            origin holds now, as the terminal's branch creator and workflow
            branch --fetch do. A fetch that fails creates nothing and is a
            502 with code fetch_failed; asking again with fetch false
            branches from what you have, the terminal's way out. With no
            base to refresh nothing is fetched either way.
      additionalProperties: false

    TaskLine:
      type: object
      description: >-
        A line in Taskwarrior's own grammar: words, with attributes such as
        project:web, due:friday or +tag among them.
      required: [line]
      properties:
        line:
          type: string
          description: The line, as it would follow `task add` or `task <id> modify`.
          example: Write the release notes project:workflow due:friday
      additionalProperties: false

    TaskText:
      type: object
      description: The text of a note on a task.
      required: [text]
      properties:
        text:
          type: string
          description: The note; every word stays a word, never an attribute.
          example: Waiting on the forge's rate limit to reset
      additionalProperties: false

    TrackIssueRequest:
      type: object
      description: The issue to track in Taskwarrior.
      required: [issue_key]
      properties:
        issue_key:
          type: string
          description: The issue the task is for.
          example: PROJ-412
      additionalProperties: false

    Announcement:
      type: object
      description: A composed announcement and where it would post.
      required: [text, channel]
      properties:
        text:
          type: string
          description: The message that would be posted.
        channel:
          type: string
          description: The channel it posts to, or empty for a webhook's own channel.
        tagging:
          $ref: "#/components/schemas/AnnouncementTagging"
        can_wait_for_ci:
          type: boolean
          description: >-
            Whether a preview's announcement can be held until the pull
            request's CI passes: it is ready for review and its CI is still
            running. Left out where it cannot, and on a post.
      additionalProperties: false

    AnnounceRequest:
      type: object
      description: >-
        Where to post the announcement, the text its preview showed, the text
        to post in its place when it was edited, and when to post it.
      required: [channel]
      properties:
        channel:
          type: string
          description: The channel to post to; empty uses the configured channel or the webhook.
        text:
          type: string
          description: >-
            The announcement as GET /api/announcement showed it. When given,
            the post is refused with 409 unless the announcement composed now
            reads the same; when left out, the announcement composed now is
            posted.
        edited_text:
          type: string
          maxLength: 40000
          description: >-
            The text to post in place of the composed announcement, as edited
            in the preview. It needs text, the composed announcement the edit
            began from, which is still checked against the one composed now.
        when:
          type: string
          enum: [now, ci_passes]
          x-enum-varnames: [AnnounceNow, AnnounceWhenCIPasses]
          description: >-
            now, the default, posts at once; ci_passes holds a ready-for-review
            announcement until the pull request's CI passes.
        mentions:
          $ref: "#/components/schemas/AnnounceMentions"
      additionalProperties: false

    QueuedAnnouncement:
      type: object
      description: >-
        An announcement held until a pull request's CI passes, and how it
        stands: waiting for the CI, being posted, posted, or dropped unposted
        with the reason.
      required: [state, channel, pull]
      properties:
        state:
          type: string
          enum: [waiting, announcing, announced, dropped]
          x-enum-varnames: [QueuedWaiting, QueuedAnnouncing, QueuedAnnounced, QueuedDropped]
        channel:
          type: string
          description: The channel it posts to, or empty for a webhook's own channel.
        pull:
          type: integer
          description: The number of the pull request whose CI it waits on.
        reason:
          type: string
          description: >-
            Why a dropped announcement was not posted: the CI failed, the
            branch's pull request is another one, or the post failed.
      additionalProperties: false

    StagingRequest:
      type: object
      description: >-
        What to stage or unstage: one changed file, or all of them — one or
        the other, never both.
      properties:
        path:
          type: string
          description: >-
            A changed file, by the path the working tree's changes list it
            under (a rename's new path).
          example: internal/config/config.go
        all:
          type: boolean
          description: >-
            Every change: for staging, each one the index does not hold yet;
            for unstaging, each staged one.
      additionalProperties: false

    DiscardRequest:
      type: object
      description: The one changed file whose changes to discard.
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: >-
            A changed file, by the path the working tree's changes list it
            under (a rename's new path).
          example: internal/config/config.go
      additionalProperties: false

    CommitRequest:
      type: object
      description: The parts of a Conventional Commit message for the staged changes.
      required: [type, subject]
      properties:
        type:
          type: string
          description: The Conventional Commit type, such as feat or fix.
          example: fix
        scope:
          type: string
          description: The optional scope, written in parentheses after the type.
        subject:
          type: string
          description: The description written after the colon.
          example: redact tokens before they reach the request log
        body:
          type: string
          description: The optional message body, after a blank line.
        breaking:
          type: boolean
          description: Whether this is a breaking change, marked with "!".
      additionalProperties: false

    PullRequestText:
      type: object
      description: A pull request's title and description.
      required: [title, body]
      properties:
        title: {type: string}
        body: {type: string}
      additionalProperties: false

    MergeMethod:
      type: string
      description: How a pull request is merged — a merge commit, squashed, or rebased.
      enum: [merge, squash, rebase]

    MergeOffer:
      type: object
      description: The pull request a merge would merge, and the methods its repository permits.
      required: [pull, methods]
      properties:
        pull: {$ref: "#/components/schemas/PullRequest"}
        methods:
          type: array
          items: {$ref: "#/components/schemas/MergeMethod"}
      additionalProperties: false

    MergeRequest:
      type: object
      required: [method]
      properties:
        method: {$ref: "#/components/schemas/MergeMethod"}
      additionalProperties: false

    Rerun:
      type: object
      required: [reran]
      properties:
        reran:
          type: boolean
          description: Whether the forge re-ran anything; false when the failure had no job to restart.
      additionalProperties: false

    PullRequestDraft:
      type: object
      description: A pull request composed for the branch, editable before opening.
      required: [title, body, base, head, draft, needs_push, reviewers, templates, template]
      properties:
        title:
          type: string
          description: The proposed title, from the first commit or the issue.
        body:
          type: string
          description: The proposed body, from the template, commits, and issue.
        base:
          type: string
          description: The branch it would merge into.
        head:
          type: string
          description: The branch with the work; the open always uses the checked-out one.
        draft:
          type: boolean
          description: Whether it would open as a draft; always false in a fresh draft.
        needs_push:
          type: boolean
          description: Whether the branch must be pushed first; the open pushes it.
        reviewers:
          type: array
          items:
            type: string
          description: >-
            The proposed reviewers: the code owners of the paths the branch
            changes, as CODEOWNERS on the base names them, without the author.
            People come first, then teams as org/team (a GitLab group as
            group/subgroup). Empty when no CODEOWNERS covers the changes or it
            cannot be read.
          example: [ana, acme/control-plane]
        templates:
          type: array
          description: >-
            The repository's pull request templates by name, in the order the
            terminal's ctrl+t cycles them; empty when it has none.
          items: {type: string}
        template:
          type: string
          description: The template the body starts from, by name; empty when there is none.
      additionalProperties: false

    OpenPullRequestRequest:
      type: object
      description: The pull request to open for the checked-out branch.
      required: [title, base]
      properties:
        title:
          type: string
          description: The pull request title.
          example: "fix: redact tokens before they reach the request log"
        body:
          type: string
          description: The pull request body; may be empty.
        base:
          type: string
          description: The branch to merge into.
          example: main
        draft:
          type: boolean
          description: Whether to open it as a draft.
        reviewers:
          type: array
          items:
            type: string
          description: >-
            Usernames to request a review from. A name holding a slash is a
            team, org/team, requested as a team on GitHub; on GitLab a
            group/subgroup stands for its direct members.
        assignees:
          type: array
          items:
            type: string
          description: Usernames to assign the pull request to.
        labels:
          type: array
          items:
            type: string
          description: Label names to add to the pull request.
      additionalProperties: false

    Health:
      type: object
      required: [version, dry_run, forge_noun, forge_sigil]
      properties:
        version:
          type: string
          description: The binary's version, or a short commit for a dev build.
        dry_run:
          type: boolean
          description: Whether writes are held back (the --dry-run flag).
        forge_noun:
          type: string
          description: >-
            What the repository's forge calls a proposed change, lowercase — a
            "merge request" on GitLab and a "pull request" everywhere else — so
            the browser says what the terminal and the command line say.
          example: merge request
        forge_sigil:
          type: string
          description: >-
            The mark the forge writes before a proposed change's number: "!" on
            GitLab, "#" everywhere else.
          example: "!"
      additionalProperties: false

    ViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items: {$ref: "#/components/schemas/JiraView"}
      additionalProperties: false

    Snapshot:
      type: object
      description: >-
        The full read state carried by one event-stream message: everything the
        cockpit shows, together.
      required: [issues, branch, changes, review, messaging, branches, commit_types, subject_limit, suggested_scope, tasks, here, hooks_unmanaged]
      properties:
        here:
          type: string
          description: >-
            The directory the server works in, as an absolute path, so a page
            notices a switch made elsewhere and reads again.
        issues: {$ref: "#/components/schemas/IssuesPage"}
        branch: {$ref: "#/components/schemas/Branch"}
        changes: {$ref: "#/components/schemas/ChangeList"}
        review: {$ref: "#/components/schemas/Review"}
        messaging: {$ref: "#/components/schemas/MessagingDestination"}
        queued_announcement:
          $ref: "#/components/schemas/QueuedAnnouncement"
        hooks_unmanaged:
          type: integer
          description: >-
            How many git hooks the repository's hooks directory holds that
            lefthook does not manage, while the repository configures no
            lefthook — which GET /api/hooks/setup offers to set up; 0
            otherwise.
        run:
          description: >-
            The git run going now (POST /api/runs), with its last 200 lines,
            so a page opened while it runs sees it; absent when none is
            going.
          allOf: [{$ref: "#/components/schemas/Run"}]
        branches:
          type: array
          description: >-
            The branches named for one of your issues, local ones and those
            only the remote has — the record of what is in flight. The detail
            panels (branch, changes, review) describe the checked-out branch
            alone; this lists every issue of yours that has a branch, so the
            issues list can mark them all in flight, not the one on HEAD. An
            issue is yours when the tracker says it is assigned to you and not
            done; with no tracker to ask, every branch that names an issue is
            listed.
          items: {$ref: "#/components/schemas/TaskBranch"}
        commit_types:
          type: array
          description: >-
            The commit types a new commit may take, in the order to offer
            them — the terminal composer's list: commit.types, trimmed, when
            the configuration names any, else the built-in Conventional
            Commit types. A commit whose type is not among them is refused.
          items: {type: string}
          example: [feat, fix, docs]
        subject_limit:
          type: integer
          minimum: 1
          description: >-
            The longest a new commit's header may be, in characters, counted
            as the terminal composer counts it — the type, scope, breaking
            mark and subject together: commit.subject_limit when the
            configuration sets one, else the built-in 72. A commit whose
            header is longer is refused.
          example: 72
        suggested_scope:
          type: string
          description: >-
            The scope a new commit opens on — the terminal composer's rule: the
            scope last committed with in this repository, else
            commit.default_scope, else empty. The server reads the learned one
            from its store once, and once more after a commit here records
            one, not on every message, and never under --dry-run, when the
            default alone applies.
          example: api
        tasks: {$ref: "#/components/schemas/TasksSummary"}
        problems:
          $ref: "#/components/schemas/PanelProblems"
      additionalProperties: false

    PanelProblems:
      type: object
      description: >-
        Why each panel whose read failed was not read, so a failed read is
        shown as a failure rather than as the panel's empty state; absent
        when every panel read. A failed panel still carries its empty answer
        — or, for the review, the answer the forge last gave for the branch
        at its head — beside its problem. A service that is not set up — no
        credential, no forge the origin names — carries a problem whose code
        is not_set_up, with how to set it up, to be shown as guidance rather
        than as a failure; no repository is no problem. Each detail is the curated one an error answer carries, never a host,
        a path or a credential.
      properties:
        issues:
          description: Why the view's first page could not be read.
          allOf: [{$ref: "#/components/schemas/Problem"}]
        branch:
          description: Why the checked-out branch could not be read.
          allOf: [{$ref: "#/components/schemas/Problem"}]
        changes:
          description: Why the working tree's changes could not be read.
          allOf: [{$ref: "#/components/schemas/Problem"}]
        review:
          description: >-
            Why the branch's pull request could not be read: the forge's
            refusal, or the branch's when the branch could not be read.
          allOf: [{$ref: "#/components/schemas/Problem"}]
      additionalProperties: false

    TaskBranch:
      type: object
      description: >-
        A branch named for an issue, by the branch-name convention: a local
        one, or one only the remote has, which checking out creates here.
      required: [name, issue_key, current]
      properties:
        name:
          type: string
          description: The local branch name.
          example: fix/PROJ-412-redact-tokens
        issue_key:
          type: string
          description: >-
            The issue the branch is named for — a Jira key or a forge issue
            number, per the branch-name convention.
          example: PROJ-412
        current:
          type: boolean
          description: Whether this is the checked-out branch.
        remote:
          type: boolean
          default: false
          description: Whether only the remote has the branch.
        worktree:
          type: string
          default: ""
          description: >-
            The directory of another worktree of the repository that has the
            branch checked out, as an absolute path; empty when none does.
            git will not check such a branch out here, so it is switched to
            there instead.
        worktree_shown:
          type: string
          default: ""
          description: That worktree's directory written from your home; empty when none.
        worktree_missing:
          type: boolean
          default: false
          description: >-
            Whether that worktree's directory is gone: git holds the branch
            for it until it is pruned, so it can be neither checked out nor
            switched to.
      additionalProperties: false

    IssuesPage:
      type: object
      required: [issues, total, start_at, unavailable]
      properties:
        issues:
          type: array
          items: {$ref: "#/components/schemas/Issue"}
        unavailable:
          type: array
          items: {type: string}
          description: >-
            Each tracker a list drawing on Jira and the forge together could not
            read, so what is listed is not taken for all there is. Empty when
            every tracker answered.
        total:
          type: integer
          description: How many issues the view matches in all.
        start_at:
          type: integer
          description: The index of the first issue in this page.
      additionalProperties: false

    Issue:
      type: object
      required: [key, summary, status, status_category, type, tracker]
      properties:
        key: {type: string, example: PROJ-412}
        tracker: {$ref: "#/components/schemas/IssueTracker"}
        summary: {type: string}
        status:
          type: string
          description: The human status name, such as "In Progress".
        status_category:
          $ref: "#/components/schemas/StatusCategory"
        type:
          type: string
          description: The issue type name, such as Bug or Story.
        priority:
          type: string
          description: Absent when the issue has none.
      additionalProperties: false

    StatusCategory:
      type: string
      enum: [new, indeterminate, done]

    IssueTracker:
      type: string
      enum: [jira, forge]
      description: >-
        Where the issue lives: Jira, keyed like PROJ-412, or the repository's
        own forge, GitHub or GitLab, keyed by its number.

    IssueDetail:
      type: object
      required: [key, summary, status, status_category, type, tracker, reporter, description, comments, comment_total, url]
      properties:
        key: {type: string}
        tracker: {$ref: "#/components/schemas/IssueTracker"}
        summary: {type: string}
        status: {type: string}
        status_category: {$ref: "#/components/schemas/StatusCategory"}
        type: {type: string}
        priority: {type: string}
        reporter: {type: string}
        assignee:
          type: string
          description: Who the issue is assigned to; absent when no one is.
        description: {type: string}
        url:
          type: string
          description: >-
            The issue in the tracker's own web interface, for a link to open.
            Empty when the tracker's base URL cannot be read; never carries the
            base URL's username or password.
        comments:
          type: array
          description: Oldest first.
          items: {$ref: "#/components/schemas/Comment"}
        comment_total:
          type: integer
          description: The total on the issue, which may exceed those returned.
      additionalProperties: false

    Comment:
      type: object
      required: [author, body, created]
      properties:
        author: {type: string}
        body: {type: string}
        created:
          type: string
          format: date-time
          description: RFC 3339; the zero time if the tracker's date was unreadable.
      additionalProperties: false

    CommentRequest:
      type: object
      description: A comment to post on an issue.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          description: >-
            The comment, written as Markdown when jira.markdown_comments is on
            as last saved, and as Jira wiki markup otherwise.
      additionalProperties: false

    Branch:
      type: object
      required: [name, detached, head, upstream, push_remote, ahead, behind, base, commits, issue_link]
      properties:
        name: {type: string}
        issue_link:
          type: string
          description: >-
            The issue the branch was linked to by hand, for work begun outside
            workflow; empty when it was never linked.
        detached:
          type: boolean
          description: Whether HEAD is detached rather than on a branch.
        head:
          type: string
          description: >-
            The commit SHA; empty before the first commit, and in a write's
            answer when the branch could not be read back after the write
            landed.
        upstream:
          type: string
          description: The tracking branch; empty if never pushed.
        push_remote:
          type: string
          description: >-
            The remote a push of the branch goes to: remote.pushDefault when
            the repository sets one, origin otherwise.
        ahead: {type: integer}
        behind: {type: integer}
        base:
          type: string
          description: The base branch, such as origin/main.
        commits:
          type: array
          description: The commits on this branch since its base.
          items: {$ref: "#/components/schemas/Commit"}
      additionalProperties: false

    Commit:
      type: object
      required: [hash, subject, unpushed]
      properties:
        hash: {type: string}
        subject: {type: string}
        unpushed:
          type: boolean
          description: >-
            Whether the commit is one not yet pushed, which alone staged
            changes can be amended or fixed up into. A branch with more
            commits than are read marks none.
      additionalProperties: false

    ChangeList:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: {$ref: "#/components/schemas/Change"}
      additionalProperties: false

    Change:
      type: object
      required: [path, kind, staged, has_unstaged, conflicted]
      properties:
        path: {type: string}
        original_path:
          type: string
          description: The former path for a rename or copy; absent otherwise.
        kind:
          type: string
          description: What kind of change this is.
          enum: [modified, new, deleted, renamed, copied, untracked, conflicted]
        staged:
          type: boolean
          description: Whether the change (or part of it) is staged.
        has_unstaged:
          type: boolean
          description: Whether there are unstaged edits to the same path.
        conflicted:
          type: boolean
      additionalProperties: false

    Review:
      type: object
      required: [found, announced]
      properties:
        found:
          type: boolean
          description: Whether a pull request was found for the branch.
        pull:
          description: The branch's pull request; absent when none is found.
          nullable: true
          allOf: [{$ref: "#/components/schemas/PullRequest"}]
        ci:
          description: >-
            The pull request's CI; absent when none is found, the pull request
            is not open, or its CI cannot be read — unless the event stream
            holds the CI last read for the same pull request at the same head.
          nullable: true
          allOf: [{$ref: "#/components/schemas/CI"}]
        ci_error:
          description: >-
            Why the open pull request's CI could not be read; absent when it
            was, or was not asked about. The detail is curated, never a host
            or a credential.
          nullable: true
          allOf: [{$ref: "#/components/schemas/Problem"}]
        issue:
          description: >-
            The issue the branch and its pull request are for; absent when none
            is named.
          nullable: true
          allOf: [{$ref: "#/components/schemas/LinkedIssue"}]
        announced:
          type: boolean
          description: >-
            Whether the pull request was already announced at the moment it
            is at now — ready for review, its CI red, merged — from the
            browser, the terminal or workflow announce, as the store
            remembers. The store is read at most once every
            timing.ci_interval, and never under --dry-run, when this is
            always false.
      additionalProperties: false

    LinkedIssue:
      type: object
      required: [key, tracker, url, origin]
      properties:
        key:
          type: string
          description: The issue's key, a forge number without its #.
        tracker: {$ref: "#/components/schemas/IssueTracker"}
        url:
          type: string
          description: The issue's page, for a link to open; empty when the tracker gives none.
        origin:
          type: string
          enum: [by_hand, branch_name, pull_request]
          description: >-
            Where the issue was found: the link the branch was given by hand,
            the branch's name, or the pull request's title or description.
      additionalProperties: false

    ReviewQueue:
      type: object
      required: [available, requests]
      properties:
        available:
          type: boolean
          description: >-
            Whether there is a forge to ask. False outside a repository, and
            when origin is on no forge workflow can read — not GitHub or
            GitLab, or a self-hosted one forge.kind and forge.host do not name
            — and requests is then empty.
        requests:
          type: array
          description: >-
            The open pull or merge requests that ask for your review, the
            longest-waiting first. Empty when none does, or when there is no
            forge to ask.
          items: {$ref: "#/components/schemas/ReviewRequest"}
      additionalProperties: false

    ReviewRequest:
      type: object
      required: [number, url, title, author, repository, draft, ci, opened_at]
      properties:
        number:
          type: integer
          description: The GitHub number or GitLab IID.
        url: {type: string}
        title: {type: string}
        author:
          type: string
          description: Who opened it, and so who asks for the review.
        repository:
          type: string
          description: >-
            The owner/name (GitHub) or group/project (GitLab) it is in, since
            the queue spans repositories; empty when the forge did not say.
          example: jacob-delgado/workflow
        draft: {type: boolean}
        ci:
          $ref: "#/components/schemas/CIState"
        opened_at:
          type: string
          format: date-time
          description: RFC 3339; when it was opened, which is how long it has waited — the zero time if the forge did not give one.
      additionalProperties: false

    TaskList:
      type: object
      description: >-
        Your pending Taskwarrior tasks, and what the server knows of the
        Taskwarrior that answered.
      required: [available, reason, context, sync_available, said, tasks]
      properties:
        available:
          type: boolean
          description: >-
            Whether there is a Taskwarrior to ask: false when it is turned off
            by taskwarrior.disabled, not installed, not Taskwarrior (go-task is
            also called task), too old, never run, or its taskrc has a
            malformed line.
        reason:
          type: string
          description: Why Taskwarrior is not available, safe to show; empty when it is.
        reason_code:
          type: string
          enum: [not_installed, not_taskwarrior, too_old, never_run, turned_off, malformed_taskrc, unavailable]
          description: >-
            Why Taskwarrior is not available, as a code the page can act on
            without reading reason: not installed, a task program that is not
            Taskwarrior (go-task, most likely), too old, never run, turned off
            by taskwarrior.disabled, a taskrc with a malformed line, or
            unavailable for a reason workflow doctor explains, or taskwarrior
            settings saved since workflow started, which apply once it
            restarts. Absent when Taskwarrior is available.
        context:
          type: string
          description: The name of Taskwarrior's active context, whose filter the list applies; empty for none.
        sync_available:
          type: boolean
          description: Whether the taskrc names a sync backend, so a sync has somewhere to go.
        said:
          type: string
          description: >-
            What the write this list answers has to add: how many operations
            an undo reverted, what a sync printed, or that a tracked issue's
            task was created but not annotated. Empty otherwise.
        added:
          type: string
          description: >-
            The uuid of the task the write this list answers added — an add or
            a track — so the page can name it even when the active context
            leaves it out of tasks. Absent after any other write, and on a
            read.
        tasks:
          type: array
          description: >-
            The pending tasks of the active context, most urgent first, waiting
            ones included. Empty when Taskwarrior is not available.
          items: {$ref: "#/components/schemas/Task"}
      additionalProperties: false

    TasksSummary:
      type: object
      description: >-
        What the event stream carries of your Taskwarrior tasks: the started
        one, as active — absent when none is started — and every task linked
        to an issue. Until Taskwarrior has answered both reads the summary
        makes, it is not available, with no active task and no linked one.
      required: [available, reason, linked]
      properties:
        available:
          type: boolean
          description: >-
            Whether Taskwarrior answered: false when there is none to ask, as
            in TaskList, and when it was found but could not be read.
        reason:
          type: string
          description: Why Taskwarrior is not available, safe to show; empty when it is.
        active: {$ref: "#/components/schemas/Task"}
        linked:
          type: array
          description: >-
            Every task linked to an issue, whatever its status but deleted,
            and whatever context hides it. Empty unless available.
          items: {$ref: "#/components/schemas/Task"}
      additionalProperties: false

    Task:
      type: object
      description: >-
        One task as Taskwarrior holds it. A date the task does not have is
        absent, never the zero time.
      required: [uuid, id, description, status, project, priority, tags, entry, modified, urgency, annotations, issue_key, issue_url]
      properties:
        uuid:
          type: string
          example: 5f3c9a1e-8b2d-4c6f-9e7a-1d2b3c4d5e6f
        id:
          type: integer
          description: The working-set number; 0 for a task not in the working set.
        description: {type: string}
        status:
          type: string
          enum: [pending, completed, deleted, waiting, recurring]
        project:
          type: string
          description: Empty when the task has none.
        priority:
          type: string
          description: H, M, L or empty.
        tags:
          type: array
          items: {type: string}
        due: {type: string, format: date-time}
        wait:
          type: string
          format: date-time
          description: Until when the task is hidden from the list's usual reports.
        scheduled: {type: string, format: date-time}
        until:
          type: string
          format: date-time
          description: When Taskwarrior deletes the task.
        start:
          type: string
          format: date-time
          description: When the task was started; present only while it is.
        end:
          type: string
          format: date-time
          description: When the task was completed or deleted.
        entry:
          type: string
          format: date-time
          description: When the task was created.
        modified:
          type: string
          format: date-time
          description: When the task last changed.
        urgency:
          type: number
          format: double
          description: Taskwarrior's own urgency; the list is ordered by it.
        annotations:
          type: array
          description: The notes on the task, oldest first.
          items: {$ref: "#/components/schemas/TaskAnnotation"}
        issue_key:
          type: string
          description: The issue the task is linked to, from its jiraid attribute; empty when it tracks none.
          example: PROJ-412
        issue_url:
          type: string
          description: >-
            The issue's page: the tracker's, for a task naming an issue where
            the tracker builds issue pages (Jira); otherwise (the forge's issues
            as the tracker, or a task naming no issue) the task's jiraurl
            attribute when it is an http or https address; empty otherwise.
      additionalProperties: false

    TaskAnnotation:
      type: object
      description: A note on a task, and when it was written.
      required: [entry, description]
      properties:
        entry: {type: string, format: date-time}
        description: {type: string}
      additionalProperties: false

    OpenedPullRequest:
      type: object
      description: A pull request that was just opened, with a warning when it
        opened but its reviewers, assignees or labels could not all be added,
        and what can be offered next.
      required: [pull, follow_ups]
      properties:
        pull: {$ref: "#/components/schemas/PullRequest"}
        warning:
          type: string
          description: Set only when the pull opened but adding its reviewers,
            assignees or labels did not fully succeed, so a partial success is
            not reported as a failure.
        follow_ups:
          type: array
          description: >-
            What the browser can offer now that the pull request is open, in
            the order the terminal offers them — the link, then the move. Empty
            when the branch names no Jira issue, or neither applies.
          items: {$ref: "#/components/schemas/FollowUp"}
      additionalProperties: false

    FollowUp:
      type: object
      description: >-
        One offer after opening: to link the pull request on the branch's issue
        (POST /api/issues/{key}/link), or to move that issue to the review
        status (POST /api/issues/{key}/transition). A move is offered only when
        Jira offers one that needs no fields.
      required: [action, issue_key]
      properties:
        action:
          type: string
          enum: [link, transition]
        issue_key:
          type: string
          description: The Jira issue the checked-out branch names.
          example: PROJ-412
        status:
          type: string
          description: Set only on a transition — the status the issue would move to.
          example: In Review
      additionalProperties: false

    MovedIssue:
      type: object
      description: An issue that was just moved, and the status it is now in.
      required: [key, status]
      properties:
        key:
          type: string
          example: PROJ-412
        status:
          type: string
          example: In Review
      additionalProperties: false

    StatusChange:
      type: object
      description: >-
        A status change the tracker offers an issue, and the fields it cannot
        be made without.
      required: [id, name, to_status, to_status_category, fields]
      properties:
        id:
          type: string
          description: The change's id, which applying it names.
          example: "5"
        name:
          type: string
          description: The change's own name, which can differ from where it leads.
          example: Resolve Issue
        to_status:
          type: string
          example: Resolved
        to_status_category: {$ref: "#/components/schemas/StatusCategory"}
        fields:
          type: array
          description: The fields the tracker refuses the change without, ordered by name.
          items: {$ref: "#/components/schemas/StatusChangeField"}
      additionalProperties: false

    StatusChangeField:
      type: object
      description: A field a status change needs, and how it is filled.
      required: [id, name, kind, options]
      properties:
        id:
          type: string
          example: resolution
        name:
          type: string
          example: Resolution
        kind:
          type: string
          enum: [option, option_list, text, user, date, only_jira]
          x-enum-varnames: [FieldOptionKind, FieldOptionListKind, FieldTextKind, FieldUserKind, FieldDateKind, FieldOnlyJiraKind]
          description: >-
            How the field is filled: one of its options, any number of them,
            free text, a username, a date as 2026-09-21, or only_jira for one
            only Jira's own screen can fill, such as a cascading select, which
            keeps the change out of reach here.
        options:
          type: array
          description: The values an option or option_list field allows; empty for the others.
          items: {$ref: "#/components/schemas/FieldOption"}
      additionalProperties: false

    FieldOption:
      type: object
      description: One value a field allows.
      required: [id, name]
      properties:
        id: {type: string, example: "1"}
        name: {type: string, example: Fixed}
      additionalProperties: false

    StatusChangeRequest:
      type: object
      description: The status change to make, and a value for each field it needs.
      required: [transition_id, fields]
      properties:
        transition_id:
          type: string
          minLength: 1
          description: The change's id, as GET /api/issues/{key}/transitions lists it.
        fields:
          type: array
          description: A value for each field the change needs, and no other.
          items: {$ref: "#/components/schemas/FieldEntry"}
      additionalProperties: false

    FieldEntry:
      type: object
      description: >-
        The value given a field: option_id for an option field, option_ids for
        an option_list field, and text for a text, user or date field.
      required: [id]
      properties:
        id:
          type: string
          description: The field's id.
        option_id:
          type: string
        option_ids:
          type: array
          items: {type: string}
        text:
          type: string
      additionalProperties: false

    AssignRequest:
      type: object
      description: Whom to assign an issue to.
      required: [assignee]
      properties:
        assignee:
          type: string
          minLength: 1
          maxLength: 255
          description: The username, as the issue's tracker knows it.
      additionalProperties: false

    AssignedIssue:
      type: object
      description: An issue just assigned, and to whom.
      required: [key, assignee]
      properties:
        key: {type: string, example: PROJ-412}
        assignee: {type: string, example: ana.lopez}
      additionalProperties: false

    WorklogRequest:
      type: object
      description: Time spent on a Jira issue, and an optional note.
      required: [time_spent]
      properties:
        time_spent:
          type: string
          minLength: 1
          maxLength: 64
          description: The duration in Jira's words, such as 2h, 30m or 1d 4h.
        comment:
          type: string
          description: A note on the work; left out, the worklog carries none.
      additionalProperties: false

    LoggedWork:
      type: object
      description: Work just logged on an issue, as Jira recorded it.
      required: [key, time_spent]
      properties:
        key: {type: string, example: PROJ-412}
        time_spent:
          type: string
          description: The duration as Jira recorded it.
          example: 2h
      additionalProperties: false

    PullRequest:
      type: object
      required: [number, url, title, state, draft, approvals, changes_requested, mergeable]
      properties:
        number:
          type: integer
          description: The GitHub number or GitLab IID.
        url: {type: string}
        title: {type: string}
        state:
          type: string
          enum: [open, merged, closed]
          description: >-
            Whether it is still open, has merged, or was closed without merging.
            The branch's pull request is found open or merged; a merged one has
            no CI to report.
        draft: {type: boolean}
        approvals: {type: integer}
        changes_requested: {type: boolean}
        mergeable:
          type: string
          enum: [unknown, clean, conflicts]
      additionalProperties: false

    CI:
      type: object
      required: [state, total, done, failed, checks]
      properties:
        state: {$ref: "#/components/schemas/CIState"}
        total:
          type: integer
          description: Total checks; 0 on a forge that reports the pipeline whole.
        done: {type: integer}
        failed: {type: integer}
        checks:
          type: array
          items: {$ref: "#/components/schemas/Check"}
      additionalProperties: false

    Check:
      type: object
      required: [name, state, url]
      properties:
        name: {type: string}
        state: {$ref: "#/components/schemas/CIState"}
        url: {type: string}
        id:
          type: string
          description: The forge's own id for the check, so its log can be asked for; absent for a status.
        stage:
          type: string
          description: The pipeline stage a GitLab job ran in; absent on GitHub.
        reason:
          type: string
          description: Why a failed check failed, in the forge's few words; absent when it gives none.
        log_available:
          type: boolean
          description: Whether the forge serves the check's log.
      additionalProperties: false

    JobLog:
      type: object
      required: [text, truncated]
      properties:
        text:
          type: string
          description: The log's last lines, with every terminal control taken out.
        truncated:
          type: boolean
          description: Whether the log ran on before the lines kept.
      additionalProperties: false

    CIState:
      type: string
      enum: [none, running, passed, failed]

    MessagingDestination:
      type: object
      required: [service, configured, channel, channels, author]
      properties:
        service:
          type: string
          description: The service posts go to — Slack, Teams, Discord or webhook.
        configured:
          type: boolean
          description: >-
            Whether a transport is set up to post — a user token or a webhook. A
            webhook service has no channel, so channel presence cannot stand in
            for this.
        channel:
          type: string
          description: The default channel; empty when a webhook carries its own.
        channels:
          type: array
          description: The default first, then the alternates.
          items: {type: string}
        author:
          type: string
          description: Who a post would come from; empty if not resolved.
      additionalProperties: false

    Config:
      type: object
      description: >-
        The whole configuration file. On a read, the six secret fields and the
        Jira header values are masked; on a write, a masked or empty secret keeps
        the stored value, and null removes it.
      required: [version, jira, messaging, forge, ui, timing, branch, commit, pull_request, store, taskwarrior, issues]
      properties:
        version: {type: string}
        jira: {$ref: "#/components/schemas/JiraConfig"}
        messaging: {$ref: "#/components/schemas/MessagingConfig"}
        forge: {$ref: "#/components/schemas/ForgeConfig"}
        ui: {$ref: "#/components/schemas/UIConfig"}
        timing: {$ref: "#/components/schemas/TimingConfig"}
        branch: {$ref: "#/components/schemas/BranchConfig"}
        commit: {$ref: "#/components/schemas/CommitConfig"}
        pull_request: {$ref: "#/components/schemas/PullRequestConfig"}
        store: {$ref: "#/components/schemas/StoreConfig"}
        taskwarrior: {$ref: "#/components/schemas/TaskwarriorConfig"}
        issues: {$ref: "#/components/schemas/IssuesConfig"}
      additionalProperties: false

    SetupOffer:
      type: object
      description: The first-run setup offered where the server works.
      required: [needed, places, keychain]
      properties:
        needed:
          type: boolean
          description: No configuration file applies where the server works, so one can be set up.
        places:
          type: array
          description: Where the file may go, the repository first.
          items: {$ref: "#/components/schemas/SetupPlace"}
        keychain:
          type: boolean
          description: The OS keychain can keep the Jira token out of the file.
      additionalProperties: false

    SetupPlace:
      type: object
      required: [place, path, shown]
      properties:
        place: {$ref: "#/components/schemas/SetupPlaceName"}
        path: {type: string, description: "The file it would be, as an absolute path."}
        shown: {type: string, description: "The file written from your home."}
      additionalProperties: false

    SetupPlaceName:
      type: string
      description: >-
        repository is the repository's root, or the working directory outside
        a repository; home is the home directory.
      enum: [repository, home]

    SetupRequest:
      type: object
      required: [place, jira_base_url, jira_token, webhook_url, keychain, keep_unchecked]
      properties:
        place: {$ref: "#/components/schemas/SetupPlaceName"}
        jira_base_url:
          type: string
          description: Jira's address; empty leaves Jira out, and the forge's issues are the tracker.
        jira_token:
          type: string
          description: The Jira personal access token. Never echoed back.
        webhook_url:
          type: string
          description: A Slack incoming webhook, saved unchecked; empty posts with the Slack user token.
        keychain:
          type: boolean
          description: Keep the Jira token in the OS keychain rather than in the file.
        keep_unchecked:
          type: boolean
          description: >-
            Write Jira's address and token even when Jira does not accept them,
            or cannot be asked. An address that is no http or https address, or
            that carries a username and password, is never kept.
      additionalProperties: false

    SetupResult:
      type: object
      required: [path, shown, jira_user, keychain, not_ignored, reopened]
      properties:
        path: {type: string, description: "The file written, as an absolute path."}
        shown: {type: string, description: "The file written from your home."}
        jira_user:
          type: string
          description: Whom the token authenticates as; empty when Jira was left out or kept unchecked.
        keychain:
          type: boolean
          description: The OS keychain keeps the token, and the file the command that reads it back.
        not_ignored:
          type: boolean
          description: The file is in a repository that does not ignore it, so it could be committed.
        reopened:
          type: boolean
          description: >-
            The server works with the file now. False when it could not take
            it up, which a restart of workflow --web does.
      additionalProperties: false

    JiraConfig:
      type: object
      required: [token]
      properties:
        base_url: {type: string}
        token:
          type: string
          nullable: true
          description: >-
            Masked on read, or empty when none is stored; on write, empty or
            masked keeps the stored value and null removes it.
        token_command: {type: string}
        token_env: {type: string}
        user: {type: string}
        headers:
          type: object
          additionalProperties: {type: string}
          nullable: true
          description: >-
            Extra request headers; values masked on read. On write, a value
            empty or masked keeps the stored one, and a header left out is
            removed.
        views:
          type: array
          items: {$ref: "#/components/schemas/JiraView"}
          nullable: true
        project: {type: string}
        markdown_comments:
          type: boolean
          description: Post comments written in Markdown as Jira's wiki markup.
        review_status:
          type: string
          description: The status an issue moves to once its pull request is open, e.g. "In Review". Empty makes no offer.
      additionalProperties: false

    MessagingConfig:
      type: object
      required: [client_secret, refresh_token, webhook_url]
      properties:
        kind:
          type: string
          description: >-
            The service posts go to. Empty is read as slack. It decides the
            message body and link markup the notifier sends.
          enum: ["", slack, teams, discord, webhook]
        client_id:
          type: string
          description: >-
            The Slack app's client ID, which its rotating user token is
            refreshed with. Slack only; set together with webhook_url it is
            refused. Not a secret.
        client_secret:
          type: string
          nullable: true
          description: >-
            The Slack app's client secret, when this file keeps the user token's
            credentials rather than the macOS keychain. Masked on read, or empty
            when none is stored; on write, empty or masked keeps the stored
            value, and null removes it with the access token.
        refresh_token:
          type: string
          nullable: true
          description: >-
            The user token's current refresh token (xoxe-1-…), when this file
            keeps it. workflow replaces it on every refresh. Masked on read, or
            empty when none is stored; on write, empty or masked keeps the
            stored value, and null removes it with the access token.
        access_token:
          type: string
          description: >-
            The user token's current access token (xoxe.xoxp-…), when this file
            keeps it. workflow replaces it on every refresh. Masked on read;
            empty or masked on write keeps the stored value. It goes when the
            client secret or the refresh token is removed.
        expires_at:
          type: string
          description: When the access token expires, RFC 3339 UTC; written by workflow.
        webhook_url:
          type: string
          nullable: true
          description: >-
            A credential: masked on read, or empty when none is stored; on
            write, empty or masked keeps the stored value and null removes it.
        channel: {type: string}
        channels:
          type: array
          items: {type: string}
          nullable: true
        announcement: {type: string}
      additionalProperties: false

    ForgeConfig:
      type: object
      required: [token]
      properties:
        kind:
          type: string
          description: Empty for auto-detect, else github or gitlab.
          enum: ["", github, gitlab]
        host: {type: string}
        token:
          type: string
          nullable: true
          description: >-
            Masked on read, or empty when none is stored; on write, empty or
            masked keeps the stored value and null removes it.
        cli: {type: boolean}
      additionalProperties: false

    UIConfig:
      type: object
      properties:
        mouse: {type: boolean}
        ascii: {type: boolean}
        color:
          type: string
          description: Empty for auto, or "never".
          enum: ["", never]
        notify: {type: boolean}
        comments_shown:
          type: integer
          minimum: 0
          description: How many comments the detail shows; 0 means the built-in default.
        keys:
          type: object
          additionalProperties: {type: string}
          nullable: true
          description: Map from a key action to the key that triggers it; see the configuration docs for the actions.
        web_shortcuts:
          type: boolean
          description: >-
            Whether the web page's single-key shortcuts are on. Off unless set;
            ? and the command palette work either way.
      additionalProperties: false

    KeyList:
      type: object
      required: [single_key_shortcuts, actions]
      properties:
        single_key_shortcuts:
          type: boolean
          description: Whether a single key pressed outside a text field acts (ui.web_shortcuts).
        actions:
          type: array
          items: {$ref: "#/components/schemas/KeyAction"}
      additionalProperties: false

    KeyAction:
      type: object
      description: One action the terminal interface binds, as its help lists it.
      required: [action, help, group, shown, keys, default]
      properties:
        action:
          type: string
          description: The action's name, as ui.keys names it, e.g. comment.
        help:
          type: string
          description: The words the help says it in, e.g. change status.
        group:
          type: string
          description: The help group it is listed under, e.g. Issues.
        shown:
          type: string
          description: The key the help shows, e.g. c, or 1-9 for the pane numbers.
        keys:
          type: array
          items: {type: string}
          description: Every key that triggers it, in the terminal's names, e.g. c, C, ctrl+e.
        default:
          type: string
          description: The key the help shows for it with no ui.keys entry, e.g. c.
      additionalProperties: false

    TimingConfig:
      type: object
      properties:
        request_timeout:
          type: string
          description: A Go duration such as 20s; empty for the default.
        ci_interval:
          type: string
          description: A Go duration; empty for the default.
      additionalProperties: false

    BranchConfig:
      type: object
      properties:
        template:
          type: string
          description: The branch-name template; must contain {key}.
        prefixes:
          type: object
          additionalProperties: {type: string}
          nullable: true
        default_prefix: {type: string}
        slug_limit:
          type: integer
          description: The summary slug's length cap in a branch name; zero keeps 48.
      additionalProperties: false

    PullRequestConfig:
      type: object
      properties:
        title_source:
          type: string
          description: >-
            Where a pull request's title comes from: "commit" (the default) takes
            the branch's oldest commit, "issue" takes the issue it names.
      additionalProperties: false

    StoreConfig:
      type: object
      properties:
        disabled:
          type: boolean
          description: >-
            Turn off the on-disk store, keeping nothing between sessions. Off by
            default: the store is on and never holds a secret.
      additionalProperties: false

    IssuesConfig:
      type: object
      properties:
        forge:
          type: boolean
          description: >-
            List the issues assigned to you on this repository's own forge,
            GitHub or GitLab, beside Jira's. Set per repository, over the home
            file's default.
      additionalProperties: false

    TaskwarriorConfig:
      type: object
      properties:
        program:
          type: string
          description: >-
            The task program to run: a name looked up on PATH, or a path. Empty
            tries every task in an absolute PATH directory and keeps the first
            that is Taskwarrior 3.5.0 or newer.
        disabled:
          type: boolean
          description: >-
            Turn off the Taskwarrior integration even where Taskwarrior is
            installed.
      additionalProperties: false

    CommitConfig:
      type: object
      properties:
        default_scope: {type: string}
        types:
          type: array
          description: >-
            The commit types the composer offers and validates against, in order;
            empty keeps the built-in Conventional Commit types.
          items: {type: string}
          nullable: true
        subject_limit:
          type: integer
          description: The longest a subject may be, in characters; zero keeps 72.
        refs_trailer:
          type: string
          description: >-
            The issue trailer's label, such as "Closes"; empty keeps "Refs".
      additionalProperties: false

    JiraView:
      type: object
      required: [name, jql]
      properties:
        name: {type: string}
        jql:
          type: string
          description: >-
            The query the view searches: a configured view's JQL narrowed to
            the issues assigned to you, unless it already names the assignee.
      additionalProperties: false

    Activity:
      type: object
      required: [from, to, today, sources, years, text]
      properties:
        from: {type: string, description: "The period's first day, YYYY-MM-DD."}
        to: {type: string, description: "The period's last day, YYYY-MM-DD."}
        today:
          type: string
          description: The day it is where the server runs, YYYY-MM-DD, so a later period is not offered.
        sources:
          type: array
          description: Each source asked, in a fixed order, and how its read went.
          items: {$ref: "#/components/schemas/ActivitySource"}
        years:
          type: array
          items: {$ref: "#/components/schemas/ActivityYear"}
        text:
          type: string
          description: The summary as Markdown, ready to copy.
        post_length:
          $ref: "#/components/schemas/PostLength"
      additionalProperties: false

    PostLength:
      type: object
      description: >-
        How long the summary's text is once rendered for the messaging service
        set up, as that service measures it, against the most it takes. Left
        out where no messaging is set up, or where the service names no limit
        (a plain webhook). A post longer than the limit is refused with
        too_long, and nothing is sent.
      required: [service, count, limit, unit]
      properties:
        service: {type: string, description: "The service the summary would be posted to, such as Discord."}
        count: {type: integer, description: "The text's length, rendered for the service."}
        limit: {type: integer, description: "The most the service takes."}
        unit:
          type: string
          enum: [characters, bytes]
          description: >-
            What count and limit are counted in: characters, or bytes of the
            whole payload for Teams, whose limit is put that way.
      additionalProperties: false

    ActivityPostRequest:
      type: object
      description: The period a Summary is of, its Markdown to post, and where.
      required: [from, to, text]
      properties:
        from: {type: string, description: "The period's first day, YYYY-MM-DD."}
        to: {type: string, description: "The period's last day, YYYY-MM-DD."}
        text:
          type: string
          maxLength: 40000
          description: The Summary's Markdown, as GET /api/activity wrote it or as it was edited.
        channel:
          type: string
          maxLength: 200
          description: The channel to post to; empty or left out uses the configured channel or the webhook.
      additionalProperties: false

    ActivityPost:
      type: object
      description: A Summary as it was posted.
      required: [from, to, channel, destination, text]
      properties:
        from: {type: string, description: "The period's first day, YYYY-MM-DD."}
        to: {type: string, description: "The period's last day, YYYY-MM-DD."}
        channel:
          type: string
          description: The channel it was posted to, or empty for a webhook's own channel.
        destination:
          type: string
          description: >-
            Where it went, in words: the channel, or the channel its webhook is
            bound to.
        text:
          type: string
          description: The Markdown posted, before it was rendered for the service.
      additionalProperties: false

    ActivitySource:
      type: object
      required: [source, name, state, truncated, detail]
      properties:
        source: {$ref: "#/components/schemas/ActivitySourceName"}
        name:
          type: string
          description: The source as a sentence starts with it, such as "Jira".
        state: {$ref: "#/components/schemas/ActivitySourceState"}
        truncated:
          type: boolean
          description: The source had more than it gave.
        detail:
          type: string
          description: >-
            Why the source is not set up and how to set it up, or why it could not be read, in words that
            never name a host or a path; empty when it was read. When several repositories were read, each
            that could not be is named in its own clause.
      additionalProperties: false

    ActivityYear:
      type: object
      required: [year, months]
      properties:
        year: {type: integer}
        months:
          type: array
          items: {$ref: "#/components/schemas/ActivityMonth"}
      additionalProperties: false

    ActivityMonth:
      type: object
      required: [month, name, days]
      properties:
        month: {type: integer, minimum: 1, maximum: 12}
        name: {type: string, description: "The month's name, such as October."}
        days:
          type: array
          items: {$ref: "#/components/schemas/ActivityDay"}
      additionalProperties: false

    ActivityDay:
      type: object
      required: [date, weekday, hours]
      properties:
        date: {type: string, description: "The day, YYYY-MM-DD."}
        weekday: {type: string, description: "The day of the week, such as Friday."}
        hours:
          type: array
          items: {$ref: "#/components/schemas/ActivityHour"}
      additionalProperties: false

    ActivityHour:
      type: object
      required: [label, items]
      properties:
        label:
          type: string
          description: >-
            The hour as the clock showed it, such as 09:00, with its zone added
            when the clocks showed it twice that day.
        items:
          type: array
          items: {$ref: "#/components/schemas/ActivityItem"}
      additionalProperties: false

    ActivityItem:
      type: object
      required: [at, source, verb, ref, title, url, repository]
      properties:
        at: {type: string, format: date-time}
        source: {$ref: "#/components/schemas/ActivitySourceName"}
        verb:
          type: string
          description: What was done, such as "committed" or "moved".
        ref:
          type: string
          description: What it was done to, such as a commit's hash, PROJ-412 or o/r#42.
        title: {type: string}
        url:
          type: string
          description: A link to it, or empty where there is none.
        repository: {type: string}
      additionalProperties: false

    ActivitySourceName:
      type: string
      description: A place work leaves a trace.
      enum: [git, tasks, jira, forge]

    ActivitySourceState:
      type: string
      description: >-
        How the source answered: read; not_set_up, when there was nothing set
        up to ask — no credential, no forge the origin names, no Taskwarrior
        installed, no git user.email — so it was left out; or failed, when a
        source that is set up was asked and could not be read.
      enum: [read, not_set_up, failed]
      x-enum-varnames: [ActivitySourceRead, ActivitySourceNotSetUp, ActivitySourceFailed]
