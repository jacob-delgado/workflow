# Hugo configuration for the workflow documentation site.
#
# Build:   task docs:build   (what CI runs too — there is one build path)
# Preview: task docs:serve
#
# The theme arrives as a Hugo Module, which is Go's module system: the exact
# version is pinned in docs/go.mod and docs/go.sum, and updating it is a
# reviewable diff rather than a moving target. That also keeps the site
# Node-free, which the rest of this repo already is.

baseURL = "https://jacob-delgado.github.io/workflow/"
# `locale`, not `languageCode`: the latter is deprecated as of Hugo 0.158.
locale = "en-us"
title = "workflow"

# The theme renders the left navigation from the content tree, so a new page
# needs no menu entry — only a weight if it should not sort alphabetically.
[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[markup]
  [markup.goldmark.renderer]
    # The generated command reference contains no HTML, and neither does the
    # prose. Leaving raw HTML off keeps a stray tag from silently breaking a page.
    unsafe = false
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  BookTheme = "auto"
  BookToC = true
  BookRepo = "https://github.com/jacob-delgado/workflow"
  # "Edit this page" points at the source file on the default branch.
  BookEditPath = "edit/main/docs"
  BookSearch = true
  # The section holding the documentation tree; the home page sits outside it.
  BookSection = "docs"
