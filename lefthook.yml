# Lefthook git hooks.
# Install:  mise install && lefthook install   (lefthook is pinned in mise.toml)
# Skip one hook for one commit: LEFTHOOK_EXCLUDE=name-of-hook git commit ...
# Skip all hooks for one commit: LEFTHOOK=0 git commit ...
#
# Pre-commit hooks run against ONLY the staged diff ({staged_files}); pre-push
# runs the test suite, so a green push is very likely a green CI.
#
# DO NOT reach for `LEFTHOOK=0` to get past a blocked commit. A failing hook is
# the hook working — fix the underlying issue. The only legitimate bypass is a
# genuinely emergent hotfix.
#
# Deliberately NOT here: govulncheck. It scans the whole dependency tree and
# belongs in `task check` and CI, where the seconds it costs don't land on every
# commit.
#
# gitleaks used to sit alongside it for the same reason. It runs here now in its
# STAGED-DIFF form, which costs a fraction of a whole-tree scan: this project's
# subject is live API tokens, and a secret is the one class of mistake that a
# later `task check` cannot undo — by then it is in the history.

pre-commit:
  parallel: true
  commands:
    # golangci-lint owns formatting (gofmt, gofumpt, goimports, gci per
    # .golangci.yml); `fmt` applies it, then `run --fix` lints and autofixes.
    # --new-from-rev keeps the hook scoped to what this commit changes.
    golangci-lint-fmt:
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    # --new-from-rev keeps the hook scoped to what this commit changes, but HEAD~
    # does not exist on a repository's first commit — and a hook that errors out
    # there is a hook that teaches you to pass --no-verify on day one. Fall back
    # to linting everything when there is no parent.
    golangci-lint:
      glob: "*.go"
      run: |
        if git rev-parse --verify --quiet HEAD~ >/dev/null; then
          golangci-lint run --new-from-rev=HEAD~ --fix
        else
          golangci-lint run --fix
        fi
      stage_fixed: true

    license-headers:
      glob: "*.go"
      run: scripts/check-license-headers.sh {staged_files}

    shfmt:
      glob: "*.sh"
      run: shfmt -i 2 -ci -bn -w {staged_files}
      stage_fixed: true

    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}

    hadolint:
      glob: "*Dockerfile*"
      run: hadolint {staged_files}

    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint

    # American English, repo-wide. --force-exclude keeps _typos.toml's excludes
    # effective even though lefthook passes files as explicit arguments.
    typos:
      run: typos --force-exclude {staged_files}

    markdownlint:
      glob: "*.md"
      run: markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

    taplo:
      glob: "*.toml"
      run: taplo fmt {staged_files}
      stage_fixed: true

    # actionlint (above) checks that a workflow is valid; zizmor checks that it
    # is safe — script injection, over-broad permissions, mutable action refs.
    zizmor:
      glob: ".github/workflows/*.{yml,yaml}"
      run: zizmor --no-progress {staged_files}

    # Secret scan of the staged diff. This repo's whole subject is API tokens,
    # so catching one before it enters a commit is worth the second it costs;
    # `task secrets` still sweeps the working tree, and CI still sweeps history.
    gitleaks:
      run: gitleaks git --staged --redact --no-banner

# Pre-push: the tests, plus the two whole-tree checks that a staged-diff hook
# cannot see. A red result here is a guaranteed red CI, and learning that
# locally costs seconds instead of a CI round trip.
pre-push:
  parallel: false
  commands:
    unit-go:
      glob: "{*.go,go.mod,go.sum}"
      run: go test -race ./...

    # The pre-commit hook runs golangci-lint with --new-from-rev=HEAD~, so it
    # only ever sees the lines this commit changed. That is the right trade for
    # a per-commit hook and it means gocyclo, gocognit and funlen never look at
    # a function that grew in a file this commit did not touch. This closes it.
    lint-go-all:
      glob: "{*.go,go.mod,go.sum}"
      run: golangci-lint run

    # Deliberately no glob: file length changes by editing a file, and a commit
    # that only moves or renames one still changes which paths are measured.
    file-length:
      run: scripts/check-file-length.sh

# Commit-message format check: Conventional Commits, e.g.
#   feat(jira): add issue transition command
#   fix(config): reject unknown keys instead of ignoring them
commit-msg:
  commands:
    conventional:
      run: |
        first_line=$(head -n1 "{1}")
        if echo "$first_line" | grep -qE '^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert|style)(\([a-z0-9_-]+\))?!?: .+'; then
          exit 0
        fi
        echo "Commit subject must follow Conventional Commits format:"
        echo "  <type>(<scope>)?(!)?: <description>"
        echo "  e.g. feat(jira): add issue transition command"
        echo "       fix(config): reject unknown keys instead of ignoring them"
        echo "Allowed types: feat, fix, chore, docs, refactor, test, perf, build, ci, revert, style"
        echo "Bypass: LEFTHOOK_EXCLUDE=conventional git commit ..."
        exit 1
