# mise — the toolchain manager (https://mise.jdx.dev).
#
# Single source of truth for every tool the build, the gates and CI use but
# yamllint. The Taskfile runs the recipes; mise provisions the binaries they
# call, and build/Dockerfile reads its versions from this file
# (scripts/tool-versions.sh), all but yamllint's and its own Go. Its Go is
# decided by its base image's digest, and the image build fails unless that is
# the Go pinned below. A tool the image downloads (node, shellcheck, jq,
# lefthook, typos, hadolint, taplo, zizmor) also carries its SHA-256s in
# build/tool-checksums.txt, so a bump here replaces its lines there; `task
# lint` names any that are missing.
#
# yamllint is pinned in build/yamllint/requirements.txt instead, with every
# package of its tree by version and wheel hash, and `task tools` installs it
# into tmp/tools/bin, which [env] puts on PATH below and CI's jobs add to
# theirs, and the image installs from the same file. A pin here would name
# yamllint alone, and mise would resolve its dependencies afresh at every
# install, with no hash and outside the age gate. Trade-off TRADE-53: mise
# install alone no longer provides every linter.
#
# After cloning:   mise trust && mise install && task setup
# Update a pin:    edit below, then `mise install`
#
# Every tool is pinned to an EXACT version, deliberately. A floating "latest"
# changes what the gate accepts without anyone deciding to change it — a lint
# bump that flags new code should land as its own commit, with the fixes it
# forces. Adopt a version only once it is at least 7 days old (freshly
# compromised releases are usually caught and yanked within days); a version
# that fixes a disclosed CVE overrides that wait, always.
#
# mise cannot pin its own binary from here — it reads this file only once it is
# already installed — so the workflows pin the mise version they install
# (`version:` on jdx/mise-action) and the devcontainer pins the one it downloads,
# with its checksums. scripts/check-mise-version.sh (`task lint`) fails unless
# every one of those equals this floor, so a bump here moves them all at once.
min_version = "2026.10.8"

[env]
# Pin the toolchain so `go build`/`go test` use the Go below rather than
# silently downloading whatever go.mod's directive resolves to.
GOTOOLCHAIN = "local"
# What `task tools` installs from the pin files under build/, ahead of the
# rest of PATH in any shell mise activates.
_.path = ["tmp/tools/bin"]

[tools]
# Language runtime — keep in step with go.mod's `go` directive.
go = "1.27.2"

# The task runner itself, so `mise install` bootstraps everything on a clean
# machine (laptop, container or CI runner) with no manual step.
task = "3.54.0"

# Gates. golangci-lint is exact-pinned twice over: the version decides what
# the lint gate flags, so a bump is a deliberate commit that carries its fixes.
golangci-lint = "2.14.0"
lefthook = "2.2.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
typos = "1.51.1"
actionlint = "1.7.12"
hadolint = "2.15.1"      # build/Dockerfile lint
taplo = "0.10.0"         # TOML lint + format
# Security audit of the Actions workflows. actionlint checks that a workflow is
# valid; zizmor checks that it is safe — script injection, over-broad
# permissions, a mutable action reference.
zizmor = "1.30.1"
# node is the runtime the npm: tools below need. mise installs an npm: tool but
# not a node to run it under, so a clean machine that relied on an ambient node
# would run `task lint` against a different one than CI. Held on the 24.x line —
# the last the web toolchain (corepack/yarn, Vite, Vitest) is tested against; 25+
# fails the frontend build here. 24.21.0 is the latest 24.x past the age gate.
node = "24.21.0"
"npm:markdownlint-cli2" = "0.23.3" # Markdown lint + format
# Source-line counting for `task cloc`. Advisory: a report, never a gate.
"npm:cloc" = "2.6.0-cloc"

# jq does the per-package arithmetic in scripts/gobco-report.sh and
# scripts/coverage-summary.sh. Pinned here so `task check` on a clean machine
# does not depend on whichever jq happens to be installed.
jq = "1.8.2"

# The documentation site (docs/). The EXTENDED build is required: the Hugo Book
# theme compiles SCSS, which the standard build cannot do.
hugo-extended = "0.167.0"

# Backend live-reload for `task dev`: air rebuilds and restarts `workflow --web`
# on any .go change while Vite hot-reloads the frontend. A dev convenience, never
# a gate. v1.67.4 was published 2026-08-01, well past the age gate above.
air = "1.67.4"

# Go-source tools, built with the pinned Go above. A prebuilt binary compiled
# against an older Go can reject a project targeting a newer one.
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# Condition coverage. Exact-pinned twice over: gobco's version changes
# the number it reports, and that number is a gate here (BRANCH_COVERAGE_MIN in
# Taskfile.yml), so a bump must be a deliberate commit that carries its fixes.
"go:github.com/rillig/gobco" = "1.3.4"
# Secret scanning. (The module path stayed at zricethezav after the project
# moved to github.com/gitleaks.)
"go:github.com/zricethezav/gitleaks/v8" = "8.30.1"
# Whole-program dead code: what is unreachable from main. golangci-lint's
# `unused` is intra-package, so it cannot see an exported identifier in an
# internal package that nothing imports — measured, not assumed. Advisory
# (`task deadcode`), never a gate: a helper reached only by tests is dead to
# this tool but not to the project.
"go:golang.org/x/tools/cmd/deadcode" = "0.52.0"
