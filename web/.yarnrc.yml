nodeLinker: node-modules

# Supply-chain guard: refuse package versions published less than 7 days ago
# (compromised releases are usually detected and yanked within days). CVE fixes
# override the cooldown — a version that fixes a disclosed vulnerability is
# trusted regardless of age. When one is genuinely needed, add a version-scoped
# npmPreapprovedPackages entry ('pkg@x.y.z'), dated with its CVE, and delete it
# once that version ages past the gate. See CLAUDE.md.
npmMinimalAgeGate: 10080

# Peer requirements a package's manifest gets wrong, which yarn would
# otherwise warn of on every install:
packageExtensions:
  # @axe-core/playwright names playwright-core only for its types (its Page);
  # the playwright-core @playwright/test brings provides them, so the peer is
  # optional here rather than a second copy to keep in step with the first.
  '@axe-core/playwright@*':
    peerDependenciesMeta:
      playwright-core:
        optional: true
  # eslint-plugin-testing-library hands typescript on to @typescript-eslint/utils
  # without asking for it; this project provides it, as it does to the rest of
  # typescript-eslint.
  eslint-plugin-testing-library@*:
    peerDependencies:
      typescript: '*'
  # goober names csstype only for its types, which the page never reads: the
  # devtools ship it compiled, so the peer is optional rather than a package
  # added for nothing.
  goober@*:
    peerDependenciesMeta:
      csstype:
        optional: true
